            }

            100% {
                transform: rotateY(90deg) scale(0.98);
                opacity: 0;
                filter: brightness(0.8);

        .scrollbar-hide::-webkit-scrollbar {

    <script>
        const bookData = [
            { type: 'cover', title: 'Miles of Silence', subtitle: '10,300 Kilometres of Becoming', author: 'By Girish </br><b>A Travel Memoir</b>' },
            { type: 'chapter', id: 'author', title: 'About the Author', chapter: 'Prologue', stats: 'Girish', image: 'images/author.jpg', desc: '<p>Girish is a traveler at heart and a software engineer by profession. Born and raised in Mysuru, Karnataka, he has always believed that the best way to understand life is by stepping outside comfort zones and exploring the unknown.</p><p>Over the years, Girish has traveled extensively across India on his motorcycle, covering tens of thousands of kilometers through mountains, forests, deserts, villages, and highways.</p><p>But this journey was different.</p><p>In a 52-day solo ride across India, he traveled thousands of kilometers through the North-East, the Himalayas, remote villages, and unfamiliar roads. Along the way he faced mechanical breakdowns, freezing temperatures, unexpected challenges, and countless beautiful moments with strangers who became friends.</p><p>What started as a ride across the country slowly turned into a journey within.</p><p>Through silence, solitude, and endless roads, Girish discovered something deeper — courage, clarity, humility, and the simple joy of living in the present moment.</p><p>This is not just a travel story.<br>It is a reflection of the road, the people, the struggles, and the lessons that transformed him along the way.</p><a href="https://instagram.com/tru_lving" target="_blank" rel="noopener noreferrer" class="text-sm font-sans font-bold text-book-accent tracking-widest uppercase hover:text-gray-500 transition-colors duration-300 border-b border-book-accent pb-1">Follow on Instagram</a>', quote: '"What started as a ride across the country slowly turned into a journey within."' },
            { type: 'chapter', id: 'map', title: 'The Journey at a Glance', chapter: 'Overview', stats: '10,300 KM', image: 'images/map.jpg', desc: '<p><strong>Duration:</strong> 52 Days<br><strong>Mode:</strong> A Solo Motorcycle Ride<br><strong>Distance:</strong> Thousands of kilometers, measured not just in miles… but in moments<br><strong>Start:</strong> Mysuru, Karnataka<br><strong>End:</strong> Mysuru, Karnataka</p><p><strong>The Route</strong><br>From the familiar roads of the South…<br>Through the heart of Central India…<br>Into the chaos and spirituality of the North…<br>Across the untouched beauty of the North-East…<br>Up into the mountains of Arunachal Pradesh…<br>And then… slowly, quietly… back home.</p><p><strong>Places That Became Stories</strong><br>Mysuru • Bengaluru • Davangere • Hubli • Vijayapura • Latur • Yavatmal • Jabalpur • Prayagraj • Ayodhya • Varanasi • Bodh Gaya • Rewa • Patna • Siliguri • Guwahati<br>Shillong • Cherrapunji • Dawki • Kaziranga • Kohima • Dzukou Valley • Khonoma • Imphal • Aizawl • Mizoram • Agartala • Tripura • Jampui Hills • Tawang<br>Arunachal Pradesh • Assam • Nagaland • Manipur • West Bengal • Bihar • Madhya Pradesh • Maharashtra • Karnataka • Mysuru (Return).</p><p>But this journey was never just about places on a map.</p><p>It was about strangers who became family.<br>Roads that tested me.<br>Moments that slowed me down.<br>And silence that taught me more than words ever could.</p><p>Because in the end,<br>this wasn’t just a route across India.</p><p>It was a journey within.</p>', quote: '“52 days, countless roads… and a version of myself I had never met before.”' },
            { type: 'chapter', id: 'ch1', title: 'Before the Road Began', chapter: 'Ch  1', stats: 'Confusion', image: 'images/chapter-1.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Thought That Wouldn’t Leave</h4><p>Long journeys rarely begin on the road.<br>They begin quietly… inside the mind.</p><p>For months before December,<br>the idea of travelling had been circling somewhere within me.</p><p>It wasn’t a clear plan.<br>No map pinned on the wall.<br>No detailed itinerary.<br>No fixed dates.</p><p>It was just a feeling.</p><p>Sometimes while working…<br>sometimes during quiet evenings…<br>sometimes while looking at my bike parked outside —<br>a thought would appear:</p><p>What if I just start riding?</p><p>Not for a weekend trip.<br>Not for a few hundred kilometres.<br>But for something longer.<br>Something uncertain.</p><h4 class="font-bold text-xl mt-6 mb-2">Between Routine and Restlessness</h4><p>Still… the thought remained only a thought.</p><p>Life continued as usual.<br>Work.<br>Routine.<br>Responsibilities.</p><p>Everything moved in its normal rhythm.</p><p>Until 6th December.</p><h4 class="font-bold text-xl mt-6 mb-2">A Start Without Clarity</h4><p>That morning,<br>I packed my bags.</p><p>Not with excitement.<br>Not with heroic determination.<br>With confusion.</p><p>No grand announcement.<br>No dramatic farewell.<br>No clear promise to myself.</p><p>Even while packing,<br>my mind kept asking simple questions:</p><p>Why am I doing this?<br>Is this even necessary?<br>Maybe I will ride for a day… and come back.</p><p>When I finally started the bike<br>and rode out of Mysuru,<br>it didn’t feel like the beginning of a great adventure.</p><p>It felt temporary.<br>Almost like a test.</p><h4 class="font-bold text-xl mt-6 mb-2">The First Sign</h4><p>Twenty kilometres later…<br>the first pause happened.</p><p>I realised something important —<br>I had forgotten my driving licence,<br>RC,<br>and PUC documents.</p><p>I stopped the bike by the roadside.<br>Removed my helmet.</p><p>And just… sat there.</p><p>The road was quiet.</p><p>Inside my mind,<br>another thought appeared:</p><p>Maybe this is a sign.<br>Was I meant to return?<br>Or was I subconsciously looking for an excuse to turn back?</p><h4 class="font-bold text-xl mt-6 mb-2">Turning Back</h4><p>After a few minutes,<br>I turned the bike around<br>and rode back home.</p><p>I picked up the documents,<br>repacked everything,<br>and started again.</p><p>But that moment had already revealed something.</p><p>I wasn’t fully committed… yet.</p><h4 class="font-bold text-xl mt-6 mb-2">Standing at the Edge</h4><p>The road ahead was familiar.</p><p>My first destination was Davangere,<br>where a friend’s wedding was taking place.</p><p>Externally,<br>it looked simple —<br>a man riding to attend a marriage.</p><p>Internally…<br>it felt different.</p><p>It felt like I was standing<br>at the edge of something undefined.</p><p>The questions kept returning while riding.</p><p>Why am I doing this?<br>What am I looking for?<br>Am I escaping something?<br>Or searching for something?</p><h4 class="font-bold text-xl mt-6 mb-2">A Familiar Warmth</h4><p>By evening,<br>I reached Davangere.</p><p>Unexpectedly,<br>I met a group of friends there —<br>people I had earlier met during a solo trekking trip.</p><p>They welcomed me warmly.<br>Offered me a place to stay.<br>Took care of me… without asking many questions.</p><p>On a day filled with doubt,<br>their warmth felt reassuring.</p><p>The wedding was joyful.<br>Music.<br>Laughter.<br>Celebration.</p><p>Everything a wedding should be.</p><h4 class="font-bold text-xl mt-6 mb-2">Still at the Beginning</h4><p>But even while smiling and talking with friends,<br>a quiet voice inside continued whispering:</p><p>You don’t have to continue.</p><p>That night,<br>after returning close to 1 AM,<br>I lay awake longer than usual.</p><p>Technically,<br>the journey had already begun.</p><p>But emotionally…<br>I was still at the starting line.</p>', quote: '"Internally, it felt different. It felt like I was standing at the edge of something undefined."' },
            { type: 'chapter', id: 'ch2', title: 'The Safety of the Known', chapter: 'Ch  2', stats: 'Comfort', image: 'images/chapter-2.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Moment of Completion</h4><p>The wedding ended beautifully.<br>There was food.<br>Conversation.<br>The familiar comfort of community.</p><p>For a moment… life felt simple.</p><h4 class="font-bold text-xl mt-6 mb-2">Choosing the Familiar</h4><p>After meeting another college friend,<br>I made a safe decision.</p><p>I would ride to Hubli.</p><p>Not because it was part of a master plan.<br>But because a close friend lived there.</p><p>Somewhere familiar.<br>Somewhere grounding.</p><h4 class="font-bold text-xl mt-6 mb-2">A Ride Without Adventure</h4><p>The ride did not feel adventurous.</p><p>It felt like extending a visit…<br>rather than beginning an expedition.</p><h4 class="font-bold text-xl mt-6 mb-2">Comfort in Connection</h4><p>When I reached Hubli,<br>there was warmth again.</p><p>Home-cooked food.<br>Effortless conversations.<br>The kind of silence… that doesn’t need explaining.</p><h4 class="font-bold text-xl mt-6 mb-2">The Question of Continuation</h4><p>And slowly…<br>a thought grew stronger:</p><p>Why go further?<br>I was comfortable.</p><p>Why choose uncertainty?</p><h4 class="font-bold text-xl mt-6 mb-2">A Practical Pause</h4><p>That night,<br>stopping the journey didn’t feel like failure.</p><p>It felt… practical.</p>', quote: '"I was comfortable. Why choose uncertainty?"' },
            { type: 'chapter', id: 'ch3', title: 'The Pause That Changed Everything', chapter: 'Ch  3', stats: 'Internal conflict', image: 'images/chapter-3.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Day Without Movement</h4><p>The next day, I did not start.<br>The bike remained parked.<br>The luggage stayed tied.<br>But I stayed.</p><h4 class="font-bold text-xl mt-6 mb-2">An Ordinary Day</h4><p>It was a Monday.<br>I remember that clearly.</p><p>The day moved slowly.<br>A new SIM card.<br>Small errands.<br>Time… spent quietly.</p><p>Nothing extraordinary happened.<br>But internally… everything shifted.</p><h4 class="font-bold text-xl mt-6 mb-2">When Movement Stops</h4><p>When you stop moving physically,<br>your thoughts begin to move faster.</p><p>What am I proving?<br>Do I really want this?<br>Or did I romanticise the idea of a long ride?</p><h4 class="font-bold text-xl mt-6 mb-2">Between Staying and Leaving</h4><p>For a day in Hubli,<br>I existed in between.</p><p>Not returning.<br>Not moving forward.</p><h4 class="font-bold text-xl mt-6 mb-2">Facing the Truth</h4><p>I realised something uncomfortable.</p><p>I was not afraid of distance.<br>I was afraid of commitment.</p><p>If I continued,<br>this would no longer be a “short ride.”</p><p>If I stopped,<br>I would always wonder — what if?</p><h4 class="font-bold text-xl mt-6 mb-2">Stripping Away Illusions</h4><p>This day was necessary.</p><p>It removed excitement.<br>It removed fantasy.</p><p>What remained… was honesty.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Decision</h4><p>By the end of the day,<br>something settled inside me.</p><p>Not motivation.<br>Not adrenaline.<br>Just acceptance.</p><p>No rushing.<br>No forcing.<br>No ego.</p><h4 class="font-bold text-xl mt-6 mb-2">A Promise to Myself</h4><p>If I feel uncomfortable,<br>I will return.</p><p>If I feel steady,<br>I will continue.</p><p>That promise… changed everything.</p><p>It was not a loud decision.<br>There was no excitement.<br>No sudden rush of clarity.</p><p>Just a quiet understanding.</p><p>The journey did not need confidence.<br>It needed honesty.</p><p>And for the first time,<br>I was no longer trying to prove anything.</p><p>I was simply… ready to experience.</p><p>Whatever the road decides next.</p>', quote: '"I was not afraid of distance. I was afraid of commitment."' },
            { type: 'chapter', id: 'ch4', title: 'The Two Days That Looked Like Nothing', chapter: 'Ch  4', stats: 'Decision', image: 'images/chapter-4.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Pause That Stayed</h4><p>It was supposed to be just a stop.<br>Instead… it became a pause.</p><h4 class="font-bold text-xl mt-6 mb-2">Days That Didn’t Move</h4><p>Monday passed.<br>Then Tuesday.</p><p>I did not start.</p><p>The bike remained parked outside… silent.<br>My luggage stayed packed… untouched.</p><p>Every morning,<br>I woke up with the same thought:</p><p>Should I continue?</p><h4 class="font-bold text-xl mt-6 mb-2">Stillness Outside, Conflict Inside</h4><p>But I didn’t move.</p><p>Outwardly,<br>it looked like rest.</p><p>Internally…<br>it was negotiation.</p><h4 class="font-bold text-xl mt-6 mb-2">The Weight of Choice</h4><p>There is a special kind of tension<br>when you are not forced to decide.</p><p>No one was asking me to continue.<br>No one was stopping me either.</p><p>The choice… was entirely mine.</p><p>And that<br>is heavier than pressure.</p><h4 class="font-bold text-xl mt-6 mb-2">Questions That Stay</h4><p>I questioned everything.</p><p>Was this trip necessary?<br>Was I running away from routine?<br>Was I over-romanticising a long ride?</p><h4 class="font-bold text-xl mt-6 mb-2">The Comfort Trap</h4><p>Comfort… is powerful.</p><p>My friend’s home was warm.<br>The food was familiar.<br>The conversations were easy.</p><p>Life felt stable.</p><p>And stability…<br>makes uncertainty look foolish.</p><h4 class="font-bold text-xl mt-6 mb-2">A Voice That Didn’t Leave</h4><p>But somewhere inside,<br>a small voice refused to quiet down.</p><p>If you stop now…<br>will you regret it?</p><h4 class="font-bold text-xl mt-6 mb-2">Not Laziness, But Truth</h4><p>Those two days were not about laziness.</p><p>They were about honesty.</p><p>The excitement of departure had faded.<br>The fantasy of “52 days” did not exist yet.</p><p>There was no big dream in my head.</p><p>Just a simple decision…<br>waiting to be made.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Shift</h4><p>By Tuesday night,<br>something shifted.</p><p>Not dramatically.<br>But clearly.</p><p>I didn’t feel fear anymore.</p><p>I felt responsibility…<br>toward my own choice.</p><p>No excitement.<br>No pressure.<br>Just clarity.</p><p>And sometimes…<br>clarity is the real beginning.</p>', quote: '"Comfort is powerful... And stability makes uncertainty look foolish."' },
            { type: 'chapter', id: 'ch5', title: 'Wednesday – The Real Departure', chapter: 'Ch  5', stats: 'Commitment', image: 'images/chapter-5.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Different Start</h4><p>On Wednesday morning,<br>I woke up early.</p><p>This time…<br>I did not debate.</p><h4 class="font-bold text-xl mt-6 mb-2">No More Doubt</h4><p>I packed properly.<br>Checked everything twice.</p><p>No forgotten document.<br>No symbolic return.</p><p>When I started from Hubli toward Vijayapura,<br>it felt different from the day I left Mysuru.</p><p>That first departure had doubt.<br>This one… had acceptance.</p><h4 class="font-bold text-xl mt-6 mb-2">A Calm Ride</h4><p>There was no rush.<br>No dramatic music playing in my head.<br>No feeling of conquering the world.</p><p>Just… calm.</p><p>The early morning air was cold.<br>Highways were empty.<br>The engine sounded steady beneath me.</p><p>For the first time,<br>I wasn’t thinking about whether I would return.</p><p>I was thinking about…<br>what the road might show me.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Direction</h4><p>Somewhere deep inside,<br>I carried a quiet hope — maybe this journey would take me to Varanasi.</p><p>That city had touched something inside me during my last visit.</p><p>I didn’t know why.<br>But it felt like unfinished business.</p><p>But I wasn’t chasing it.<br>I was allowing the road… to unfold.</p><h4 class="font-bold text-xl mt-6 mb-2">The Real Beginning</h4><p>That ride to Vijayapura was not dramatic.<br>But it was powerful.</p><p>Because it marked the true beginning.</p><p>The journey did not start when I left Mysuru.<br>It started… when I left Hubli.</p><p>That Wednesday morning was not just a continuation.<br>It was a commitment.</p><h4 class="font-bold text-xl mt-6 mb-2">Arriving and Settling</h4><p>After reaching Vijayapura,<br>I checked into a dorm.</p><p>The first thing I ensured… was the parking.</p><p>I looked at the space carefully.<br>Made sure it was safe.</p><p>Then… parked him properly.</p><p>Only after that,<br>I felt settled.</p><h4 class="font-bold text-xl mt-6 mb-2">Back to Routine</h4><p>I freshened up<br>and got back to my routine.</p><p>Work had to continue…<br>even on the road.</p><p>By afternoon,<br>I stepped out for lunch.</p><p>A simple meal.<br>Nothing fancy.</p><p>But it felt grounding.</p><p>I returned,<br>completed my work by around 6 PM,</p><p>and then stepped out again.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unplanned Walk</h4><p>This time…<br>not with a plan.</p><p>Just… for a walk.</p><p>Vijayapura wasn’t new to me.<br>I had memories here — small, quiet ones.</p><p>Without thinking much,<br>my feet took me to a place I had visited before.</p><p>It felt familiar.<br>Comforting… in a different way.</p><p>I sat there for a while.<br>Listening to music.<br>Letting the day… settle.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Evening</h4><p>There was no rush to do anything.<br>No need to explore everything.</p><p>Just being there… was enough.</p><p>Later,<br>I had dinner at the same place.</p><p>Simple food.<br>Familiar surroundings.<br>A quiet sense of closure.</p><p>By around 9:30 PM,<br>I returned to the dorm.</p><p>Took one last look…<br>and went inside.</p><h4 class="font-bold text-xl mt-6 mb-2">Exactly Where I Needed to Be</h4><p>As I lay down that night,<br>there was no overthinking.</p><p>No second guessing.</p><p>Just… a calm acceptance<br>of where I was.</p><p>And for the first time since the journey began,<br>it felt like I was exactly… where I needed to be.</p>', quote: '"The journey began when I stopped doubting myself."' },
            { type: 'chapter', id: 'ch6', title: 'Flow Without Pressure', chapter: 'Ch  6', stats: 'Flow', image: 'images/chapter-6.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Natural Start</h4><p>The next morning,<br>I woke up at 4:30 AM.</p><p>There was no resistance… in getting ready.</p><p>Packing felt natural.<br>Starting early… felt right.</p><h4 class="font-bold text-xl mt-6 mb-2">The Rhythm of the Road</h4><p>The highway toward Latur was smooth and peaceful.</p><p>Cold wind.<br>Empty stretches.<br>Sunrise… unfolding slowly behind me.</p><p>I covered nearly 350 kilometres before 11 AM.</p><p>Earlier in the journey,<br>distance felt intimidating.</p><p>Now…<br>it felt effortless.</p><h4 class="font-bold text-xl mt-6 mb-2">Just Enough</h4><p>When I reached Latur,<br>I found a decent dormitory —</p><p>nothing luxurious,<br>nothing uncomfortable.</p><p>Just… enough.</p><h4 class="font-bold text-xl mt-6 mb-2">From Trip to Lifestyle</h4><p>After settling in,<br>I stepped out to buy small essentials —</p><p>oats for breakfast,<br>a pair of earphones,<br>little practical things<br>that make long travel sustainable.</p><p>These purchases… felt symbolic.</p><p>This was no longer spontaneous.</p><p>It was… lifestyle.</p><h4 class="font-bold text-xl mt-6 mb-2">Balance</h4><p>Afternoon work.<br>Calls.<br>Emails.<br>Focus.</p><p>And in the evening…<br>another calm walk through the city.</p><h4 class="font-bold text-xl mt-6 mb-2">Quiet Grounding</h4><p>Latur was quieter than I expected.</p><p>The streets carried a simplicity<br>that felt grounding.</p><h4 class="font-bold text-xl mt-6 mb-2">A Shift Within</h4><p>As I walked,<br>I realised something important:</p><p>The question —<br>“Should I stop?”</p><p>had completely disappeared.</p><p>The journey wasn’t heavy anymore.</p><p>It had… blended into me.</p>', quote: '"The journey wasn’t heavy anymore. It had blended into me."' },
            { type: 'chapter', id: 'ch7', title: 'A Stranger in Yavatmal', chapter: 'Ch  7', stats: 'Balance', image: 'images/chapter-7.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Steady Ride</h4><p>The following morning,<br>I left early again — this time toward Yavatmal.</p><p>The ride was steady.<br>Uneventful.<br>Peaceful.</p><h4 class="font-bold text-xl mt-6 mb-2">A Small Test of Patience</h4><p>But reaching Yavatmal…<br>tested my patience slightly.</p><p>Finding a budget stay was not easy.</p><p>I searched multiple places.<br>Asked around.<br>Checked prices.</p><p>For a brief moment…<br>irritation tried to surface.</p><p>But this time,<br>I didn’t overreact.</p><p>Eventually,<br>I found a simple room.</p><p>Enough.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unexpected Connection</h4><p>After settling in,<br>something unexpected happened.</p><p>A man approached me<br>after noticing my Karnataka number plate.</p><p>He began speaking fluent Kannada…<br>in Maharashtra.</p><p>I was surprised.</p><p>He was originally from Gujarat,<br>yet he spoke Kannada effortlessly.</p><p>That small connection… felt comforting.</p><p>Like finding familiarity…<br>in an unfamiliar place.</p><p>We spoke for some time.<br>Shared numbers.<br>Laughed about how language connects strangers.</p><p>It was a small moment.</p><p>But on a long solo journey,<br>small human interactions… carry weight.</p><h4 class="font-bold text-xl mt-6 mb-2">Simple Routine</h4><p>That afternoon,<br>I worked.</p><p>Washed my clothes.<br>Organised my luggage.</p><p>In the evening,<br>I went for a quiet walk.</p><h4 class="font-bold text-xl mt-6 mb-2">The Beauty of Balance</h4><p>Yavatmal was calm.<br>Almost meditative.</p><p>For three days now,<br>there had been no dramatic incidents.</p><p>No emotional breakdowns.<br>No intense highs.</p><p>Just… balance.</p><p>Work and travel.<br>Movement and stillness.<br>Solitude and occasional connection.</p><h4 class="font-bold text-xl mt-6 mb-2">Building Something Deeper</h4><p>And I understood something:</p><p>Not every phase of transformation… is loud.</p><p>Some phases…<br>are about building endurance.</p><p>These were not adventure days.</p><p>They were… foundation days.</p>', quote: '"Not every phase of transformation is loud. Some phases are about building endurance."' },
            { type: 'chapter', id: 'ch8', title: 'A Freedom Ride to Jabalpur', chapter: 'Ch  8', stats: 'Bond', image: 'images/chapter-8.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Quiet Morning Ritual</h4><p>I woke up at 6 AM.</p><p>The room was quiet.</p><p>My bike stood outside…<br>slightly dusty from the previous days,<br>but steady.</p><p>Every morning before starting,<br>I would look at him for a second —</p><p>not as metal…<br>but as a companion.</p><h4 class="font-bold text-xl mt-6 mb-2">Beginning with Awareness</h4><p>I packed slowly.</p><p>Checked the luggage straps.<br>Touched the tank lightly.</p><p>And we… rolled out.</p><h4 class="font-bold text-xl mt-6 mb-2">A Ride Without Pressure</h4><p>That day was a freedom ride.</p><p>No rush.<br>No pressure to reach at a fixed time.</p><p>Just open highway…<br>and a calm mind.</p><p>As we crossed into Madhya Pradesh,<br>the roads felt smoother.</p><p>And so did… my thoughts.</p><h4 class="font-bold text-xl mt-6 mb-2">Pauses That Matter</h4><p>I took multiple breaks.</p><p>Sometimes to stretch.<br>Sometimes to sip tea.<br>Sometimes… just to look back at the bike<br>standing under the sun —</p><p>as if we were both<br>adjusting to the rhythm of long travel.</p><h4 class="font-bold text-xl mt-6 mb-2">Simple Encounters</h4><p>Breakfast… somewhere on the way.</p><p>Lunch at a roadside dhaba near Jabalpur<br>around 1 PM.</p><p>The owner was friendly.<br>Curious about the number plate.<br>Asking how far I had come.</p><h4 class="font-bold text-xl mt-6 mb-2">Arriving and Caring</h4><p>By 2:30 PM,<br>we reached Jabalpur.</p><p>I checked into a dormitory.</p><p>Parked him carefully.<br>Covered him lightly.</p><p>Bought fresh engine oil in the evening —<br>a small gesture… of respect.</p><h4 class="font-bold text-xl mt-6 mb-2">More Than Responsibility</h4><p>He had carried me across states…<br>without complaint.</p><p>Maintenance wasn’t responsibility.</p><p>It was… gratitude.</p><h4 class="font-bold text-xl mt-6 mb-2">A Growing Bond</h4><p>The evening was calm.</p><p>A slow city walk.<br>Local food.<br>Mild winter air.</p><p>That night,<br>I slept knowing something had shifted.</p><p>The ride wasn’t heavy anymore.</p><p>It had become… partnership.</p>', quote: '"Maintenance wasn’t responsibility. It was gratitude."' },
            { type: 'chapter', id: 'ch9', title: 'Warmth in Prayagraj', chapter: 'Ch  9', stats: 'Belonging', image: 'images/chapter-9.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Gentle Beginning</h4><p>The morning began slowly.</p><p>Before leaving,<br>I had a conversation with a Kashmiri traveler in the hostel.</p><p>Within minutes,<br>we connected deeply —<br>the kind of connection that only happens<br>when two travelers share road stories.</p><h4 class="font-bold text-xl mt-6 mb-2">Strangers Who Care</h4><p>When I packed<br>and came downstairs,<br>the hostel staff wished me safe travels.</p><p>It’s strange…<br>how strangers start caring about your journey.</p><h4 class="font-bold text-xl mt-6 mb-2">The Ride to Prayagraj</h4><p>We left around 8 AM.</p><p>The road to Prayagraj felt steady.</p><p>Breakfast near Rewa.<br>Long stretches of highway.<br>Cold wind brushing against the visor.</p><p>By 3:40 PM,<br>we reached Prayagraj.</p><p>As I entered my friend’s house compound,<br>I felt something… soften.</p><h4 class="font-bold text-xl mt-6 mb-2">A Home Away from Home</h4><p>His father welcomed me warmly.</p><p>Not formally.<br>Not politely.</p><p>Genuinely.</p><p>There is a difference.</p><p>He checked if I was comfortable,<br>asked about the ride,<br>looked at the bike with curiosity and respect.</p><p>His mother ensured I ate well.</p><p>Care… came naturally from them.</p><h4 class="font-bold text-xl mt-6 mb-2">Walking Through History</h4><p>That evening,<br>I went out to explore the city.</p><p>The winter cold was sharp.</p><p>I bought a few warm clothes.<br>Walked through parks.<br>Let the silence of Prayagraj… settle inside me.</p><p>I also visited Anand Bhavan.</p><p>Walking through that place…<br>felt like stepping into history.</p><p>The walls,<br>the rooms,<br>the quiet surroundings —</p><p>everything carried stories of a different time.</p><p>It made me pause…<br>and reflect.</p><img src="images/chapter-9_0.jpg" alt="" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">The Rhythm of the City</h4><p>Later,<br>I rode through the city roads.</p><p>There was a different rhythm in Prayagraj.</p><p>Not too fast.<br>Not too slow.</p><p>Just… steady.</p><p>Like the city was carrying its history… quietly.</p><h4 class="font-bold text-xl mt-6 mb-2">At the Sangam</h4><p>As the evening deepened,<br>I went toward the Sangam.</p><p>The air felt different there.</p><p>Calmer.<br>Heavier… in a spiritual way.</p><p>And then…<br>I got a chance to witness the Ganga Aarti in Prayagraj.</p><video src="videos/chapter-9_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><h4 class="font-bold text-xl mt-6 mb-2">A Moment of Stillness</h4><p>It was beautiful.</p><p>Not just visually.</p><p>But… emotionally.</p><p>The lamps moved in rhythm.<br>The chants filled the air.<br>The river reflected the light softly.</p><p>For a few moments,<br>I wasn’t thinking about the journey,<br>the road,<br>or the next destination.</p><p>I was just… there.</p><p>Present.</p><p>Standing near the Sangam,<br>watching the Aarti,<br>I felt something settle inside me.</p><p>A kind of calm…<br>that cannot be explained,<br>only experienced.</p><img src="images/chapter-9_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Belonging</h4><p>When I returned home,<br>dinner was shared.</p><p>Conversations flowed.</p><p>I wasn’t a traveler passing through.</p><p>I was treated… like family.</p><p>And my bike rested outside quietly —<br>as if he, too,<br>had found temporary shelter.</p>', quote: '"I arrived as a traveler, but I was welcomed like family."' },
            { type: 'chapter', id: 'ch10', title: 'The Sangam Morning', chapter: 'Ch  10', stats: 'Awakening', image: 'images/chapter-10.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Sacred Morning</h4><p>I woke up early.</p><p>The cold… was intense.</p><h4 class="font-bold text-xl mt-6 mb-2">Toward the Sangam</h4><p>My friend’s cousin took me to the Sangam.</p><img src="images/chapter-10_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The air was misty.<br>Sacred.<br>Silent.</p><p>Before stepping into the water,<br>I looked back once —<br>at my bike parked at a distance.</p><p>He had brought me here.</p><p>From Mysuru.<br>Through doubt.<br>Through hesitation.<br>Through uncertainty.</p><p>Now he stood quietly…<br>as I stepped into something bigger than travel.</p><h4 class="font-bold text-xl mt-6 mb-2">The Moment of Immersion</h4><p>The water was freezing.</p><p>At least… it should have been.</p><p>But when I immersed myself,<br>I didn’t feel the cold… in the way I expected.</p><p>Instead,<br>I felt presence.</p><p>Complete awareness.</p><p>No overthinking.<br>No future plans.<br>No kilometre calculations.</p><p>Just breath.<br>Just water.<br>Just… existence.</p><p>It shocked me.</p><p>How could something so cold…<br>feel so alive?</p><video src="videos/chapter-10_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><h4 class="font-bold text-xl mt-6 mb-2">After the Dip</h4><p>After the dip,<br>we visited a temple.</p><p>Walked through old streets.</p><p>Ate authentic local food —<br>dahi jalebi,<br>kachori —<br>flavours deeply rooted in the city’s culture.</p><h4 class="font-bold text-xl mt-6 mb-2">A City Through His Eyes</h4><p>Back home,<br>I worked for a while.</p><p>In the evening,<br>knowing I would leave the next day,</p><p>my friend’s father took me on a city ride.</p><img src="images/chapter-10_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>He showed me the old city,<br>the local markets,<br>the bazaars —</p><p>not as tourist attractions…<br>but as memories.</p><p>He wanted me to see his Prayagraj.</p><p>That gesture… stayed with me.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Gratitude</h4><p>When I returned<br>and parked my bike for the night,</p><p>I felt gratitude.</p><p>For the road.<br>For the people.<br>For the machine that carried me.</p><p>This journey was no longer about reaching Varanasi someday.</p><p>It was about…<br>living each city fully.</p><h4 class="font-bold text-xl mt-6 mb-2">Witnessing Change</h4><p>And that night,<br>as I lay down to sleep,</p><p>I realised:</p><p>He was not just taking me places.</p><p>He was… witnessing me change.</p>', quote: '"No overthinking. No future plans. No kilometre calculations. Just breath. Just water. Just existence."' },
            { type: 'chapter', id: 'ch11', title: 'Through Fog to Ayodhya', chapter: 'Ch  11', stats: 'Grace', image: 'images/chapter-11.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Difficult Goodbye</h4><p>I woke up around 6 AM.</p><p>My friend’s father and mother had already made coffee.</p><p>The warmth in that house…<br>was difficult to leave.</p><p>Before starting,<br>I took their blessings.</p><h4 class="font-bold text-xl mt-6 mb-2">Riding Through the Unknown</h4><p>Outside,<br>the world was white.</p><p>Dense fog.<br>Sharp cold.</p><video src="videos/chapter-11_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Even though Ayodhya was not far,<br>the visibility was poor.</p><p>The road looked shorter on the map…<br>than it felt in reality.</p><p>I started slightly late.</p><p>The bike moved cautiously through the fog.</p><p>Headlight cutting through mist.</p><p>Every few kilometres,<br>I had to slow down.</p><p>Sometimes… almost stop.</p><p>The cold air entered through my gloves.<br>My visor gathered moisture.</p><p>Trucks appeared suddenly…<br>and disappeared just as fast.</p><p>It wasn’t a difficult ride in distance.</p><p>It was a difficult ride…<br>in patience.</p><h4 class="font-bold text-xl mt-6 mb-2">Arrival and Adjustment</h4><p>By 11:45 AM,<br>I reached Ayodhya.</p><p>But the first small challenge… waited there.</p><p>The stay I had booked… was full.</p><p>For a moment,<br>irritation tried to rise.</p><p>But the owner quickly arranged another property nearby —<br>closer to the temple.</p><p>And strangely…<br>it turned out better.</p><p>Sometimes,<br>what doesn’t work…<br>is redirection.</p><h4 class="font-bold text-xl mt-6 mb-2">A Small Sign</h4><p>Before checking in,<br>I made sure my bike was parked in a safe place.</p><p>That always came first.</p><p>And then…<br>something unexpected happened.</p><p>The same room was given to a solo rider before me.</p><p>She had booked it for three days…<br>but she was checking out that very day.</p><p>I stood there for a moment…<br>just observing how things unfold.</p><p>A solo rider…<br>making space for another solo rider.</p><p>It felt like one of those small signs the road gives you —<br>quiet… but meaningful.</p><h4 class="font-bold text-xl mt-6 mb-2">Kindness That Stays</h4><p>The new stay was clean.<br>The owner was extremely polite.</p><p>It was near the temple —<br>a blessing in disguise.</p><p>And trust me,<br>the owner and his father were genuinely kind and supportive.</p><p>They didn’t just manage the place —<br>they cared.</p><p>We spoke for some time in the evening.</p><p>His father listened with so much interest<br>as I shared my journey —<br>about the travel,<br>the work,<br>the balance I was trying to maintain.</p><p>He seemed happy hearing it.</p><p>Not impressed…<br>just genuinely happy.</p><p>That kind of response…<br>stays with you.</p><h4 class="font-bold text-xl mt-6 mb-2">A Sacred City</h4><p>After settling in,<br>I continued with my work.</p><p>Balance remained —<br>even here.</p><p>In the afternoon,<br>I stepped out for lunch<br>and bought a few clothes —<br>I had run out.</p><p>Walking through Ayodhya…<br>felt different from other cities.</p><p>There was devotion in the air.</p><p>Even the silence…<br>felt sacred.</p><h4 class="font-bold text-xl mt-6 mb-2">An Evening Without Direction</h4><p>In the evening,<br>I went out again.</p><p>The mist had settled over the roads.</p><img src="images/chapter-11_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Lights near the temple…<br>glowed softly through the fog.</p><p>For a moment,<br>everything felt unreal.</p><p>Like the city was breathing… slowly.</p><p>I walked without direction.<br>Without purpose.</p><p>Just… being present.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Happiness</h4><p>And honestly…<br>I was happy.</p><p>Not in a loud way.<br>But in a quiet… complete way.</p><p>When I returned,<br>I looked at him for a moment.</p><p>He had brought me here.</p><p>Not just to a city.</p><p>But… to something deeper.</p>', quote: '"It wasn’t a difficult ride in distance. It was a difficult ride in patience."' },
            { type: 'chapter', id: 'ch12', title: 'Faith in Stone and Silence', chapter: 'Ch  12', stats: 'Reverence', image: 'images/chapter-12.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Sacred Beginning</h4><p>The next morning in Ayodhya,<br>I woke up early.</p><p>The air was cold…<br>but clear.</p><p>I walked toward the Ram Mandir<br>around 6:30 AM.</p><h4 class="font-bold text-xl mt-6 mb-2">Stepping Into Something Larger</h4><p>Security was tight.<br>Discipline everywhere.<br>Devotion in every face.</p><p>And when I entered…</p><p>For a moment,<br>it didn’t feel real.</p><p>The structure,<br>the scale,<br>the atmosphere —</p><p>it felt cinematic.</p><p>Like stepping into a historical epic.</p><img src="images/chapter-12_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Yet it was alive.<br>Breathing.<br>Sacred.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Alignment</h4><p>The energy inside the temple<br>was powerful… but controlled.</p><p>No chaos.<br>No shouting.</p><p>Just… focused devotion.</p><p>When I stood there for darshan,<br>I felt something quiet inside me… align.</p><h4 class="font-bold text-xl mt-6 mb-2">Layers of Time</h4><p>Afterward,<br>I visited Hanuman Garhi temple.</p><p>The climb.<br>The chants.<br>The view —</p><p>everything carried depth.</p><p>Ayodhya wasn’t just a city.</p><p>It felt… layered with time.</p><h4 class="font-bold text-xl mt-6 mb-2">Simple Grounding</h4><p>Later,<br>I had breakfast at Bengaluru Café —</p><p>warm food…<br>in cold weather.</p><p>A simple meal,<br>that felt grounding<br>after the intensity of the temple.</p><h4 class="font-bold text-xl mt-6 mb-2">A Meeting Meant to Happen</h4><p>Then came the queue<br>for the Mangala Aarti pass.</p><p>That’s where… I met him.</p><p>A sadhu from Ujjain.</p><p>We began talking casually.</p><p>Within minutes,<br>the conversation turned deep.</p><p>He had lived on the road.</p><p>His knowledge wasn’t theoretical —<br>it was experiential.</p><p>He spoke about solo travel<br>as a form of discipline.</p><p>About fear… not being the enemy,<br>but a teacher.</p><p>About how journeys…<br>strip ego quietly.</p><p>His wisdom felt ocean-like —<br>calm… but vast.</p><p>Standing in that queue,<br>sharing stories with a wandering monk,</p><p>I felt… humbled.</p><p>We were both travelers.</p><p>Different directions.<br>Same road.</p><h4 class="font-bold text-xl mt-6 mb-2">A Day of Stillness</h4><p>After completing KYC verification<br>and receiving the pass<br>for the 3 AM Mangala Aarti,</p><p>I walked back slowly<br>through the streets.</p><p>The rest of the day was peaceful.</p><p>I worked for a while.<br>Took long walks through Ayodhya.<br>Observed people.<br>Sat with tea.</p><p>Watched the evening lights<br>near the temple glow<br>through winter mist.</p><h4 class="font-bold text-xl mt-6 mb-2">Awaiting the Sacred</h4><p>That night,<br>I felt anticipation.</p><p>Tomorrow… would be sacred.</p>', quote: '"We were two travelers — different directions, but guided by the same road within."' },
            { type: 'chapter', id: 'ch13', title: 'The Night of Fire and the Road to Kashi', chapter: 'Ch  13', stats: 'Surrender', image: 'videos/chapter-13.mp4', desc: '<h4 class="font-bold text-xl mt-6 mb-2">Before Dawn</h4><p>I woke up at 2:30 AM.</p><p>After taking a bath,<br>I stepped out…<br>and started walking toward the temple.</p><p>The roads were covered in dense fog.<br>Cold air… cut through my body.</p><p>Yet,<br>I kept walking.</p><p>Slowly.<br>Quietly.</p><p>Toward something…<br>I couldn’t fully explain.</p><img src="images/chapter-13_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Crossing Thresholds</h4><p>When I reached the temple,<br>I surrendered my phone and keys at the cloakroom.</p><p>From there,<br>the process began.</p><p>There were multiple checkpoints — five in total.</p><p>At each one,<br>Aadhaar and passes were verified carefully.</p><p>No rush.<br>No chaos.<br>Just discipline.</p><p>And then…<br>I entered.</p><p>Trust me —<br>it felt like I was entering heaven.</p><h4 class="font-bold text-xl mt-6 mb-2">A Space Beyond Words</h4><p>The previous day,<br>the experience had been different.</p><p>But this time…<br>it felt like the gates had opened.</p><p>There was fog inside.<br>A deep, calming silence.</p><p>Literally…<br>pin-drop silence.</p><p>I was fully present.</p><p>In the moment.<br>Not thinking.<br>Not analysing.</p><p>Just… being.</p><p>I cannot fully express it in words.</p><p>But it was one of the most beautiful experiences of my life.</p><h4 class="font-bold text-xl mt-6 mb-2">The Divine Moment</h4><p>Then…<br>the Mangala Aarti began.</p><p>The chants.<br>The rhythm.<br>The lamps moving in harmony.</p><p>Everything felt divine.</p><p>Not like a ritual being performed…<br>but something being lived.</p><h4 class="font-bold text-xl mt-6 mb-2">A Rare Blessing</h4><p>And then…<br>something unexpected happened.</p><p>I got access to the Ram Darbar<br>on the first floor.</p><p>Very few people are allowed there each day —<br>maybe around 30.</p><p>And somehow…<br>I was one of them.</p><p>I felt incredibly fortunate.</p><p>Standing there…<br>witnessing the darshan…</p><p>it felt unreal.</p><p>The idol of Ram felt powerful,<br>yet deeply calming.</p><p>A connection…<br>that didn’t need explanation.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Shift</h4><p>After spending some time there,<br>I slowly walked out.</p><p>Collected my phone.<br>Returned to my stay by 4:30 AM.</p><p>But something inside me…<br>had shifted.</p><p>Silently.<br>Permanently.</p><h4 class="font-bold text-xl mt-6 mb-2">Back to the Road</h4><p>Rested briefly.</p><p>And by 7 AM,<br>I started toward Varanasi.</p><p>Only 130 kilometres.<br>But the fog…<br>made it feel longer.</p><p>Till Sultanpur,<br>the road was slippery.</p><p>Visibility low.</p><p>Every kilometre…<br>demanded attention.</p><h4 class="font-bold text-xl mt-6 mb-2">A Sudden Reminder</h4><p>Around 70 kilometres before Varanasi,<br>I made a mistake.</p><p>I stopped on the roadside<br>to send a work email.</p><p>Within minutes,<br>a few men arrived in a car.</p><p>At first,<br>casual questions.</p><p>“Where are you from?”<br>“How much does the bike cost?”</p><p>Then…<br>one of them picked up my helmet.</p><p>Another suggested I sit in their car…<br>while someone else “checked” the bike.</p><p>The tone changed.</p><p>Not loud.<br>But not comfortable.</p><p>In that moment,<br>my instincts activated.</p><p>Thankfully,<br>another rider approached.</p><p>He sensed it.</p><p>His presence…<br>shifted everything.</p><p>Later he told me quietly,</p><p>“Never stop like this on the road.<br>If you need to work,<br>stop at a dhaba or petrol bunk.”</p><p>I nodded.</p><p>The moment passed.</p><p>But the lesson stayed.</p><p>The road had reminded me —<br>awareness… must never drop.</p><h4 class="font-bold text-xl mt-6 mb-2">Choosing Responsibility</h4><p>I continued carefully<br>and reached Varanasi by afternoon.</p><p>Then began the search.</p><p>Finding a stay with safe parking…<br>was difficult.</p><p>Narrow gallis.<br>Confusing lanes.<br>Parking chaos near the ghats.</p><p>Everywhere I asked —<br>no parking…<br>or unsafe space.</p><p>I refused to compromise.</p><p>He had carried me this far.</p><p>I would not leave him vulnerable.</p><p>Finally,<br>I found a place.</p><p>Near the ghats.<br>With parking.</p><p>Expensive.</p><p>The parking cost…<br>almost equal to the room.</p><p>I paid.</p><p>Without hesitation.</p><p>Because safety is not expense.</p><p>It is… respect.</p><h4 class="font-bold text-xl mt-6 mb-2">An Evening in Kashi</h4><p>After settling in,<br>I walked toward the ghats.</p><video src="videos/chapter-13_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Visited Annapoorna Temple.<br>Then Kashi Vishwanath.</p><p>And slowly…<br>evening unfolded.</p><h4 class="font-bold text-xl mt-6 mb-2">Where Time Stands Still</h4><p>The Ganga Aarti began.</p><img src="images/chapter-13_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The river… dark and endless.</p><p>Priests… in perfect rhythm.</p><p>I first sat behind.<br>Quietly observing.</p><p>Then…<br>I met a few people from Gorakhpur.</p><p>We spoke.</p><p>And they offered me…<br>a place in front.</p><p>Closer.</p><p>More intimate.</p><p>It felt…<br>meant to happen.</p><p>Sometimes,<br>we don’t plan.</p><p>We are guided.</p><h4 class="font-bold text-xl mt-6 mb-2">Fire, Sound, Silence</h4><p>The first bell rang.</p><p>Then chants.</p><p>Then flames.</p><video src="videos/chapter-13_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Large lamps moved in rhythm.</p><p>Smoke rose like prayer.</p><p>The fire reflected in water.</p><p>The air… vibrated.</p><p>I stood there —<br>speechless.</p><p>Not emotional in a loud way.</p><p>But… overwhelmed.</p><p>It felt ancient.<br>Timeless.</p><p>Like centuries of devotion…<br>held in one moment.</p><p>People sang softly.<br>Instruments echoed.</p><p>Boats floated…<br>with silent observers.</p><p>Time disappeared.</p><p>I didn’t record much.</p><p>I didn’t want to.</p><p>Some moments…<br>are meant to stay within.</p><h4 class="font-bold text-xl mt-6 mb-2">A Night That Stayed</h4><p>I sat by the river<br>till almost 11 PM.</p><p>Watching.<br>Listening.<br>Breathing.</p><p>After the aarti,<br>a deep peace settled.</p><p>I walked slowly along the ghats.</p><p>That evening…<br>became memory.</p><p>Not loud.<br>But permanent.</p><p>When I finally walked back at 11:30 PM,<br>and saw my bike parked safely…</p><p>I smiled.</p>', quote: '"From doubt in Mysuru… To the fire of Kashi. The journey had changed shape. And so had I."' },
            { type: 'chapter', id: 'ch14', title: 'Living Kashi', chapter: 'Ch  14', stats: 'Belonging', image: 'videos/chapter-14.mp4', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Morning with the River</h4><p>I woke up at 6:30 AM.</p><p>The city was still waking up.</p><p>Without rushing,<br>I walked toward the ghats.</p><p>The air was crisp.<br>The river calm.</p><p>Morning light…<br>just beginning to touch<br>the surface of the Ganga.</p><p>I took a small boat ride.</p><video src="videos/chapter-14_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>It was surprisingly inexpensive —<br>but priceless in experience.</p><p>Sitting on that wooden boat,<br>watching the ghats from the water,</p><p>I felt something shift… again.</p><p>From the river,<br>Kashi looks different.</p><img src="images/chapter-14_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>More ancient.<br>More layered.<br>More eternal.</p><p>The weather was chill.<br>The water moved gently.</p><p>People were bathing.<br>Praying.<br>Sitting quietly.</p><h4 class="font-bold text-xl mt-6 mb-2">Two Sides of Kashi</h4><p>After spending time on the riverbank,<br>I returned around 8 AM.</p><p>Freshened up.<br>And stepped out again.</p><p>This time… toward BHU.</p><p>Banaras Hindu University.</p><p>Since my bike was parked inside the narrow lanes near the ghats,<br>I had to walk a few kilometres before finding transport.</p><p>Eventually,<br>I took a bike taxi.</p><p>The campus felt spacious.<br>Calm.</p><p>A contrast…<br>to the intensity of the ghats.</p><p>I visited the New Kashi Vishwanath Temple inside BHU.</p><p>The architecture was clean.<br>Serene.</p><p>Devotion there felt quieter.<br>Less crowded.<br>More reflective.</p><h4 class="font-bold text-xl mt-6 mb-2">Life Continues</h4><p>By afternoon,<br>I returned.</p><p>Had breakfast.<br>Started my work around 12:30 PM.</p><p>Even in Kashi…<br>work continued.</p><h4 class="font-bold text-xl mt-6 mb-2">Walking Without Purpose</h4><p>But something interesting happened later.</p><p>Around 2:30 PM,<br>I saw people distributing food.</p><p>Without planning,<br>I joined.</p><p>I accepted prasad…<br>and walked along the ghats.</p><p>Nearly 2 to 4 kilometres.</p><p>That walk felt grounding.</p><p>No rush.<br>Just steps.<br>River.<br>People.</p><p>Life… unfolding.</p><h4 class="font-bold text-xl mt-6 mb-2">Returning to the Flame</h4><p>I returned around 5:30 PM.</p><p>Rested briefly.<br>And stepped out again.</p><p>The Ganga Aarti… pulled me back.</p><p>Even though I had seen it the previous evening,<br>I wanted to experience it again.</p><p>It was just 200 meters from my stay.</p><p>This time,<br>I stood differently.</p><p>Not overwhelmed.<br>Not shocked.</p><p>But… aware.</p><p>The flames rose again.<br>The chants echoed.<br>The bells rang.</p><p>And I understood…</p><p>why people return<br>again and again.</p><h4 class="font-bold text-xl mt-6 mb-2">Conversations That Appear</h4><p>Afterward,<br>I went to Kashi Vishwanath Temple once more.</p><p>Inside,<br>I met a few people.</p><p>Strangers…<br>who quickly became companions.</p><p>Among them was a girl<br>who stood quietly for nearly 45 minutes,</p><p>just observing the rituals.</p><p>We spoke briefly.</p><p>About faith.<br>About presence.</p><p>About how some places…<br>silence you without effort.</p><h4 class="font-bold text-xl mt-6 mb-2">Familiarity in the Unfamiliar</h4><p>Around 9 PM,<br>I stepped out.</p><p>Went to Annapoorna Temple for dinner.</p><p>Simple food.<br>Sacred space.</p><p>Then something unexpected.</p><p>Near the temple area,<br>in the narrow, chaotic lanes,</p><p>I met a group of Kannada-speaking men<br>from North Karnataka.</p><p>In Kashi.</p><p>Thousands of kilometres from home.</p><p>We spoke like old friends.</p><p>They were proud to see someone riding solo from Karnataka.</p><p>Their energy felt familiar.<br>Encouraging.</p><p>We took a few photos.<br>Laughed.</p><p>That random encounter…<br>felt comforting.</p><h4 class="font-bold text-xl mt-6 mb-2">Music by the River</h4><p>Later,<br>I grabbed tea<br>and walked back toward the ghats.</p><p>Some young men were playing guitar,<br>singing softly near the river.</p><p>I sat with them.</p><video src="videos/chapter-14_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>No introduction needed.</p><p>Music under the open sky.<br>Ganga flowing beside.<br>Night air cool.</p><p>Time… dissolved.</p><p>I stayed there till around 11 PM.</p><p>Even after that,<br>I took a long walk… alone.</p><p>By the time I returned,<br>it was nearly 1 AM.</p><h4 class="font-bold text-xl mt-6 mb-2">A Feeling Called Belonging</h4><p>That day wasn’t about riding.</p><p>It wasn’t about distance.</p><p>It was about… belonging.</p><p>Kashi didn’t feel like a destination anymore.</p><img src="images/chapter-14_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>It felt like… a conversation.</p><p>And for the first time since the journey began,</p><p>I felt fully present.</p><p>Not chasing the next state.</p><p>Not thinking about the next kilometre.</p><p>Just… living.</p>', quote: '"Kashi did not welcome me as a traveler…it accepted me as if I already belonged."' },
            { type: 'chapter', id: 'ch15', title: 'Leaving Kashi, Arriving at Silence', chapter: 'Ch  15', stats: 'Balance', image: 'images/chapter-15.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Difficult Goodbye</h4><p>I woke up around 6:30 AM in Kashi.</p><p>There was no urgency.<br>But there was resistance.</p><p>I’ve left many cities without looking back.</p><p>But that morning… felt different.</p><h4 class="font-bold text-xl mt-6 mb-2">One Last Walk</h4><p>From 6:45 to around 7:30,<br>I walked along the ghats one last time.</p><p>The river was calm.<br>Morning light… soft.</p><img src="images/chapter-15_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Fewer voices.<br>More truth.</p><p>I didn’t want to leave.</p><p>Not because I hadn’t seen enough.</p><p>But because… I had felt enough.</p><p>Kashi wasn’t just a place I visited.</p><p>It felt like a place… that had read me.</p><h4 class="font-bold text-xl mt-6 mb-2">The Road Calls Again</h4><p>For a few minutes,<br>I stood there thinking —<br>stay one more day.</p><p>I called a friend.</p><p>Bihar… entered the conversation.</p><p>Bodh Gaya… appeared in my mind<br>like a quiet whisper.</p><p>And just like that,<br>the road… called again.</p><p>Still,<br>leaving felt like pulling myself away<br>from something unfinished.</p><h4 class="font-bold text-xl mt-6 mb-2">Rolling Forward</h4><p>At 8:30 AM,<br>everything was packed.</p><p>I stood beside my bike<br>in that narrow lane one last time.</p><p>He had rested safely there.</p><p>I touched the tank… lightly.</p><p>We rolled out around 9 AM.</p><p>The first stretch was silent.</p><p>Not external silence —<br>internal.</p><p>After a tea break,<br>I opened the map.</p><p>Bodh Gaya.</p><p>The decision… felt intuitive.</p><p>I turned.</p><h4 class="font-bold text-xl mt-6 mb-2">A Different Energy</h4><p>By around 1 PM,<br>I reached Bodh Gaya.</p><img src="images/chapter-15_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Immediately,<br>the atmosphere felt different from Kashi.</p><p>Kashi vibrates.</p><p>Bodh Gaya… breathes.</p><p>The town moved slower.</p><p>Monks walked in quiet rhythm.</p><p>Foreign travelers sat cross-legged beneath trees.</p><p>I found a peaceful dorm.</p><p>Clean.<br>Minimal.<br>Calm.</p><p>The owner welcomed me warmly.</p><h4 class="font-bold text-xl mt-6 mb-2">A Subtle Impact</h4><p>We began talking casually.</p><p>Where I came from.<br>The ride.<br>The distance — 10,000+ kilometres.</p><p>As I shared my journey,<br>something changed in his expression.</p><p>He wasn’t just listening politely.</p><p>He was… inspired.</p><h4 class="font-bold text-xl mt-6 mb-2">Silence in Many Forms</h4><p>After freshening up,<br>I stepped out toward the Mahabodhi Temple complex.</p><p>If Kashi was intensity…</p><p>Bodh Gaya was meditation.</p><p>The Mahabodhi Temple stood tall,<br>yet calm.</p><p>Monks sat in silence.</p><p>Prayer flags moved lightly.</p><p>No shouting.<br>No rush.</p><p>I visited the Thai Temple — golden and graceful.</p><img src="images/chapter-15_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The Japanese Temple — minimal and disciplined.</p><p>The Chinese Temple — detailed and serene.</p><img src="images/chapter-15_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Each temple… spoke silence<br>in a different language.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unexpected Kindness</h4><p>Later,<br>I walked toward the museum.</p><p>It was closed.</p><p>I stood there for a moment.</p><p>Slightly disappointed.</p><p>A staff member noticed me.</p><p>We spoke briefly.</p><p>He looked at my riding jacket.<br>Asked where I came from.</p><p>When I told him,<br>something softened.</p><p>He quietly opened the gate.</p><p>Allowed me inside.</p><p>No drama.<br>No expectation.</p><p>Just… kindness.</p><p>That small gesture… stayed.</p><p>Inside,<br>ancient statues stood in stillness.</p><p>Centuries of patience… carved into stone.</p><img src="images/chapter-15_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I walked slowly.</p><p>Absorbing.</p><h4 class="font-bold text-xl mt-6 mb-2">Ritual of Care</h4><p>After returning to my stay,<br>I cleaned my bike.</p><p>Checked everything carefully.</p><p>Packed it well for the next day.</p><p>That small routine —<br>cleaning,<br>arranging,<br>preparing —</p><p>had become part of the journey.</p><h4 class="font-bold text-xl mt-6 mb-2">Two Lives, One Conversation</h4><p>While I was doing that,<br>the owner came toward me.</p><p>We started talking.</p><p>At first, casual.</p><p>But slowly… deeper.</p><p>He told me about his journey.</p><p>Once a businessman.<br>Successful.<br>Well connected.</p><p>Then… life shifted.</p><p>Loss happened.</p><p>Now,<br>he was running a small stay.</p><p>But there was no bitterness.</p><p>Only… rebuilding.</p><p>When he heard about my ride,<br>his thoughts expanded.</p><p>Ideas flowed.</p><p>Travel models.<br>Riding concepts.<br>Collaborations.</p><p>Not fantasy.</p><p>Structured.</p><p>Real.</p><p>He showed documents.</p><p>Spoke about networks.</p><p>Spoke about rebuilding —<br>not just surviving.</p><p>We spoke till 11:30 PM.</p><p>Two men in transition.</p><p>One rebuilding externally.</p><p>One… internally.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Realisation</h4><p>His resilience moved me.</p><p>Once — success was his identity.</p><p>Now — humility was.</p><p>But the ambition… remained.</p><p>Grounded.</p><p>Before sleeping,<br>I realised something quietly powerful:</p><p>The road connects you to places.</p><p>But it also connects you…<br>to people who are rewriting themselves.</p><h4 class="font-bold text-xl mt-6 mb-2">Balance</h4><p>That evening,<br>Bodh Gaya didn’t overwhelm me.</p><p>It steadied me.</p><p>Dinner was simple.<br>Conversations deep.<br>Silence… comfortable.</p><p>Around midnight,<br>lying in that small peaceful room,</p><p>I realised:</p><p>Ayodhya gave devotion.</p><p>Kashi gave intensity.</p><p>Bodh Gaya… gave balance.</p><p>And maybe,<br>that balance was necessary…</p><p>before the road tested me again.</p>', quote: '"Ayodhya gave devotion. Kashi gave intensity. Bodh Gaya gave balance."' },
            { type: 'chapter', id: 'ch16', title: 'Six Hundred Kilometres of Trust', chapter: 'Ch  16', stats: 'Endurance', image: 'images/chapter-16.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">Before the First Light</h4><p>I woke up at 5:00 AM.</p><p>It was still dark.</p><p>Bodh Gaya was silent.</p><p>Monks not yet out.<br>Streets empty.<br>Air slightly cold.</p><p>I packed quietly.</p><p>The stay owner came out.</p><p>He checked if I was leaving safely.<br>Asked me to call once I reached.</p><p>There was something… comforting about that.</p><h4 class="font-bold text-xl mt-6 mb-2">Preparing for the Distance</h4><p>Before starting,<br>I stood beside my bike for a moment.</p><p>600+ kilometres.</p><p>One stretch.</p><p>No sightseeing.</p><p>Just… road.</p><p>I tightened the luggage straps carefully.</p><p>Checked the chain.<br>Looked at the tyres.</p><p>Tapped the tank… lightly.</p><p>This wasn’t just a machine.</p><p>He was about to carry me<br>across an entire state line…<br>and beyond… in a single day.</p><h4 class="font-bold text-xl mt-6 mb-2">The Ride Begins</h4><p>We started before sunrise.</p><p>The first light…<br>broke slowly as we moved.</p><p>The roads around Rajgir were surprisingly good.</p><p>I decided to take a shortcut.</p><p>50–60 kilometres saved.</p><p>A small decision.</p><p>But meaningful.</p><p>Earlier…<br>I would have hesitated.</p><p>Now…<br>I trusted my navigation.</p><p>And I trusted him.</p><h4 class="font-bold text-xl mt-6 mb-2">Finding the Rhythm</h4><p>Somewhere mid-morning,<br>I stopped for breakfast.</p><p>Simple food.<br>Stretching my legs.</p><p>Watching trucks… move slowly past.</p><p>There’s something meditative<br>about long-distance riding.</p><p>Helmet on.<br>Music low.<br>Engine… humming steadily.</p><p>The world narrows.</p><p>Throttle.<br>Road.<br>Awareness.</p><h4 class="font-bold text-xl mt-6 mb-2">Miles Without Words</h4><p>After breakfast,<br>the landscape changed.</p><img src="images/chapter-16_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Forest stretches appeared.</p><p>Long… quiet patches.</p><p>Barely any restaurants.<br>Rare petrol pumps.</p><p>For a while,<br>there were no proper stops.</p><p>Only a small dhaba.</p><p>Lunch.</p><p>Rice.<br>Curry.</p><p>Nothing fancy.</p><p>But fuel…<br>for both of us.</p><p>When you ride 600 kilometres in a day,</p><p>conversation disappears.</p><p>Thoughts become rhythm.</p><p>No analysis.<br>No overthinking.</p><p>You just… move.</p><h4 class="font-bold text-xl mt-6 mb-2">Crossing Over</h4><p>By around 3 PM,<br>I entered West Bengal.</p><p>The moment wasn’t loud.</p><p>But it was… significant.</p><p>Symbolic.</p><p>The last time I passed this way,<br>through the Siliguri corridor,<br>it felt different.</p><p>Back then,<br>my mind was different.</p><p>This time…</p><p>I was alone.</p><p>But not lonely.</p><h4 class="font-bold text-xl mt-6 mb-2">A Familiar Road</h4><p>The Siliguri stretch felt familiar.</p><p>Almost… nostalgic.</p><p>The road was steady.<br>Traffic slightly heavier.</p><p>But the bike…</p><p>moved confidently.</p><p>No complaints.</p><p>No vibration anxiety.</p><p>Just… steady hum.</p><p>And somewhere inside,</p><p>I felt gratitude.</p><p>Because 600 kilometres…<br>is not easy.</p><p>Not on a machine.</p><p>Not on a rider.</p><h4 class="font-bold text-xl mt-6 mb-2">The Silence After Movement</h4><p>Around 6 PM,<br>I reached Siliguri.</p><img src="images/chapter-16_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The city lights… already on.</p><p>I parked him carefully.</p><p>Turned off the engine.</p><p>Silence.</p><p>That silence…<br>after a long ride…</p><p>feels earned.</p><h4 class="font-bold text-xl mt-6 mb-2">A Familiar Routine</h4><p>A boy had come for an exam in the city,<br>and we met.</p><p>We stepped out for dinner.</p><p>Simple food.<br>Easy conversation.</p><p>Later,<br>I went to a supermarket.</p><p>Bought essentials for the next stretch.</p><p>Standing in that aisle,<br>holding random supplies,</p><p>I realised…</p><p>how normal this life had become.</p><p>Ride.<br>Work.<br>Eat.<br>Move.</p><h4 class="font-bold text-xl mt-6 mb-2">Endurance</h4><p>Back at the stay,<br>I looked once more at my bike.</p><p>Dust-covered.<br>Road-worn.<br>Faithful.</p><p>600+ kilometres.</p><p>One day.</p><p>No breakdown.<br>No complaint.<br>No hesitation.</p><p>That night,<br>around 10 PM,</p><p>as I lay down to sleep,</p><p>I felt something very clear:</p><p>We had crossed…<br>from exploration… into endurance.</p><p>The journey was no longer just about places.</p><p>It was about… consistency.</p><p>And consistency… builds character.</p>', quote: '"The journey was no longer about places — it was about endurance, and endurance builds who you become."' },
            { type: 'chapter', id: 'ch17', title: 'In the Middle of the Fog, I Found a Mother', chapter: 'Ch  17', stats: 'Gratitude', image: 'images/chapter-17.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">Into the Unknown Cold</h4><p>I woke up at 5:15 AM.</p><p>It was still dark in Siliguri.</p><p>The air carried that early-morning dampness.</p><p>I packed slowly.<br>Methodically.</p><p>Checked the luggage straps again.</p><p>Cleaned and lubricated the chain carefully.</p><p>On a 600-kilometre day,<br>small negligence… becomes big regret.</p><p>A young boy staying in the same room helped me carry my luggage downstairs.</p><p>He was kind.<br>Smiling… without reason.</p><p>We exchanged numbers.</p><p>Travel has a strange way…<br>of making temporary connections feel real.</p><p>At 5:45 AM,<br>I started.</p><p>Within 30 minutes…<br>everything changed.</p><h4 class="font-bold text-xl mt-6 mb-2">The Fog</h4><p>Fog.</p><p>Not light mist.</p><p>Dense.<br>Thick.<br>Almost suffocating.</p><p>Visibility dropped… to barely 3–4 feet.</p><p>I couldn’t see the road clearly.</p><video src="videos/chapter-17_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Headlight beams… bounced back.</p><p>Trucks appeared like shadows…<br>and disappeared just as fast.</p><p>I slowed down.</p><p>20… 30 km/h.</p><p>Gloves freezing.<br>Visor wet.</p><p>Body… shivering.</p><p>After 50–60 kilometres,<br>I couldn’t continue safely.</p><p>I saw a tiny tea stall.</p><p>Stopped.</p><p>And there… she was.</p><h4 class="font-bold text-xl mt-6 mb-2">Warmth of a Stranger</h4><p>An elderly grandmother.</p><p>I parked carefully.<br>Removed my helmet.</p><p>My hands… shaking.</p><p>She looked at me once.</p><p>And understood.</p><p>“Cold?”</p><p>I nodded.</p><p>She gave me hot coffee.<br>And a packet of biscuits.</p><img src="images/chapter-17_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I sat there…<br>almost 30 minutes.</p><p>Just… warming up.</p><p>The stall wasn’t fancy.</p><p>Not even fully covered.</p><p>But in that moment…</p><p>it felt like protection.</p><p>When I went to pay…<br>she refused.</p><p>I insisted.<br>She refused again.</p><p>She placed chocolates in my hand.</p><p>“You are like my son.<br>Don’t pay.”</p><p>For a moment…<br>I had no words.</p><p>I had stopped… as a customer.</p><p>I was leaving… as family.</p><p>Standing there,<br>in the cold,<br>on a long ride,</p><p>being cared for…<br>by someone I had never met,</p><p>it humbled me.</p><p>The road whispered again:</p><p>Kindness… travels faster than distance.</p><p>I left with warmth.</p><p>Not just in my body.</p><p>But in my heart.</p><h4 class="font-bold text-xl mt-6 mb-2">Into Assam</h4><img src="images/chapter-17_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>As the fog slowly cleared,<br>I resumed.</p><p>The road opened up.</p><p>Every kilometre,<br>I checked on him mentally.</p><p>Engine sound?<br>Throttle smooth?<br>Any vibration?</p><p>But he was… flawless.</p><p>Rough patches.<br>Traffic slowdowns.<br>Long stretches.</p><p>He carried me…<br>without complaint.</p><p>After another 150–200 kilometres,<br>I entered Assam.</p><p>The landscape shifted.</p><p>Greener.<br>Wider skies.<br>A different energy.</p><p>Then came traffic.</p><p>10–15 kilometres of it.</p><p>Slow crawl.</p><p>Careful gaps.</p><p>Even there…<br>he stayed calm.</p><p>No overheating.<br>No struggle.</p><p>Just… steady presence.</p><p>Around 11 AM,<br>I stopped for breakfast.</p><p>The stall owner spoke about riding.</p><p>Then casually…<br>his YouTube channel.</p><p>He was earning from it.</p><p>I smiled.</p><p>The road… keeps opening doors.</p><p>We exchanged numbers.</p><p>I moved on.</p><h4 class="font-bold text-xl mt-6 mb-2">Climbing Higher</h4><p>By 2:30–3 PM,<br>I reached Guwahati.</p><p>The city felt alive.</p><p>Different rhythm.<br>Different culture.</p><p>At 4 PM,<br>I began toward Shillong.</p><p>The road transformed.</p><p>Smooth.<br>Curvy.<br>Elevated.</p><p>But evening… arrived quickly.</p><p>By 4:30–5 PM,<br>darkness started settling.</p><p>The road narrowed.</p><p>I slowed down.</p><p>Shared my live location<br>with my friend in Shillong.</p><p>Every turn… new.</p><p>Every climb… symbolic.</p><p>After 600+ kilometres —<br>fog,<br>traffic,<br>cold,<br>highways,<br>hills —</p><p>we were still moving.</p><p>Strong.</p><p>Sometimes… inside my helmet,<br>I whispered:</p><p>“Good job.”</p><p>He wasn’t just carrying me.</p><p>He was proving something.</p><h4 class="font-bold text-xl mt-6 mb-2">A Familiar Face</h4><p>By around 7 PM,<br>I reached Shillong.</p><p>And there he was.</p><p>My friend.</p><p>After 7–8 years.</p><p>He looked… the same.</p><p>Time had moved.</p><p>But friendship… hadn’t.</p><p>His family welcomed me warmly.</p><p>I freshened up.<br>And we stepped out for dinner.</p><p>Shillong felt cool.<br>Calm.<br>Different.</p><p>We spoke for hours.</p><p>Life.<br>Careers.<br>Memories.<br>Change.</p><p>After years…<br>there was so much to say.</p><p>We talked till midnight.</p><h4 class="font-bold text-xl mt-6 mb-2">Gratitude</h4><p>When I finally lay down,</p><p>I realised something clearly.</p><p>This was not just a long ride.</p><p>It was endurance.</p><p>It was faith.</p><p>It was kindness.</p><p>It was gratitude.</p><p>And somewhere inside,</p><p>I felt deeply thankful.</p><p>For the road.</p><p>For strangers.</p><p>For old friends.</p><p>And for the machine…</p><p>that never once gave up.</p>', quote: '"Kindness travels faster than distance."' },
            { type: 'chapter', id: 'ch18', title: 'A Day of Rest, Roads, and Reconnection', chapter: 'Ch  18', stats: 'Reconnection', image: 'images/chapter-18.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Day Without Urgency</h4><p>After two back-to-back 600+ kilometre days,<br>Day 18 felt different… from the moment I opened my eyes.</p><p>I woke up around 6 or 6:30 AM.</p><p>For the first time in many days,<br>there was no urgency in my body.</p><p>No chain checks.<br>No tightening straps.<br>No distance calculations.</p><p>My bike rested outside my friend’s house.</p><p>And strangely…<br>so did I.</p><h4 class="font-bold text-xl mt-6 mb-2">Above the Clouds</h4><p>We drove toward a sunrise point near Shillong.</p><p>High above the city…<br>where clouds float beneath you<br>like a moving ocean.</p><img src="images/chapter-18_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The sky slowly shifted.</p><p>Deep blue…<br>to soft orange.</p><p>Clouds rolled below the cliffs.</p><p>Rising.<br>Falling.<br>Like breath.</p><p>Shillong mornings felt different.</p><p>Colder.<br>Cleaner.<br>More intimate.</p><p>We stood there… silently.</p><p>No rush for photos.<br>No need to prove.</p><p>Just… presence.</p><h4 class="font-bold text-xl mt-6 mb-2">Letting Go of Control</h4><p>On the drive back,<br>I noticed something simple.</p><p>For the first time,<br>I wasn’t responsible.</p><p>No navigation.<br>No throttle control.<br>No scanning the road.</p><p>I was just… sitting.</p><p>Looking.<br>Absorbing.</p><p>That felt new.</p><h4 class="font-bold text-xl mt-6 mb-2">A Home Away From Home</h4><p>Back home,<br>breakfast was ready.</p><p>His father spoke warmly.</p><p>His mother ensured I ate properly.</p><p>His sister interacted naturally.</p><p>No formality.</p><p>No “guest treatment.”</p><p>Just… belonging.</p><p>They didn’t host me.</p><p>They included me.</p><h4 class="font-bold text-xl mt-6 mb-2">Rest</h4><p>We had already decided —<br>for the next two days,<br>my bike would rest.</p><p>Meghalaya evenings turn cold.<br>Fog builds fast.</p><p>Riding narrow hill roads after sunset…<br>was not wise.</p><p>For the first time in this journey,<br>I allowed him to rest.</p><p>After everything he had carried me through…</p><p>He deserved it.</p><p>And maybe…<br>I did too.</p><h4 class="font-bold text-xl mt-6 mb-2">Into Meghalaya</h4><p>We took my friend’s car<br>and drove toward Cherrapunji.</p><p>The drive felt cinematic.</p><p>Green cliffs… opening into valleys.</p><p>Clouds brushing the road.</p><p>The hills here… were soft.</p><p>Not harsh.<br>Not intimidating.</p><p>Endless.<br>Rolling.</p><p>The roads were clean.<br>Smooth.<br>Free.</p><p>Outside the city —</p><p>No chaos.<br>No rush.</p><p>Just… space to breathe.</p><h4 class="font-bold text-xl mt-6 mb-2">Seeing Without Expectation</h4><p>We visited Nohkalikai Falls.</p><img src="images/chapter-18_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>There was very little water.</p><p>But still…</p><p>standing there,<br>looking into the depth…</p><p>it felt beautiful.</p><p>It wasn’t about the water.</p><p>It was about… the place.</p><h4 class="font-bold text-xl mt-6 mb-2">Nature’s Patience</h4><p>We moved toward viewpoints.</p><p>Mist flowing through valleys…<br>like slow smoke.</p><p>Then… the Living Root Bridges.</p><p>Nature shaped over decades.</p><p>Roots… becoming pathways.</p><p>Human patience.<br>Natural growth.</p><p>Working together… silently.</p><h4 class="font-bold text-xl mt-6 mb-2">Expansion</h4><p>Later,<br>we reached Laitlum Canyon.</p><p>That place… was something else.</p><p>Valleys stretching endlessly.</p><img src="images/chapter-18_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Layers fading into distance.</p><p>Wind moving across the cliffs.</p><p>Standing there…</p><p>I felt something familiar.</p><p>Like Kashi.</p><p>But calmer.</p><p>Kashi was intensity.</p><p>Laitlum… was expansion.</p><p>In Kashi,<br>you feel watched.</p><p>Here…</p><p>you feel dissolved.</p><h4 class="font-bold text-xl mt-6 mb-2">A Different Culture</h4><p>Lunch was simple.</p><p>Local Khasi food.</p><p>Warm.<br>Comforting.</p><p>One thing stood out — cleanliness.</p><p>Dustbins everywhere.</p><p>People respecting space.</p><p>Not forced.</p><p>Just… culture.</p><p>I felt inspired.</p><p>Less crowd.<br>More awareness.<br>More respect.</p><h4 class="font-bold text-xl mt-6 mb-2">Evening Falls Fast</h4><p>By 5–5:30 PM,<br>darkness arrived quickly.</p><p>In Meghalaya,<br>evening doesn’t settle.</p><p>It drops.</p><p>We returned before fog thickened.</p><h4 class="font-bold text-xl mt-6 mb-2">Warmth That Stays</h4><p>Back home,<br>warmth continued.</p><p>His father shared stories.</p><p>His sister spoke freely.</p><p>Laughter… came naturally.</p><p>No effort to impress.</p><p>Only connection.</p><p>Dinner was simple.</p><p>But full of warmth.</p><p>We spoke late into the night.</p><p>Life.<br>Careers.<br>Years that passed.</p><p>Time had changed many things.</p><p>But friendship… hadn’t.</p><h4 class="font-bold text-xl mt-6 mb-2">Reconnection</h4><p>When I lay down to sleep,</p><p>I realised something quietly powerful.</p><p>This journey wasn’t only about solitude.</p><p>It was also about… reconnection.</p><p>With old friends.</p><p>With families.</p><p>With versions of myself… from years ago.</p><p>And outside,</p><p>my bike rested.</p><p>Not in a parking lot.</p><p>Not in a chaotic lane.</p><p>Not under worry.</p><p>But in a friend’s home.</p><p>Safe.</p><p>Just like… me.</p>', quote: '"In Kashi, you feel watched by centuries. In Laitlum, you feel dissolved into the horizon."' },
            { type: 'chapter', id: 'ch19', title: 'From Silent Hills to Festive Streets', chapter: 'Ch  19', stats: 'Responsibility', image: 'images/chapter-19.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Morning in Silence</h4><p>Shillong & Sohra – Christmas Eve</p><p>I woke up around 5:45 AM.<br>Before anyone else.<br>Shillong mornings had already become special to me, so I decided to go alone to the sunrise point.</p><p>When I reached, no one was there.<br>Just me.<br>And the horizon.</p><img src="images/chapter-19_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Clouds rolled below the cliffs like a silent ocean.<br>The sky slowly shifted colours.<br>The air was sharp and clean.</p><p>Standing there alone,<br>I felt something deeply peaceful —<br>not excitement,<br>not thrill —<br>just stillness.</p><p>Moments like that don’t need witnesses.<br>They need presence.</p><h4 class="font-bold text-xl mt-6 mb-2">Back to Movement</h4><p>After spending quiet time there,<br>I returned home.</p><p>By then, my friend was ready.<br>We had breakfast around 7:30 AM<br>and headed toward Cherrapunji again.</p><p>That day was about exploration.</p><h4 class="font-bold text-xl mt-6 mb-2">Nature Without Effort</h4><p>We visited the Seven Sisters Falls —<br>water streaming down cliffs in multiple ribbons.</p><p>The scale was overwhelming.</p><p>We drove through winding roads<br>that opened into valleys<br>and fog-covered ridges.</p><p>The landscape of Meghalaya<br>is not loud —<br>it’s dramatic without trying.</p><h4 class="font-bold text-xl mt-6 mb-2">Into the Earth</h4><p>We explored caves —<br>dark,<br>damp,<br>echoing.</p><p>Walking through those narrow rock passages<br>felt adventurous in a completely different way<br>from riding highways.</p><p>Inside the caves,<br>you hear your own breath louder than anything else.</p><h4 class="font-bold text-xl mt-6 mb-2">Endless Green</h4><p>We stopped at picnic points<br>overlooking endless green valleys.</p><img src="images/chapter-19_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Wind moving across the hills.<br>Silence stretching beyond sight.</p><p>Trust me —<br>the landscape was mind-blowing.</p><p>It wasn’t just beautiful.<br>It felt untouched.</p><h4 class="font-bold text-xl mt-6 mb-2">A City in Celebration</h4><p>By around 5:30 PM,<br>darkness began falling again.</p><p>We headed back toward Shillong.</p><p>But that evening was different.</p><p>It was December 24th.</p><p>As we entered Police Bazaar,<br>the city was alive.</p><video src="videos/chapter-19_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Music.<br>Lights.<br>People dancing in the streets.<br>Groups celebrating Christmas Eve.</p><p>It felt vibrant and joyful —<br>a completely different energy<br>from the silent valleys we had just left.</p><p>We walked around.<br>Had tea.<br>Absorbed the festive atmosphere.</p><p>By the time we checked the clock,<br>it was already around 10:30 PM.</p><p>Eventually,<br>we headed home.</p><p>But my day wasn’t over.</p><h4 class="font-bold text-xl mt-6 mb-2">Grease, Determination, and Gratitude</h4><p>For days,<br>I had been planning to change my engine oil.</p><p>Long-distance riding demands maintenance.</p><p>After reaching Shillong,<br>I had managed to find the specific 1.5-litre oil I usually use.</p><p>That night,<br>after dinner,<br>I decided to change it.</p><p>Christmas Eve.<br>Cold night.<br>Grease on my hands.</p><p>I removed the bolts carefully.</p><p>But one bolt got stuck.</p><p>The sump bolt wouldn’t open easily.</p><p>My tools were limited.<br>One tool even got slightly damaged.</p><p>My friend was tired,<br>yet he stayed with me.</p><p>We tried patiently.<br>Slowly.<br>Carefully.</p><p>It took nearly an hour<br>just to remove that bolt.</p><p>When it finally opened,<br>I felt relief —<br>not dramatic relief,<br>but quiet satisfaction.</p><p>The oil drained.<br>Fresh oil went in.</p><p>But tightening the bolt properly<br>was difficult with the tools we had.</p><p>Still,<br>I managed to secure it enough<br>to recheck in the morning.</p><h4 class="font-bold text-xl mt-6 mb-2">Choosing Responsibility</h4><p>I didn’t want to delay leaving the next day.</p><p>It was Christmas.</p><p>I didn’t want my friend to sacrifice his time with family<br>just to accommodate my departure.</p><p>So I chose to leave early the next day.</p><p>After finishing the oil change,<br>I even washed the bike.</p><p>Under cold water.<br>At midnight.</p><p>He stood there —<br>cleaned,<br>maintained,<br>ready.</p><h4 class="font-bold text-xl mt-6 mb-2">A Full Day</h4><p>By the time I lay down,<br>it was nearly 1 AM.</p><p>That day held everything:</p><p>Silent sunrise.<br>Waterfalls.<br>Caves.<br>Festive streets.<br>And mechanical struggle.</p><p>And somewhere between music in Police Bazaar<br>and grease under my nails,<br>I realised something:</p><p>This journey was no longer just about destinations.</p><p>It was about responsibility.</p><p>Toward my machine.<br>Toward my friendships.<br>Toward my own decisions.</p><h4 class="font-bold text-xl mt-6 mb-2">Gratitude</h4><p>And as I fell asleep,<br>tired but satisfied,</p><p>I felt grateful.</p><p>For the road.<br>For the hills.<br>For my friend who stayed up with me.<br>And for a bike that had carried me this far<br>without ever giving up.</p>', quote: '"This journey was no longer just about destinations. It was about responsibility."' },
