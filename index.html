from Tripura, Assam, France, and other places sat together that night.<br>The conversation flowed naturally.</p><p>We spoke about travel, life, culture, and the roads we had taken to reach this place.<br>Time passed quickly.<br>Before we realised it, it was already 11:30 PM.</p><h4 class="font-bold text-xl mt-6 mb-2">Understanding Manipur</h4><p>When I first entered Manipur that morning, I had felt fear.<br>The roads.<br>The military presence.<br>The tension.</p><p>But as the day passed, something changed inside me.</p><p>People explained their reality.<br>For them, this was normal life.<br>Security forces being present everywhere was part of their daily routine.</p><p>In our cities, such scenes feel unusual.<br>Here, they were part of life.</p><p>And slowly, I began to understand Manipur differently.</p><p>Not as a place of fear.<br>But as a place of strength.</p><p>A place where people continue to live, smile, and move forward despite everything around them.</p><p>Once I understood that, my fear slowly disappeared.<br>Confidence replaced it.</p><p>And I realised something again:<br>Every place has its own story.<br>You just have to stay long enough to understand it.</p><p>That night, I slept peacefully in Imphal.<br>The day had started with uncertainty and fear.<br>But it ended with friendship, food, and conversation.</p><p>Another reminder that on the road, things can change quickly.<br>Sometimes all it takes is one day and a few good people.</p>', quote: '"Every place has its own story. You just have to stay long enough to understand it."' },
        { type: 'chapter', id: 'ch33', title: 'The Market of Mothers', chapter: 'Ch  33', stats: 'Observation', image: 'videos/chapter-33.mp4', desc: '<p>After the long and dusty ride into Manipur the previous day, Day 33 began peacefully.<br>I woke up around 6 AM in the morning.</p><p>The air in Imphal was cold but calm.<br>Before anything else, I stepped outside and looked at my bike.<br>It was still covered with dust from the rough roads I had travelled the day before.</p><p>So the first task of the day was simple.<br>I cleaned my bike carefully, wiping away the dust from the body and the mirrors.<br>After so many kilometres together, taking care of the bike had become almost like a morning ritual.</p><p>After that I took a bath and freshened up, and by around 7 AM I was ready to step out.</p><h4 class="font-bold text-xl mt-6 mb-2">Morning in Imphal</h4><p>One thing I had noticed in the Northeast was how early the day begins.<br>By 5 or 6 AM, people are already walking on the streets, opening small shops, or going about their daily routines.<br>Life starts early here.</p><p>That morning I initially thought of riding to a sunrise point, but the cold weather made me change my plan.<br>Instead, I decided to explore one of the most unique places in Manipur.</p><p>Ima Keithel Market.</p><h4 class="font-bold text-xl mt-6 mb-2">Ima Keithel — The Mothers’ Market</h4><p>I rode my bike to Ima Keithel, also known as the Mother’s Market.</p><p>The moment I entered the market area, I realised this place was something truly special.<br>Ima Keithel is one of the largest markets in the world run entirely by women.</p><video src="videos/chapter-33_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Everywhere I looked, I saw women vendors managing shops, selling vegetables, fish, clothes, handmade goods, spices, and traditional items.<br>There were hundreds of small stalls.</p><p>And each stall had a woman sitting proudly behind it, running her business.</p><p>The market is not just a place of trade.<br>It is a symbol of women’s strength and independence in Manipur.</p><p>Walking through the market felt like walking through a living tradition.</p><h4 class="font-bold text-xl mt-6 mb-2">Breakfast in the Market</h4><video src="videos/chapter-33_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Around 8 AM, I found a small restaurant inside the market itself and had breakfast there.</p><p>After eating, I spent almost an hour exploring the market lanes.<br>There were sections for vegetables, fish markets, clothes, and traditional handicrafts.<br>The fish market in particular was fascinating — rows of vendors selling fresh fish and seafood.</p><p>I also bought a casual pant and T-shirt, something comfortable for daily use during the journey.<br>Sometimes small purchases like that become part of travel memories.</p><h4 class="font-bold text-xl mt-6 mb-2">Exploring the City</h4><p>After the market, I visited a few nearby places including a war memorial and a historic fort area.<br>I spent the entire morning exploring different parts of Imphal.</p><img src="images/chapter-33_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><img src="images/chapter-33_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>By around 12:30 PM, I returned to the hostel.</p><h4 class="font-bold text-xl mt-6 mb-2">Work and Travel</h4><p>Like many other days of this journey, the afternoon was a balance between travel and work.<br>I opened my laptop and worked until around 3 PM.</p><p>After finishing some tasks, I stepped out again for lunch.</p><h4 class="font-bold text-xl mt-6 mb-2">The Market in the Afternoon</h4><p>When I returned to Ima Keithel in the afternoon, the atmosphere had completely changed.<br>The market was now crowded and lively.<br>Hundreds of women were selling their goods, customers were bargaining, and the entire place was buzzing with activity.</p><p>I spent some time again exploring different sections of the market.<br>Seeing a market run entirely by women felt inspiring.</p><p>It was not just commerce.<br>It was community, tradition, and resilience.</p><p>I had lunch there and sat for a while simply observing the rhythm of the place.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Evening at the Hostel</h4><p>After lunch, I returned to the hostel and completed my remaining work.</p><p>In the evening, the familiar hostel routine returned.</p><p>That night we cooked egg rice together.<br>The French traveller and the traveller from Tripura joined again, and we shared dinner while talking about our journeys.</p><p>Travel stories always sound better when shared with people who understand the road.</p><h4 class="font-bold text-xl mt-6 mb-2">Conversations with the Host</h4><p>Later in the evening, I spent some time talking with the hostel owner.<br>He had become very friendly with me during my stay.<br>We spoke about Manipur, the local culture, the situation in the region, and also about the places I was planning to visit next.</p><p>He suggested a few places and helped me plan my next ride.</p><p>The next destination I was considering was Loktak Lake and Moirang, which was about 40 kilometres from Imphal.<br>It would only take around 45 minutes to reach, so I decided to leave that decision for the next morning.</p><p>If I felt ready, I would go.<br>Otherwise, I could stay another day in Imphal.</p><h4 class="font-bold text-xl mt-6 mb-2">Preparing for the Next Day</h4><p>That evening I also washed my clothes again because the dust from the previous days had settled everywhere.<br>Before sleeping, I packed my bags so that the next morning would be easier.</p><p>The hostel felt warm and comfortable.<br>Good conversations, simple food, and the quiet city outside created a peaceful end to the day.</p><p>After spending some time chatting with everyone at the hostel, I finally went to sleep.</p><p>Another day in Manipur had passed.<br>And the road ahead was still waiting.</p>', quote: '“The more I travelled, the more I realised — understanding a place begins with simply watching it.”' },
        { type: 'chapter', id: 'ch34', title: 'A Home by the Lake', chapter: 'Ch  34', stats: 'Peace', image: 'images/chapter-34.jpg', desc: '<p>The next morning felt relaxed.<br>I woke up around 7 AM.</p><p>Unlike most days of the journey, I didn’t have a long ride ahead. My destination that day was Loktak Lake, one of the most beautiful and unique lakes in Northeast India, located only about 45 minutes from Imphal.</p><p>Since the distance was short, there was no rush.<br>After getting ready and saying goodbye to the hostel owner and the other travellers, I started my bike around 8 AM.</p><img src="images/chapter-34_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Riding Slowly Toward the Lake</h4><p>The road to Moirang and Loktak Lake was calm and scenic.<br>In the middle of the ride, I stopped at a small place for breakfast.</p><img src="images/chapter-34_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>That morning I rode slowly.<br>There was no hurry.<br>Sometimes the best rides are the ones where you simply move forward and enjoy every moment.</p><p>By around 10 AM, I reached Moirang town.<br>I spent some time exploring the local market and looking around the area. From there I could already see glimpses of the famous Loktak Lake.</p><p>The wide water, the floating vegetation, and the quiet atmosphere made the place feel special.</p><h4 class="font-bold text-xl mt-6 mb-2">A Homestay by the Water</h4><p>I had already booked a homestay near the lake, and after reaching there I immediately realised it was the perfect choice.</p><p>The house was located right beside the lake, just a few metres from the water.<br>Standing outside, I could see the calm lake stretching into the distance.</p><img src="images/chapter-34_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The view was beautiful.</p><p>After parking my bike and settling into the room, I sat quietly for a few minutes just watching the lake.<br>Sometimes silence itself becomes the best travel experience.</p><h4 class="font-bold text-xl mt-6 mb-2">Work by the Lake</h4><p>Even though I was travelling, I still had some work to complete.<br>So I opened my laptop and started working while sitting in that peaceful environment.</p><p>Working with that lake view in front of me felt different.<br>There was no pressure.<br>No noise.<br>Just still water, soft wind, and silence.</p><video src="videos/chapter-34_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>It was one of the calmest moments I experienced in Manipur.<br>Not exciting.<br>Not dramatic.<br>Just deeply peaceful.</p><p>Sometimes life doesn’t need anything more than that — a quiet place, a simple task, and a calm mind.</p><p>Around 2 PM, the owner called me for lunch.<br>The moment I entered the kitchen area, I realised something.</p><p>This didn’t feel like a homestay.<br>It felt like a home away from home.</p><p>Instead of eating separately, we all sat together in the kitchen and shared the meal.<br>We talked about many things — travel, life, culture, and the region.<br>The warmth of the family made the experience even more special.</p><img src="images/chapter-34_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>After finishing work later in the afternoon, the owner suggested I visit a nearby viewpoint hill from where I could see the sunset over Loktak Lake.</p><p>So I rode up to the viewpoint.<br>The view from the top was breathtaking.<br>Loktak Lake looked enormous from there.</p><video src="videos/chapter-34_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>One of the most fascinating things about the lake are the floating islands, known locally as phumdis — circular patches of vegetation floating on the water.<br>Seeing them from above was mesmerizing.</p><p>As the sun slowly began to set, the entire lake turned golden.<br>It was one of the most peaceful sunsets of my journey.</p><p>In that moment, everything slowed down.<br>The water, the sky, the light — everything felt in sync.</p><p>I didn’t feel like capturing it fully.<br>I just stood there and watched.</p><p>Some views are not meant for memory cards.<br>They are meant for the soul.</p><h4 class="font-bold text-xl mt-6 mb-2">Conversations by the Lake</h4><p>Later in the evening, I met a few other travellers who were also staying in the same homestay.<br>The owner’s husband joined us as well.</p><p>He was extremely knowledgeable and spoke in detail about Manipur’s culture, traditions, politics, and daily life.<br>Listening to him was like attending a small informal lecture about the region.</p><p>Through his stories, I began to understand the place more deeply.<br>Travel becomes meaningful when you learn from the people who live there.</p><img src="images/chapter-34_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">A Dinner That Felt Like Family</h4><p>That night, five of us sat together for dinner.<br>The atmosphere felt warm and relaxed.</p><p>We spoke about festivals, marriage traditions, local customs, and our travel experiences.<br>The conversation flowed naturally.</p><p>After dinner, we went for a short walk near the lake.<br>The night air was cold, but the silence of the lake made the moment beautiful.</p><p>Standing there, with the dark water stretching into the distance, I felt calm.</p><h4 class="font-bold text-xl mt-6 mb-2">A Peaceful End to the Day</h4><p>By around 11 PM, we returned to the house.<br>The cold weather and the peaceful environment made me feel sleepy.<br>So I went to bed.</p><p>That night, as I fell asleep beside Loktak Lake, one thought stayed with me:<br>Sometimes the road gives you adventure.<br>Sometimes it gives you peace.</p><p>And that day, Loktak Lake gave me both.</p>', quote: '"Sometimes the road gives you adventure. Sometimes it gives you peace."' },
        { type: 'chapter', id: 'ch35', title: 'Walking on Water', chapter: 'Ch  35', stats: 'Keibul Lamjao', image: 'images/chapter-35.jpg', desc: '<p>I woke up very early that morning, around 5 AM.<br>The air around Loktak Lake was still and cold. The lake looked calm in the early light, and the entire area felt peaceful.</p><p>That day I had a simple plan.<br>I wanted to visit Keibul Lamjao National Park, the only floating national park in the world, located near Moirang.</p><p>Since the park opens at 6 AM, I started early from the homestay.</p><h4 class="font-bold text-xl mt-6 mb-2">Morning by the Lake</h4><p>While riding slowly along the lakeside road, I noticed people already awake and active.<br>Some were kayaking on the lake, while others were practicing morning exercises near the water.</p><p>The quiet morning energy of the place was beautiful.<br>I slowed down my bike and spent a few minutes watching them.</p><p>Moments like these remind you that travel is not just about destinations.<br>It is about observing life as it happens.</p><p>The park was only about 7 kilometres from my stay, so the ride was short.</p><h4 class="font-bold text-xl mt-6 mb-2">The Floating National Park</h4><p>When I reached Keibul Lamjao National Park, I realised something surprising.<br>I was the only visitor there.</p><img src="images/chapter-35_0.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The ticket counter wasn’t even open yet, so I waited for some time until the staff arrived.<br>Inside the park, a guide is mandatory, so I hired one.</p><p>The guide turned out to be a very friendly person. He didn’t demand any fixed amount and simply said I could give whatever I felt was appropriate.<br>That simplicity made the experience feel genuine.</p><p>He took me inside the park and explained its uniqueness.</p><h4 class="font-bold text-xl mt-6 mb-2">Searching for the Sangai</h4><p>Keibul Lamjao is famous for a rare and beautiful animal.<br>The Sangai deer, also known as the brow-antlered deer or the dancing deer of Manipur.</p><p>This deer lives only in this region and survives on the floating vegetation of the lake.</p><p>With binoculars and a small telescope, we slowly searched the wetlands.<br>After some waiting, we finally spotted a few Sangai deer moving gracefully in the distance.</p><img src="images/chapter-35_1.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Watching them in their natural habitat felt special.<br>The guide explained how fragile their ecosystem is and how important this park is for their survival.</p><img src="images/chapter-35_2.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Floating on the Lake</h4><p>Inside the park there was also a small boat ride, which the guide suggested.<br>We took a boat and moved through the floating vegetation.</p><p>After about a kilometre, the guide told me to step out.<br>At first I was confused.<br>But when I stepped down, I realised something incredible.</p><video src="videos/chapter-35_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>I was standing on floating ground.<br>The entire surface was made of thick layers of mud, roots, and vegetation called phumdis, floating on the lake.</p><p>It felt like walking on water.<br>I even tried jumping lightly and laughing like a child.<br>It was one of the most unusual experiences I had ever had.</p><p>And the most surprising part?<br>I was the only visitor in the entire national park that morning.</p><h4 class="font-bold text-xl mt-6 mb-2">The Reality of Tourism</h4><p>While walking through the park, the guide told me something a little sad.</p><p>Even though the park has good facilities and is a unique natural wonder, very few tourists visit nowadays.<br>Due to the situation in Manipur, many people avoid travelling here.<br>Sometimes only one or two visitors come in an entire day.</p><p>Listening to that made me realise how many beautiful places remain unseen simply because of perception or fear.</p><img src="images/chapter-35_4.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">History in Moirang</h4><p>After spending almost two hours in the park, I thanked the guide and left.<br>Nearby, I had a cup of coffee in a small shop and then continued toward Moirang town.</p><p>My next stop was the historic INA (Indian National Army) Headquarters, where Netaji Subhas Chandra Bose\'s INA flag was first hoisted on Indian soil in 1944.<br>The place holds deep historical significance.</p><img src="images/chapter-35_5.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I also visited the INA Museum, which preserves many memories of India’s freedom struggle.<br>Interestingly, the museum was officially closed that day because of a holiday.<br>But when I spoke to a staff member there, she kindly allowed me to enter and personally explained many things about the history and exhibits.</p><p>She didn’t charge anything.<br>She simply said it was nice to see someone travelling so far to learn about the place.</p><p>That small gesture meant a lot.</p><h4 class="font-bold text-xl mt-6 mb-2">An Afternoon on Loktak Lake</h4><p>By around 12 PM, I returned to the homestay and started my work.<br>Later in the afternoon, around 3 PM, I went for a boat ride on Loktak Lake.</p><video src="videos/chapter-35_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>The boat took me to one of the floating houses built in the middle of the lake.<br>The experience was surreal.</p><p>Sitting there, surrounded by water and floating vegetation, felt peaceful beyond words.<br>I spent almost two hours there, enjoying the quiet beauty of the lake.</p><h4 class="font-bold text-xl mt-6 mb-2">A Night of Stories</h4><p>By evening, around 7 PM, I returned to the homestay.<br>After finishing my work meeting, I packed my luggage since I would be leaving the next morning.</p><p>At around 9 PM, dinner was ready.<br>That night we all sat together again — the host family and the travellers.</p><p>The conversation turned into storytelling.<br>They shared funny stories, life experiences, and even some tragic and emotional tales from the region.</p><p>One story stayed with me.<br>A man from Bangalore had once fallen in love with a girl he met there. She had told him she was from Manipur, but later he discovered she was actually from Myanmar.<br>He had travelled all the way searching for her.</p><p>With the help of the homestay owner, he eventually found her.<br>It was a complicated story filled with emotion, truth, and unexpected turns.<br>Listening to it felt like watching a movie.</p><h4 class="font-bold text-xl mt-6 mb-2">More Than a Homestay</h4><p>By the end of the night, one thing had become very clear to me.<br>This place was not just a homestay.<br>It felt like staying with relatives.</p><p>The owners treated me with warmth, respect, and care.<br>The house itself was simple.<br>But the hospitality felt luxurious.</p><p>Sometimes luxury is not about expensive rooms.<br>It is about how people treat you.</p><p>And in that house beside Loktak Lake, I truly felt welcomed.</p>', quote: '"Sometimes luxury is not about expensive rooms. It is about how people treat you."' },
        { type: 'chapter', id: 'ch36', title: 'Three States in One Day', chapter: 'Ch  36', stats: 'Flow', image: 'images/chapter-36.jpg', desc: '<p>I woke up very early that morning, around 5 AM.</p><p>Most of my packing had already been done the previous night, so there was very little left to prepare. I quietly packed the last few small things, checked my bike, and got ready to leave.</p><p>By the time I finished, the uncle from the homestay had also woken up.<br>I thanked him for everything. In just two days, that house by Loktak Lake had begun to feel like a relative’s home rather than a place I had booked online.</p><p>Before leaving, we took a photograph together.<br>I gave him a warm hug, said my last goodbye, and started my ride.</p><img src="images/chapter-36_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">The Cold Morning Ride</h4><p>The morning air was extremely cold.<br>For the first few kilometres I had to ride slowly just to let my body adjust to the temperature. The road was quiet, and the lake slowly disappeared behind me as I continued toward Imphal.</p><p>By around 7:15 AM, I reached the city again.<br>I was already hungry, so I stopped at a small roadside shop and had tea and poori for breakfast.<br>After that, the journey continued.</p><h4 class="font-bold text-xl mt-6 mb-2">The Dusty Road Again</h4><p>Soon the same dusty roads I had travelled earlier returned.<br>But this time I had more confidence.<br>I already knew what to expect.</p><p>I understood how the road behaved — where the loose mud was, where the dust clouds formed, and how to control the bike through the rough patches.</p><p>Still, the road remained difficult.<br>In a few places, the dust made the road slippery and my bike slipped slightly, but I managed to balance it carefully.<br>That stretch demanded patience and concentration.</p><h4 class="font-bold text-xl mt-6 mb-2">Returning to Nagaland</h4><p>By around 12 PM, I reached Kohima again.<br>Seeing the familiar city felt nice after the rough road.</p><p>I thought about stopping there for lunch, but finding a proper vegetarian restaurant turned out to be difficult.<br>So I continued riding.</p><p>A few kilometres later I finally found a small place where I had a simple meal.<br>Sometimes simple roadside food feels like the best meal after long riding hours.</p><h4 class="font-bold text-xl mt-6 mb-2">A Surprise Meeting</h4><p>As I approached Dimapur, something unexpected happened.<br>I met the hostel travellers I had earlier seen in Nagaland.</p><p>It was one of those beautiful coincidences of the road.<br>Out of all the highways and towns, we crossed paths again.</p><p>We stopped for a while, spoke, laughed about the journey, and continued our rides.<br>Moments like that make travel feel magical.</p><h4 class="font-bold text-xl mt-6 mb-2">Crossing Into Assam</h4><p>Near the Nagaland–Assam border, I stopped for a short break and spoke with a few truck drivers who were resting there.<br>We chatted for a few minutes before I continued.</p><p>At one checkpoint, a policeman stopped me and asked me to remove my helmet.<br>For a moment I felt nervous.</p><p>But instead of questioning me, he smiled and said something encouraging.<br>He looked at my riding gear and said:<br>"This is how a responsible traveller should ride."</p><p>We spoke for about 10–15 minutes, and he wished me a safe journey before letting me continue.<br>That small interaction left me smiling.</p><h4 class="font-bold text-xl mt-6 mb-2">The Fuel Scare</h4><p>After crossing into Assam, I noticed something worrying.<br>My fuel was running low.</p><p>I assumed I would find a petrol pump soon.<br>But kilometre after kilometre passed, and there was nothing.</p><p>Soon the bike went into reserve fuel.<br>The road passed through forest areas, and the thought of the bike stopping there made me uncomfortable.</p><p>Finally, after almost 40 kilometres, I spotted a petrol pump in the middle of the forest region.<br>That moment felt like relief.</p><p>I filled the tank completely and also had some snacks there.<br>The bike was a bit heated from the ride, so I rested for a while and spoke with the petrol pump staff.</p><h4 class="font-bold text-xl mt-6 mb-2">Deciding the Next Stop</h4><p>Originally, I had planned to push further that day.<br>Maybe even reach deeper into Assam.</p><p>But standing there around 3 PM, I paused.<br>I realised something important.<br>There was no need to rush.</p><p>I had already travelled a long distance.<br>And my next dream destination — Kaziranga National Park — was nearby.</p><p>So I decided to stop near Kaziranga and explore it the next morning.</p><h4 class="font-bold text-xl mt-6 mb-2">Reaching Kaziranga</h4><p>The road ahead became calm and beautiful.<br>I rode slowly, enjoying the scenery.</p><p>By around 5 PM, I reached a small hostel near Kaziranga National Park.<br>To my surprise, I was the only guest in the entire hostel.<br>There were four beds, but I was the only traveller that night.</p><h4 class="font-bold text-xl mt-6 mb-2">The Kind Host</h4><p>The hostel owner turned out to be an international travel guide.<br>He was extremely polite and knowledgeable.</p><p>After checking in, I took a bath around 6 PM and relaxed for a while.<br>Across the road there was a small restaurant, so I went there and had a large thali dinner with chicken and rice.<br>After such a long riding day, it felt perfect.</p><p>When I returned, the hostel owner had already started a bonfire outside because the evening had become cold.</p><p>I sat with him and his daughter for a while.<br>We spoke about travel, Manipur, Northeast culture, and many other things.<br>He was calm, thoughtful, and genuinely interested in conversation.</p><h4 class="font-bold text-xl mt-6 mb-2">A Warm Ending to the Day</h4><p>Later that night, he even brought me Assamese snacks — pakoras and red tea.<br>It felt like genuine hospitality.</p><img src="images/chapter-36_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Before sleeping, I packed my bags again because the next morning I planned to visit Kaziranga National Park.</p><p>He also gave me useful advice.<br>Since I was travelling solo, hiring an entire jeep safari or elephant ride could be expensive.<br>Instead, he suggested joining a shared safari with other travellers.</p><h4 class="font-bold text-xl mt-6 mb-2">A Day of Riding</h4><p>That day had mostly been about riding.<br>In total, I had travelled almost 500 kilometres, crossing through Manipur, Nagaland, and Assam in a single day.</p><p>Yet the ride never felt rushed.<br>I moved slowly.<br>Stopped when needed.<br>Let the road decide the pace.</p><p>And that is exactly what makes long journeys meaningful.<br>Sometimes the best days are simply about riding forward.</p>', quote: '“The road didn’t ask me to rush… it only asked me to keep going.”' },
        { type: 'chapter', id: 'ch37', title: 'Rhinos, Destiny, and the Road to the Mountains', chapter: 'Ch  37', stats: 'Transition', image: 'videos/chapter-37.mp4', desc: '<p>The previous night I had unpacked almost nothing.<br>I knew I would be leaving early, so only the essential things were taken out.</p><p>That morning I woke up around 5 AM.<br>The safari point of Kaziranga National Park was only about 20 kilometres from the hostel, so I quickly got ready and started my bike around 5:15 AM.</p><img src="images/chapter-37_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Before leaving, I wrote a small note thanking the hostel owner for his kindness. He had shared useful information, helped me plan the safari, and treated me with genuine hospitality.<br>It felt right to leave a small message of gratitude.</p><h4 class="font-bold text-xl mt-6 mb-2">Reaching Kaziranga</h4><p>By 6 AM, I reached the Kaziranga safari gate.<br>Many jeeps were already lining up to enter the park.</p><p>Since I was travelling solo, I began asking groups if I could join their jeep. Hiring an entire jeep alone would cost around ₹5000, which felt unnecessary for a single traveller.</p><p>But finding a group wasn’t easy.<br>Some people said no immediately.<br>Others told me their jeep was already full.<br>A few drivers even took my number and said they would call if they found space.</p><p>For a moment I thought I might miss the safari.<br>But travel has a strange way of helping you at the right time.</p><h4 class="font-bold text-xl mt-6 mb-2">When Destiny Helps</h4><p>While walking along the main road, I met two travellers who worked in the Central Government tax department.<br>They had come to Kaziranga as well.</p><p>I politely asked if I could join them.<br>They smiled and said,<br>"Of course, come with us."</p><p>Just like that, the problem was solved.<br>Instead of paying ₹5000 alone, the safari cost me around ₹600.<br>Sometimes the road really works in mysterious ways.</p><h4 class="font-bold text-xl mt-6 mb-2">The Kaziranga Safari</h4><p>The safari jeep entered the park, and I was lucky enough to stand in the front seat next to the driver, which gave me an amazing view.</p><video src="videos/chapter-37_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>The driver quickly became friendly and began pointing out animals along the way.</p><video src="videos/chapter-37_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>And then we saw them.<br>The famous one-horned rhinoceroses of Kaziranga.<br>Huge, powerful, and moving slowly through the tall grasslands.</p><video src="videos/chapter-37_2.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Seeing them in the wild was unforgettable.<br>We also spotted elephants walking through the forest, birds flying across the wetlands, and many other animals moving through the landscape.</p><p>The park itself was stunning.<br>Wide grasslands.<br>Wetlands shining in the morning sun.<br>Mist slowly rising from the ground.</p><p>For nearly two hours, we explored the jungle.<br>I didn’t even realise how quickly time passed.</p><p>Standing there, watching wildlife in its natural habitat, I felt grateful that I hadn’t missed this experience.</p><img src="images/chapter-37_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Leaving Kaziranga</h4><p>After the safari ended, I returned to the gate.<br>A small shop owner who had allowed me to keep my jacket and belongings safely also greeted me kindly.</p><p>I had breakfast there around 11 AM.<br>But the journey was far from over.<br>My next destination was Tawang, deep inside Arunachal Pradesh.</p><h4 class="font-bold text-xl mt-6 mb-2">The Permit Surprise</h4><p>To enter Arunachal Pradesh, travellers need an Inner Line Permit.<br>Initially, I had applied online, which cost about ₹500 for three days.</p><p>But at the border checkpost, something surprising happened.<br>When I completed the permit process offline, it cost only ₹75 for one month.<br>Sometimes the road teaches you small tricks like this.</p><p>The police officers at the checkpoint were also extremely helpful and friendly.<br>One of them even advised me to buy tyre chains, as they might be necessary if snow appeared further up in the mountains.</p><p>So I stopped at a nearby shop and bought two chains — one for the front tyre and one for the rear tyre.</p><h4 class="font-bold text-xl mt-6 mb-2">Entering Arunachal Pradesh</h4><p>The moment I crossed into Arunachal Pradesh, everything changed.</p><p>The landscape transformed instantly.<br>The air felt colder.<br>The mountains grew taller.<br>The roads twisted through forests and valleys.<br>The scenery became unbelievably beautiful.</p><img src="images/chapter-37_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>While I was riding in Arunachal, every kilometre I enjoyed and felt the road.<br>It was all good.<br>Every kilometre felt special.<br>Every turn, every curve, every stretch — it all felt alive.</p><p>I stopped every 10–15 kilometres, simply to admire the view.<br>Every stop became a small moment of joy.</p><p>Sometimes local people stopped to talk with me.<br>Many were surprised to see a solo rider travelling from Karnataka.<br>They asked questions, clicked pictures, and wished me well.<br>Those interactions made the ride even more special.</p><h4 class="font-bold text-xl mt-6 mb-2">The Temperature Drops</h4><p>By around 4:30 PM, the temperature suddenly dropped.<br>The cold air became sharp.</p><p>My breath began to feel heavy, and the road started getting darker earlier than expected.<br>Even though the distance ahead looked manageable on the map, the narrow mountain roads forced me to slow down to 30–35 km/h.</p><p>In the evening, every metre felt like a cold breeze.<br>It almost felt like I was riding on an ice road.<br>The cold was entering through the gloves, through the jacket, through everything.</p><p>Many thoughts came into my mind to stop.<br>But there were no proper rooms available.</p><p>I briefly considered stopping earlier at Rupa, a small town along the way.<br>But I decided to continue.</p><p>The police officers I met along the way warned me that the road was safe, but the temperature would keep dropping.</p><h4 class="font-bold text-xl mt-6 mb-2">The Freezing Night Ride</h4><p>The ride ahead became difficult.<br>By the time I reached Bomdilla, it was around 5:15 PM.<br>The cold had become intense.</p><p>My plan for that day was to reach Dirang.<br>But due to the extreme cold, I had to stop at Bomdilla.</p><p>I decided to stay there for the night.<br>When I entered the room, I immediately understood the situation.</p><p>The bed had four blankets.<br>Only later did I realise why.<br>When I checked the temperature, it was already –3°C.<br>And it was only 6 PM.</p><h4 class="font-bold text-xl mt-6 mb-2">A Cold but Beautiful Evening</h4><p>After ordering food and tea, I sat quietly inside the room.<br>Outside, the mountains were silent.<br>Inside, the warmth of the blankets slowly returned to my body.</p><p>Even though the cold was extreme, the journey felt beautiful.<br>The road from the Assam–Arunachal border to this region was one of the most scenic stretches I had ever ridden.</p><p>Nearly 100 kilometres had taken almost five hours, not because the road was bad — but because I kept stopping to enjoy the scenery.</p><p>Sometimes the best journeys are the slowest ones.</p><h4 class="font-bold text-xl mt-6 mb-2">Ending the Day</h4><p>The hotel owner, who was from Assam, turned out to be a very kind person.<br>We spoke for some time before I went to my room.</p><p>Since I had arrived early, I spent the evening watching videos and resting.<br>It was Sunday, the mountains were silent, and the cold outside was intense.</p><p>But inside the room, wrapped in blankets after a long day of riding, I felt peaceful.<br>The road to Tawang had begun.</p>', quote: '“The road didn’t just take me to a new place… it slowly transformed the way I felt every kilometre.”' },
        { type: 'chapter', id: 'ch38', title: 'Riding Into the Silence of the Himalayas', chapter: 'Ch  38', stats: 'Stillness', image: 'images/chapter-38.jpg', desc: '<p>By this point in the journey, waking up early had become a habit.<br>That morning in Arunachal Pradesh, I woke up around 4:30 AM.</p><p>But outside, the cold was intense.<br>For a moment I wondered if I should start riding immediately. But the temperature was close to zero degrees, and I knew riding too early would be difficult.</p><img src="images/chapter-38_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>So I stepped outside the room instead.<br>What I experienced in that moment is something I will never forget.</p><p>The road was completely silent.<br>Not a single vehicle.<br>No people.<br>No sound.</p><p>It was so quiet that I could literally hear my own heartbeat.<br>The mountains stood still around me, and the sky was slowly turning light.</p><p>Even though it was just around 5 AM, the early Himalayan light had already begun spreading across the valley.<br>It was one of the most peaceful mornings of my entire journey.</p><h4 class="font-bold text-xl mt-6 mb-2">Preparing for the Ride</h4><p>By around 6 AM, I had packed everything.<br>My bike was already outside, so I slowly tied all the luggage, checked everything carefully, and even managed to take a quick bath despite the freezing weather.</p><p>By 7 AM, I finally started the ride.<br>But the cold was brutal.</p><p>Within a few kilometres my hands started freezing.<br>I could barely feel the clutch and brake.<br>Every two or three kilometres, I had to stop, rub my hands together, warm them near the engine heat, and start again.</p><video src="videos/chapter-38_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Sometimes I rode only 20–30 km/h.<br>Riding in zero-degree temperatures is not just difficult — it demands patience.</p><p>My face felt frozen, my beard had tiny crystals forming, and breathing the cold air felt heavy.<br>But the mountains ahead kept pulling me forward.</p><h4 class="font-bold text-xl mt-6 mb-2">Tea Stops and Warm Moments</h4><p>After some time, I stopped at a small roadside place and had hot tea.<br>That cup of tea felt like life returning to my body.</p><p>Slowly, the journey continued.</p><h4 class="font-bold text-xl mt-6 mb-2">The Beauty of Arunachal</h4><p>As I climbed higher into the mountains, the landscape became more dramatic.<br>Near Bomdila, I visited a natural hot spring area, where warm water flows naturally from the ground.</p><p>The contrast between the freezing mountain air and the warm spring water was fascinating.</p><img src="images/chapter-38_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Later I stopped at a place called Shanti Valley, where I spent some time walking around and speaking with a few locals.<br>The valley was stunning.<br>Tall mountains, clear skies, and endless silence.</p><img src="images/chapter-38_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I took photographs and simply enjoyed the moment.</p><img src="images/chapter-38_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Entering the High Mountains</h4><p>Soon I approached the region near Sela Tunnel and Sela Pass, one of the highest mountain passes in India.<br>The road there was breathtaking.<br>But it also demanded attention.</p><img src="images/chapter-38_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>At first I noticed stones scattered across the road and wondered why people had placed them there.<br>Then I realised something.</p><img src="images/chapter-38_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>They weren’t placed by people.<br>They had fallen from the mountains above.</p><p>Rockfalls are common in these high Himalayan roads, so riding carefully was extremely important.</p><p>The altitude there was around 13,000 feet above sea level, and I could feel the effect.<br>Even the bike struggled slightly due to the thin air.</p><p>Still, the views were unbelievable.<br>Every few kilometres I stopped.<br>Clicked photographs.<br>Spoke with travellers.<br>Visited war memorials dedicated to soldiers who protected these mountains.</p><p>Each stop became a small story.</p><h4 class="font-bold text-xl mt-6 mb-2">The Decision to Pause</h4><p>By the time I reached Tawang Gateway, it was already around 12 PM.<br>From there, Tawang town was only about 40 kilometres away, but the mountain road meant it would still take nearly two hours.</p><img src="images/chapter-38_6.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>At the same time, I also needed to start my work around 1 PM.<br>So I stopped at a small restaurant along the road.</p><p>The restaurant staff were extremely kind.<br>Not only did they serve good food, they also allowed me to sit and work from there for some time.</p><p>For nearly an hour, I worked from that small mountain restaurant.<br>It was one of those unexpected travel-work moments that make remote journeys memorable.</p><img src="images/chapter-38_7.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Deciding Not to Rush</h4><p>After finishing my work at the roadside restaurant around 2 PM, I started riding again.<br>From there, Tawang was still about 40 kilometres away, which in the mountains meant nearly two hours of riding.</p><p>But just a few minutes later, after riding around 200 metres, I saw a small homestay in Jang village.<br>For a moment I paused.</p><p>And a simple thought came to my mind:<br>Why rush to Tawang today?</p><p>The mountains were beautiful.<br>The weather was cold but peaceful.<br>And the journey had already been long.</p><img src="images/chapter-38_9.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Instead of pushing further just to reach a destination, I decided to slow down and stay in Jang for the night.<br>Sometimes the best travel decisions come from simply listening to the road.</p><h4 class="font-bold text-xl mt-6 mb-2">A Warm Stay in Jang</h4><p>The homestay was called Lotus Homestay, and it had opened only about twenty days earlier.<br>I became the first guest to check in there.</p><p>The owner, a kind and humble lady, welcomed me warmly and gave me a room at a very reasonable price.<br>After settling in, I continued my work for some time.</p><p>Later she suggested a few nearby places I could visit and shared useful information about Tawang and the surrounding region.</p><h4 class="font-bold text-xl mt-6 mb-2">A Cold Evening in the Mountains</h4><p>In the evening I stepped out to explore the area around Jang village.<br>The place was quiet and surrounded by mountains.</p><p>Soon there was a power cut, which is quite common in these high mountain villages.<br>The homestay owner suggested that I go to a nearby restaurant run by their relatives.</p><p>So I walked there.<br>The people there welcomed me warmly and offered tea.<br>Later they even served me food without charging anything, simply out of kindness.</p><h4 class="font-bold text-xl mt-6 mb-2">Sitting Around the Mountain Kitchen</h4><p>They invited me inside their traditional kitchen area, where a central stove kept the room warm.<br>In mountain homes, this kitchen space is where people cook, eat, and sit together during cold evenings.</p><img src="images/chapter-38_8.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I sat there with them for a long time.<br>We spoke about life in Arunachal Pradesh, local culture, tourism, business, and travel.<br>They even shared drinks with me and treated me like family.</p><p>That warmth in the middle of the cold mountains felt unforgettable.</p><h4 class="font-bold text-xl mt-6 mb-2">Conversations That Last</h4><p>Later, when I returned to the homestay, the owner and I continued talking for almost one and a half hours.<br>She shared many insights about Arunachal culture, tourism challenges, and life in the mountains.</p><p>Travel often teaches more through people’s stories than through places.<br>And that evening in Jang village was one of those moments.</p><h4 class="font-bold text-xl mt-6 mb-2">Ending the Day in Jang</h4><p>By around 11 PM, I finally went to sleep.<br>The day had been long — riding through frozen roads, mountain passes, and 13,000-foot altitude.</p><p>But ending the day in the peaceful village of Jang, surrounded by kind people and warm conversations, felt perfect.</p><p>Sometimes the journey reminds you:<br>There is no need to rush to the destination.<br>The road itself already gives you everything.</p>', quote: '"When the cold tried to stop me, the mountains taught me patience — not every journey is about speed, some are about staying."' },
        { type: 'chapter', id: 'ch39', title: 'More Than a Machine', chapter: 'Ch  39', stats: 'Loyalty', image: 'videos/chapter-39.mp4', desc: '<p>This day became one of the most unforgettable days of my journey.</p><p>I woke up around 6 AM in Jang. Everything was already packed from the previous night. The mountains were still quiet and most people in the homestay were asleep.<br>I did not want to disturb anyone.</p><p>So I simply sent a message to the homestay owner thanking her for the kindness and hospitality. She had treated me like family.<br>I quietly started my bike and left.</p><p>Just 50 meters from the homestay, I saw a small tea shop. I stopped there for a cup of tea and biscuits before starting the ride toward Tawang.<br>It was barely 7 AM.</p><p>I parked my bike outside and stepped in.<br>When I came back out after tea, something strange caught my eye.</p><p>There was oil on the ground under my bike.<br>At first I thought it might be engine oil. My heart skipped for a moment.<br>I bent down and checked carefully.</p><img src="images/chapter-39_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The oil was coming from the rear suspension.</p><p>For a moment I just stood there silently.<br>“Something is wrong.”<br>And in that silent mountain morning, that one moment felt heavier than the entire journey so far.</p><h4 class="font-bold text-xl mt-6 mb-2">The Bike Begins to Struggle</h4><p>I asked a few local people if there was any Hero service center nearby.<br>They told me maybe I could find something in Tawang town.<br>So I decided to ride slowly and reach there.</p><p>But as soon as I started the bike, I realized the situation was serious.<br>The bike began jumping violently.<br>Without oil, suspension was no longer absorbing shocks.<br>The bike literally felt like it was dancing on the road.</p><p>Still, I decided to move carefully.</p><p>My next stop was Nuranang Waterfall, also known as Jang Waterfall, just a few kilometres away.<br>Normally it should take 10–15 minutes to reach.<br>That day it took almost an hour.</p><img src="images/chapter-39_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I rode slowly at 20–30 km/h, carefully balancing the bike.<br>The road was steep and the weather extremely cold.<br>In two places there was black ice on the road, and I slipped twice while climbing.</p><p>But somehow I managed to control the bike.<br>Finally, I reached the waterfall.</p><img src="images/chapter-39_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Forgetting the Problem</h4><p>The moment I saw the waterfall, something inside me shifted.<br>I completely forgot about the bike.</p><p>The Nuranang waterfall was breathtaking. Water crashed down from the mountain with immense force, creating mist that floated in the cold air.<br>A few tourists from Assam and West Bengal were there. They became friendly and started asking about my journey.</p><p>We spoke for a few minutes.<br>I walked closer to the waterfall, just standing there… feeling it.</p><p>Sometimes nature doesn’t solve your problems.<br>It just makes them feel smaller for a while.</p><p>For those few moments, I wasn’t a rider with a broken bike.<br>I was just a traveller… completely present.</p><h4 class="font-bold text-xl mt-6 mb-2">The Reality Returns</h4><p>When I came back to the parking area, reality hit me again.<br>The entire suspension oil had drained out.<br>It was completely empty.</p><p>I took photos and immediately called the Hero service mechanic who usually services my bike back home.<br>I shared the pictures with him.</p><video src="videos/chapter-39_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>After seeing them, he said something very direct.<br>“Your suspension is broken. It needs replacement. You can ride slowly for a short distance, but continuing like this will be very difficult.”</p><p>There was no Hero showroom in Tawang.<br>The nearest proper service center was in Guwahati — nearly 500 kilometers away.</p><p>Still… I wasn’t panicking.<br>I don’t know why.<br>But I smiled.</p><p>Maybe somewhere inside, I had already accepted — this was part of the journey.</p><h4 class="font-bold text-xl mt-6 mb-2">The Fall</h4><p>I continued riding slowly.<br>But without suspension oil, the bike had become extremely unstable.</p><p>At one point while climbing a steep road, the bike lost balance again.<br>I fell.</p><p>For a moment, everything went silent.</p><p>But instinct took over.<br>I protected the bike.<br>I made sure he didn’t take more damage.</p><p>Getting up wasn’t easy.<br>The bike was fully loaded.<br>I was wearing full riding gear.<br>The cold made everything harder.</p><p>But slowly… I stood up.<br>And slowly… we continued.</p><h4 class="font-bold text-xl mt-6 mb-2">A Strange Turn of Destiny</h4><p>I passed a small road and continued ahead.<br>After a few minutes, something inside me told me to turn back.</p><p>I don’t know why.<br>There was no reason. No logic.<br>But I listened.</p><p>I went back.</p><p>And that one decision changed everything.</p><p>As I rode back toward that road, I didn’t know what I was going to find.<br>But something inside felt calm… like I was being guided.</p><p>The mountains were silent. The road was empty.<br>Only the sound of my engine and the cold wind moving past me.</p><p>And in that silence, I could feel everything more clearly.</p><p>The day had already tested me — physically and mentally.<br>The cold, the fall, the uncertainty… it all stayed with me.</p><p>That’s when it hit me.</p><p>The day was hard.<br>Solo travel is beautiful… but it is not easy.<br>When you travel alone, you face everything alone — happiness, sadness, loss, fear, strength.</p><p>The day had started normally.<br>Just another cold morning in the mountains.<br>But suddenly… he broke down.</p><p>And strangely, I didn’t feel angry.<br>I felt emotional.<br>Because it was not his fault.</p><p>For more than 7,000 kilometres, across forty continuous days…<br>he had carried me everywhere — through broken roads, muddy tracks, mountain passes, dust storms, and places where there was not even a proper road.</p><p>He had never complained.<br>He had never stopped.<br>He had never left me.</p><p>And now… when he was finally tired… I could see it.</p><p>He was hurt.<br>He was broken.<br>But he was still standing there for me.<br>Still trying to move forward.<br>Still trying to protect me.</p><p>Even in pain… he didn’t give up.</p><p>Now when I think about it… it feels like he knew.<br>He knew help would come there.<br>And he brought me exactly to that point.</p><p>At some moment, he completely gave up — not randomly, but at the right place.</p><p>And then, suddenly, a man noticed my KA-09 number plate.<br>He stopped. He spoke in Kannada.</p><p>He was from Mysuru.<br>An Indian Air Force officer.</p><p>Trust me — I was shocked.</p><p>We stood there talking, trying to understand how this even happened.<br>And he told me something that stayed with me.</p><p>He said he usually never comes to that road.<br>But that day… he did.<br>And this happened.</p><p>He understood my situation immediately.<br>And with just one phone call, he arranged a place for me to stay and food for me.<br>That moment… that trust… it was something I will never forget.</p><p>In that cold, uncertain mountain moment… everything changed.</p><p>I had started this journey alone.<br>But at that moment, I didn’t feel alone at all.</p><p>That is the power of a journey.<br>It gives you people.<br>It gives you care.<br>It gives you support — when you least expect it.</p><p>That day didn’t feel like coincidence.<br>It felt like a miracle.</p><h4 class="font-bold text-xl mt-6 mb-2">Trying to Save the Journey</h4><p>After getting the stay and finally settling down for a while, I stepped out again around 2 PM to search for a mechanic.</p><p>Somewhere inside, I still believed the problem could be fixed.</p><p>After asking around in Tawang, I finally found a local mechanic.<br>He carefully checked the suspension and immediately understood the issue.</p><img src="images/chapter-39_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>He told me honestly,<br>“Getting a brand-new suspension here will be very difficult.”</p><p>That’s when the real situation became clear.</p><img src="images/chapter-39_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>During that time, there was a festival happening in Assam and Arunachal Pradesh.<br>Even if I placed an order immediately, the suspension would take nearly a week to reach Tawang.</p><p>I started calling friends, checking possibilities, trying to understand what could be done.<br>For a moment, I even thought about shipping the bike back to Guwahati.</p><p>But when I checked the transport cost, it was shocking.<br>Nearly ₹20,000 or more just to move the bike from Tawang to Guwahati.</p><p>The mechanic still didn’t give up.</p><p>He tried his best to somehow make the bike rideable again.<br>We searched for old suspensions from other bikes.<br>Tried fitting different ones.</p><p>One suspension didn’t fit properly.<br>Another one failed completely.<br>We tried two or three different setups… but nothing worked.</p><video src="videos/chapter-39_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Still, they kept trying patiently.<br>No frustration.<br>No irritation.<br>Just effort.</p><p>That touched me deeply.</p><p>Even in a remote mountain town, people were trying their best to help a stranger continue his journey.</p><p>Finally, when nothing worked, they carefully reassembled everything they had removed and fitted the original parts back properly.</p><video src="videos/chapter-39.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>By the time everything was done, darkness had already started falling.<br>When I checked the time, it was around 5:30 PM.</p><img src="images/chapter-39_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The cold mountain evening had returned.</p><p>I slowly rode back to the stay.<br>Not with disappointment.<br>But with acceptance.</p><p>That day had already taught me something important.</p><p>Not every problem gets solved immediately.<br>Sometimes the journey asks you to pause… trust… and continue one step at a time.</p><p>Back at the stay, I finished my work quietly.<br>Later, I had dinner and sat alone for some time thinking about the day.</p><p>The mountains outside were silent again.<br>But inside me, something had changed.</p><p>And somewhere inside, I understood something very simple.</p><p>Life doesn’t always need to be complicated.<br>A simple life… is a happy life.</p><p>This journey had already given me so much — love, care, support, new perspectives, and hope.</p><p>It taught me the power of living in the present moment.<br>Of trusting the road.<br>Of staying humble enough to receive what life offers.</p><p>And in that moment, standing there in the mountains, I knew —<br>my bike didn’t give up on me.<br>He brought me there… because he cared.</p><h4 class="font-bold text-xl mt-6 mb-2">More Than a Machine</h4><p>At that moment I realised something.</p><p>This was not just a motorcycle.<br>It had become a partner in the journey.</p><p>A silent companion that had carried me through thousands of kilometres without asking for anything.</p><p>And even when it had no strength left…<br>it chose the place where it would stop.</p><p>A remote mountain road, where somehow help would arrive.</p><p>And it did.</p><p>If we had missed each other by even a minute, that meeting might never have happened.</p><p>That moment didn’t feel like luck.<br>It felt like perfect timing.</p><p>Maybe some journeys are not just planned by us.<br>Maybe they are guided.</p><h4 class="font-bold text-xl mt-6 mb-2">A Promise Between Rider and Machine</h4><p>I placed my hand on the tank.</p><p>And I didn’t say anything.<br>But inside… I thanked him.</p><p>For every kilometre.<br>For every struggle.<br>For staying with me… even when he couldn’t anymore.</p><p>This was not just a bike anymore.</p><p>This was loyalty.<br>This was trust.<br>This was emotion.</p><p>And that day… he became a part of me.</p>', quote: '"Some breakdowns are not failures — they are where life steps in and takes control."' },
        { type: 'chapter', id: 'ch40', title: 'Faith Over Fear', chapter: 'Ch  40', stats: 'Faith', image: 'images/chapter-40.jpg', desc: '<p>After the intense events of the previous day, I finally slept peacefully.</p><p>The next morning I woke up around 6:30 AM. For the first time in many days, I had allowed myself to wake up a little later.<br>From the guest house, I could see the sun slowly rising over the mountains of Tawang. Golden light touched the snow-covered peaks and slowly spread across the valley.</p><img src="images/chapter-40_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>For a few minutes, I simply stood there watching.<br>Even after everything that had happened with my bike the previous day, the morning felt calm.</p><p>Sometimes the mountains remind you that problems are small in front of nature.</p><h4 class="font-bold text-xl mt-6 mb-2">Starting the Day Slowly</h4><p>The weather was still extremely cold.<br>I started the day slowly with a cup of hot tea, then took a bath and went for breakfast.</p><p>While eating, the thought of the bike stayed in my mind.<br>The suspension was broken.<br>Proper spare parts were unavailable.<br>And the nearest service center was nearly 500 kilometres away in Guwahati.</p><p>But strangely, I was not worried.<br>Somewhere inside me, I felt confident.</p><p>This journey had already shown me many times that help appears when you least expect it.<br>So instead of worrying, I decided to explore Tawang town.</p><h4 class="font-bold text-xl mt-6 mb-2">The Dalai Lama Monastery</h4><p>Around 8 AM, I carefully started the bike and rode slowly toward the Dalai Lama Monastery.</p><p>The moment I entered, a deep silence surrounded me.<br>The monastery was peaceful.<br>Prayer flags moved gently in the cold wind, monks walked quietly through the corridors, and the sound of distant chants echoed through the halls.</p><img src="images/chapter-40_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Standing there, I felt something powerful.<br>Even though the journey had suddenly become uncertain, I still had a strange confidence.</p><p>I told myself:<br>"Things will work out. Just stay calm."</p><img src="images/chapter-40_11.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">The Great Tawang Monastery</h4><p>From there I rode toward the famous Tawang Monastery, one of the largest monasteries in India.</p><p>When I entered, I was amazed by its beauty.<br>The massive prayer hall, the colourful murals, and the giant Buddha statue created an atmosphere that felt sacred and peaceful.</p><img src="images/chapter-40_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><img src="images/chapter-40_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>On that day, a festival ceremony was taking place inside.<br>Monks were chanting, visitors were observing quietly, and the entire monastery felt alive with spiritual energy.</p><img src="images/chapter-40_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I sat there silently for about 15–20 minutes, simply absorbing the moment.<br>Sometimes travel is not about movement.<br>Sometimes it is about pausing in the right place.</p><img src="images/chapter-40_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><video src="videos/chapter-40_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><h4 class="font-bold text-xl mt-6 mb-2">Unexpected Friendships</h4><p>Outside the monastery, a man noticed my Karnataka number plate and approached me.<br>He asked if I was travelling solo.</p><p>Soon we were talking like old friends.<br>He was also surprised to see someone riding all the way from the south to Tawang.</p><p>We clicked a few pictures together and exchanged numbers.<br>Moments like these reminded me that the road connects strangers instantly.</p><h4 class="font-bold text-xl mt-6 mb-2">The Giant Buddha</h4><p>My next stop was the giant Buddha statue overlooking Tawang valley.<br>From there, the view of the mountains was breathtaking.</p><img src="images/chapter-40_6.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The cold air felt pure and refreshing.<br>I sat quietly for some time.<br>Not thinking about the bike.<br>Not thinking about the next destination.<br>Just enjoying the moment.</p><h4 class="font-bold text-xl mt-6 mb-2">Reality Returns</h4><p>Eventually, reality returned.<br>The bike still needed repair.</p><p>So I went back to the same mechanic shop I had visited the previous day.<br>Before that, I had even explored the possibility of shipping the bike to Guwahati.<br>But the cost was extremely high.<br>And somehow, I didn’t feel comfortable with that idea.</p><p>It felt like giving up too quickly.<br>Instead, I chose patience.<br>I trusted the journey.</p><p>Throughout the entire trip so far, whenever something unexpected happened, help had always appeared at the right moment.<br>So I stayed positive.</p><h4 class="font-bold text-xl mt-6 mb-2">The Mechanic’s Effort</h4><p>The mechanic understood my situation immediately.<br>Even though he did not have the correct spare parts, he still wanted to help.</p><p>He began experimenting with whatever parts he had in his small garage.<br>First he tried fitting suspensions from KTM and Pulsar motorcycles.<br>But the sizes and fittings didn’t match properly.</p><p>Finally, he removed a suspension from another bike lying in his garage and carefully modified it.</p><p>The entire rear portion of my bike was dismantled.<br>Panels were opened.<br>Bolts removed.<br>Parts adjusted.</p><img src="images/chapter-40_7.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>After nearly two hours of effort, he managed to install a temporary suspension setup.<br>But there was a compromise.</p><p>Because of the different suspension design, the air filter box could not be fitted back into place.<br>So the mechanic had to remove the air filter completely.</p><p>When I started the engine, the sound shocked me.<br>The bike began roaring loudly, much louder than before.<br>Without the air filter, the engine sounded raw and powerful.<br>It almost felt like a wild machine.</p><p>But at that moment, sound didn’t matter.<br>What mattered was that the bike could move again.</p><h4 class="font-bold text-xl mt-6 mb-2">Something Is Better Than Nothing</h4><p>The repair was not perfect.<br>But it was enough.</p><p>The bike was now stable enough to ride.<br>And sometimes in travel, perfection is not required.<br>Sometimes “something is better than nothing.”</p><p>I thanked the mechanic sincerely.</p><p>After the bike was fixed, I thanked him again.<br>He was happy seeing my happiness, and we exchanged numbers before leaving.</p><p>We also changed the engine oil once more to make sure everything was safe for the coming ride.</p><p>After that, I slowly rode back toward the guest house.<br>Had dinner.<br>Started my work.<br>And somewhere in between, life slowly returned back to normal.</p><p>Later in the afternoon, I stepped out again and bought a few snacks and essentials for the next part of the journey.<br>By around 6 PM, I completed my work.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unexpected Sense of Safety</h4><p>That evening, I spent some time with a few military safety trainers staying nearby.<br>We sat together and spoke for a long time.</p><p>Through those conversations, I learned many things about snow survival, mountain safety, and life in extreme weather conditions.</p><p>But more than information, one thought stayed with me deeply.</p><p>My bike had brought me to an incredibly safe place.</p><p>Even if I had searched intentionally, I probably would never have found such kind people, such safety, and such peace in a remote mountain town.</p><p>What initially looked like a breakdown… had slowly turned into protection.</p><p>And once again, the journey reminded me that not every delay is a problem.<br>Sometimes delays are blessings in disguise.</p><h4 class="font-bold text-xl mt-6 mb-2">Ending the Day</h4><p>With those thoughts in my mind, I returned to my room.</p><p>Outside, the mountains were silent.<br>The cold wind moved softly through Tawang.</p><p>And for the first time after the breakdown, I felt completely relaxed.</p><p>The bike was not perfect.<br>The road ahead was still uncertain.</p><p>But somehow… everything felt okay.</p><p>That night, I slept peacefully.</p>', quote: '“The mountains didn’t fix my problems… they simply taught me not to fear them.”' },
        { type: 'chapter', id: 'ch41', title: 'Kindness in the Mountains', chapter: 'Ch  41', stats: 'Gratitude', image: 'images/chapter-41.jpg', desc: '<p>The next morning I woke up around 6:30 AM. After everything that had happened with my bike, the previous days had been emotionally intense. But that morning felt calm.</p><h4 class="font-bold text-xl mt-6 mb-2">Starting the Day</h4><p>Within half an hour I got ready and went for breakfast. In the Indian Air Force guest house, breakfast was served early, and by 7:30 AM I was already sitting down for a warm meal.</p><p>After breakfast, I walked toward my bike again.<br>The temporary suspension setup had solved one problem, but created another.</p><p>Since the mechanic had removed the air filter box completely, the bike could not run normally without some kind of protection from dust and cold air.</p><p>So that morning, standing in the freezing mountain air, I did something simple.</p><p>I took one of my socks…<br>and carefully fitted it in place of the air filter.</p><video src="videos/chapter-41_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>It looked strange.<br>Almost funny.</p><p>But at that moment, it felt emotional.</p><p>Even after everything — broken suspension, falls, freezing roads, temporary fixes — he was still ready to carry me forward.</p><p>The bike wasn’t perfect anymore.<br>Neither was the journey.</p><p>But somehow, both of us were still moving.</p><p>Standing there in the cold mountains of Tawang, looking at my dust-covered bike with a sock fitted into the engine like a temporary breath of life… I smiled.</p><p>Because that machine had stopped feeling like metal long ago.</p><p>He was tired.<br>He was wounded.<br>But he still wanted to continue the journey with me.</p><p>And honestly… that loyalty felt deeply human.</p><p>With that thought in my mind, I slowly started the bike again.<br>The engine roared loudly through the cold mountain air.</p><p>Then I began riding toward the Tawang War Memorial.</p><img src="images/chapter-41_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Tawang War Memorial</h4><p>The place carried a deep sense of respect and silence. Standing there, surrounded by the names of soldiers who had sacrificed their lives, made me realise how peaceful our journeys are compared to the sacrifices made by the people protecting these borders.</p><p>I spent some time there before heading to the War Museum nearby.</p><h4 class="font-bold text-xl mt-6 mb-2">Inside the War Museum</h4><p>Inside the museum, I again met a few travellers from Andhra Pradesh and Tamil Nadu. They were curious at first, but when they heard about my solo journey, they were genuinely surprised and happy. They appreciated the effort, wished me well, and their words brought a quiet smile to my face.</p><p>In a place filled with history and sacrifice, those small human connections felt even more meaningful.</p><p>One thing that caught my attention inside the museum was something very unique — the sands collected from different states of India. Seeing them all together in one place felt powerful. It reminded me how vast and diverse our country is, and at the same time, how everything is connected.</p><p>Standing there, looking at those layers of soil, I felt a strange sense of pride and belonging.</p><img src="images/chapter-41_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Meeting the IAF Officer</h4><p>Behind the museum was the Indian Air Force office, where the officer I had met the previous day worked. After finishing my visit, I called him.</p><p>Soon he arrived.<br>We spent some time talking and then walked together to the Air Force canteen, where we had snacks and tea.</p><p>During our conversation he shared an interesting story about the region. In Tawang, people traditionally did not cook a Chilly bajji. But after the Air Force officers introduced it and started using it in their meals, IAF canteen gradually began cooking it too.</p><p>Small cultural exchanges like that quietly change communities.</p><img src="images/chapter-41_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>We continued walking and talking for a while. Then the officer asked me about my next plan.</p><p>I told him I was thinking about visiting Bumla Pass, but I knew the permit process usually takes time.</p><p>To my surprise, he simply asked for my Aadhaar and vehicle documents and said he would arrange the permit.<br>Normally travellers have to wait a day and pay certain charges, but thanks to his help everything was processed quickly.</p><p>All I had to do was collect the permit the next day.</p><p>Before leaving, he also suggested that I attend the light and laser show at the War Memorial in the evening.<br>After thanking him, I returned to my stay and started my work for the day.</p><h4 class="font-bold text-xl mt-6 mb-2">A Relaxed Afternoon</h4><p>The afternoon was relaxed.<br>I spent some time chatting with two travellers staying there — one from Manali and another from Jammu & Kashmir. We exchanged travel stories and laughed about the strange situations that travellers often face.</p><p>For the first time in many days, there was no pressure to ride long distances.<br>No uncertainty.<br>No rushing.</p><p>Just conversations, mountains, and stillness.</p><h4 class="font-bold text-xl mt-6 mb-2">Light and Laser Show</h4><p>Later in the evening, around 5:30 PM, I went back to the War Memorial to watch the light show.</p><img src="images/chapter-41_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The show beautifully narrated the history of the region and the bravery of the soldiers who fought there. Watching it under the cold mountain sky felt powerful and emotional.</p><p>The lights moved across the memorial walls while the story of sacrifice echoed through the silence of the mountains.</p><p>For a few moments, nobody spoke.<br>Everyone simply watched.</p><p>It was not just entertainment.<br>It felt like remembrance.</p><h4 class="font-bold text-xl mt-6 mb-2">Messages That Touched Me</h4><p>By 7:30 PM, I returned to my stay, had dinner, and spent some more time talking with the travellers.</p><p>Before sleeping, I checked my phone.<br>And what I saw touched me deeply.</p><p>Two days earlier my bike had broken down, and somehow the story had reached many people. There were messages waiting for me.</p><p>Some people were asking if I was safe.<br>Some were waiting for my updates.<br>Some even asked if I needed help.</p><p>Many of them were not even close friends.<br>Still, they cared.</p><p>Reading those messages made me emotional.<br>Sometimes the road teaches you that even strangers can become silent supporters of your journey.</p><p>And somewhere in that moment, I realised something beautiful.</p><p>No journey is truly solo.<br>Along the way, people silently begin walking with you — through prayers, kindness, concern, and support.</p><h4 class="font-bold text-xl mt-6 mb-2">A Peaceful End</h4><p>That night I slept peacefully.<br>The next morning, I would ride to Bumla Pass, one of the most remote and historic borders in India.</p><p>The mountains outside were silent again.<br>But inside me, there was gratitude.</p><p>For the people.<br>For the road.<br>And for everything this journey was slowly teaching me.</p>', quote: '"Sometimes the road teaches you that even strangers can become silent supporters of your journey."' },
        { type: 'chapter', id: 'ch42', title: 'Not the Destination — The Journey It Carried', chapter: 'Ch  42', stats: 'Perseverance', image: 'videos/chapter-42.mp4', desc: '<p>The next morning I woke up around 5:30 AM.<br>It was freezing cold — nearly –6°C.</p><p>Outside, thin layers of ice had formed on rooftops and vehicles. The air was so sharp that breathing itself felt cold.</p><p>That day I had planned something special.<br>Bumla Pass.</p><p>Because of the temporary suspension fix, I decided to travel with as little weight as possible. I removed all the luggage from my bike and left most of it in the room.</p><img src="images/chapter-42_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Around 6:30 AM, I went to the War Museum office to collect my permit.<br>After signing the entry register, I received the Bumla Pass permit.</p><p>Just as I was about to leave, I realised I had forgotten my Insta360 camera and Aadhaar card at the stay.<br>Without those documents I wouldn’t be allowed to cross the checkpoints.</p><p>So I had to ride back, collect them, and start again.</p><p>Finally, around 6:45 AM, I began the journey.</p><h4 class="font-bold text-xl mt-6 mb-2">The Frozen Road</h4><p>After barely three kilometres, my hands became completely numb.<br>The cold was brutal.</p><p>I had to stop for a few minutes just to rub my hands and regain feeling in my fingers.</p><p>Soon I reached a small frozen lake.<br>The surface of the lake had turned into solid ice.</p><img src="images/chapter-42_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>While I was standing there admiring the view, a man with his young child approached me. They were excited to see someone travelling alone on a motorcycle in such extreme conditions.</p><video src="videos/chapter-42_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>We talked for a few minutes and took pictures together.<br>Moments like that always make the journey special.</p><h4 class="font-bold text-xl mt-6 mb-2">The Roaring Bike</h4><p>My bike sounded very different that day.<br>Since the air filter had been removed, the engine was breathing raw air directly. The sound was loud and aggressive.</p><p>On the quiet mountain roads, the roar echoed through the valley.<br>At such high altitude, the engine was already struggling because of the thin air. Every climb required patience.</p><img src="images/chapter-42_6.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Still, the road ahead was stunning.<br>Every few kilometres there were military camps, reminding me how close I was to the international border.</p><p>And somehow… even after everything he had gone through, he still kept moving forward with me.</p><p>The suspension was temporary.<br>The engine was exposed.<br>The cold was extreme.</p><p>But he refused to stop.</p><p>That morning, every kilometre felt emotional.<br>Not because of the destination.<br>But because I could feel the journey in every vibration of the bike.</p><h4 class="font-bold text-xl mt-6 mb-2">Frozen Lakes and Open Silence</h4><p>Further along the road I reached another completely frozen lake.<br>I stopped again.</p><img src="images/chapter-42_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>This time I even rode my bike carefully onto the icy ground near the lake, just to experience the feeling of standing in such a surreal place.</p><p>Snow patches surrounded the area and the entire valley looked silent and untouched.<br>The view was breathtaking.</p><p>I set up my tripod to take a picture with my bike.<br>But suddenly a strong wind knocked the camera down.</p><p>For a moment my heart stopped — I thought someone had taken it.<br>Thankfully it had just fallen.<br>I fixed the tripod again using stones and finally managed to capture the picture.</p><h4 class="font-bold text-xl mt-6 mb-2">Bumla Pass</
