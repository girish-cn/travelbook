            { type: 'chapter', id: 'ch46', title: 'A Friend’s Home in Bihar', chapter: 'Ch  46', stats: 'Umari', image: 'videos/chapter-46.mp4', desc: '<p>The next morning I woke up around 5 AM.</p><p>Everything was ready, and after saying goodbye to the hostel owner — I started my ride.</p><p>That day’s destination was my friend’s home in Umari, Madhubani district, Bihar, around 280 kilometres away.</p><p>The morning ride was calm and pleasant.<br>By around 7 AM, I crossed the West Bengal border.</p><p>Somewhere along the road I stopped for breakfast and had some fresh fruit before continuing the ride.</p><h4 class="font-bold text-xl mt-6 mb-2">A Warm Welcome</h4><p>Around 11:30 AM, I finally reached my friend’s place.<br>The moment he saw me, his face lit up with excitement.</p><p>Once I reached the village, his excitement was on another level.<br>Earlier, while I was on my onward journey, I was supposed to visit him — but due to time constraints, I had to take a different route.</p><p>Even then, he remembered.<br>And now that I had finally arrived, the happiness on his face was real and pure.</p><p>I was honestly touched.<br>I never expected such love and warmth from him and his family.</p><p>We had met during previous rides, but the way he welcomed me felt like I was visiting family.</p><p>After freshening up, I started my work.<br>And while I was working, something beautiful was happening in the background.</p><p>A delicious meal was being prepared.<br>Chicken biryani, curry, vegetables — everything made with care.</p><p>Trust me, the food was amazing.<br>Not just because of the taste, but because of the feeling behind it.</p><p>I had my meal with gratitude.<br>It felt like home.</p><p>After that, I told him that I had to leave the next day.</p><p>He was shocked.<br>He wasn’t ready to let me go.</p><p>He had already made plans — places to show, experiences to share.</p><p>But I had to move forward.</p><p>Still, he didn’t give up.<br>He told me, “Finish your work early… I’ll take you out.”</p><p>So I completed my work by around 2 PM.</p><h4 class="font-bold text-xl mt-6 mb-2">A Day in the Village</h4><p>After that, he took me on a village ride.</p><p>We visited a few nearby places, and he proudly introduced me to his friends and people from nearby houses.</p><p>Later, we went to the local market.<br>We had local snacks, walked around, and experienced the simple rhythm of village life.</p><p>Then he took me to his uncle’s shop.<br>We spent some time there talking.</p><p>Before leaving, he bought me sweets and snacks for my journey ahead.</p><p>That gesture… it stayed with me.<br>That kind of care is rare.</p><p>And in that moment, I once again felt grateful for this journey.</p><p>It kept bringing such people into my life again and again.</p><p>After that, we returned home, had dinner, and later went for a walk.</p><p>During the walk, we met many elders in the village.<br>And every time, he proudly said,<br>“He has come all the way from Mysuru, Karnataka.”</p><p>That pride in his voice… it made me emotional.</p><p>I felt happy.<br>Truly happy.</p><p>This journey had given me something beyond roads and destinations.</p><p>It had given me people.<br>Real people.<br>Genuine connections.</p><h4 class="font-bold text-xl mt-6 mb-2">A Night of Conversations</h4><p>That night we had dinner with his family members, sharing stories, laughter, and travel experiences.</p><p>He kept insisting that I should stay longer.<br>In fact, he had planned to show me many more places nearby — even Nepal, which was only about 65 kilometres away.</p><p>But I had to continue my journey.</p><p>Around 10:30 PM, after a long day of conversations, I finally went to sleep.</p>', quote: '"I travelled to see places, but it was people who made the journey unforgettable."' },
            { type: 'chapter', id: 'ch47', title: 'Leaving With Gratitude', chapter: 'Ch  47', stats: 'Patna', image: 'images/chapter-47.jpg', desc: '<p>The next morning something beautiful happened.<br>When I woke up, my friend was already awake.</p><p>It was 5:30 AM, and he was preparing breakfast for me.<br>Watching him cook fresh rotis and food early in the morning just so I could start my journey comfortably touched my heart.</p><p>I had once read somewhere — “No luxury is greater than a friend cooking for you.”<br>And in that moment, I truly felt it.</p><p>This guy touched me deeply with his gestures.<br>It wasn’t about the food.<br>It was about the care.</p><p>Moments like these are difficult to explain.<br>Sometimes people you meet during travel show more care than even close friends.</p><p>We sat together and had breakfast before I prepared to leave.</p><p>Saying goodbye was not easy.<br>He genuinely wanted me to stay longer and explore nearby places.</p><p>For a moment, even I felt confused about leaving.<br>But the road was still calling.</p><p>At 6:30 AM, I finally started my ride.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unexpected Stop</h4><p>A few hours into the ride, something unusual happened.<br>A group of young boys had stretched a rope across the national highway, stopping vehicles.</p><p>At first I felt nervous.<br>There was no one else around.</p><p>But when they approached me, they were simply curious.<br>They asked about my ride, clicked pictures with me, and after a few minutes they happily let me continue.</p><h4 class="font-bold text-xl mt-6 mb-2">The Ganga Bridge</h4><p>Eventually I reached Patna.<br>As I entered the city, I crossed the massive bridge over the Ganga River.</p><p>It was unbelievably long and built at such a height that I was genuinely shocked.<br>The river stretched endlessly beneath me.</p><p>Riding on that bridge felt surreal.<br>The Ganga flowed with power and calm at the same time.</p><p>For a few moments, I just absorbed it.<br>It was not just a crossing.<br>It was an experience.</p><h4 class="font-bold text-xl mt-6 mb-2">Exploring Patna</h4><p>After reaching the hostel, I started my work around 11 AM.<br>Later in the afternoon, after lunch, I went out to explore the city.</p><p>I rode through Patna streets, observing the life around me.<br>The city had its own energy.</p><p>One road that stayed with me was Atal Path.<br>It was so beautiful, wide, and well-maintained.</p><p>I really liked that road.<br>Sometimes a road itself becomes a memory.</p><p>I also visited the Patna Museum and walked through nearby markets and streets.<br>The city had its own charm.</p><p>In the evening I walked through the town again and eventually returned to the hostel.</p><p>That night I had dinner, spoke with the hostel owner for a while, and prepared for the next day’s ride.<br>The next destination would be Varanasi.</p><p>Around 10:30 PM, I went to sleep.<br>Another chapter of the journey had quietly passed.</p>', quote: '“Sometimes the road gives you views… and sometimes it gives you people who become the view.”' },
            { type: 'chapter', id: 'ch48', title: 'Returning to Kashi', chapter: 'Ch  48', stats: 'Varanasi', image: 'images/chapter-48.jpg', desc: '<p>Day 48 began early again.<br>I woke up around 5:30 AM in Patna, packed the final things on my bike, and by 6 AM I had already started riding.</p><p>My plan was to reach Varanasi.<br>But somewhere along the ride, something changed in my mind.</p><p>I decided to head toward Sarnath instead — a place that had been on my list for many days.</p><p>The morning air was cool and the roads were calm.<br>After riding for some time, I stopped at a small roadside tea stall. A few truck drivers were sitting there, having their morning tea.</p><p>I joined them.<br>What surprised me most was how warmly they treated me. Within minutes they started asking about my journey, where I had come from, and where I was heading. They were genuinely curious and friendly.</p><p>Before I even realized it, they had already paid for my tea.<br>Moments like this always reminded me how simple kindness can appear on the road.</p><p>I also tried some local Bihari breakfast there before continuing the ride.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unusual Stretch</h4><p>After entering Uttar Pradesh, something strange happened.<br>For almost 20+ petrol pumps, there was no petrol available — only diesel.</p><p>It felt unusual and slightly concerning.<br>But after riding another 10 kilometres, I finally found a pump with petrol.</p><p>That moment brought relief.<br>Sometimes even small things feel big on the road.</p><h4 class="font-bold text-xl mt-6 mb-2">Riding Toward Sarnath</h4><p>At one point I realised my bike chain lubrication had completely worn out, so I started searching for a shop to buy chain lube. But on that stretch of road I couldn’t find any.<br>So I decided to continue and buy it later.</p><p>After another tea stop along the highway, I finally reached Sarnath.</p><p>Sarnath is only a short distance from Varanasi, but the atmosphere there felt completely different.</p><h4 class="font-bold text-xl mt-6 mb-2">Peace in Sarnath</h4><p>I found a small stay near the Sarnath temple and checked in.<br>The stay was good, simple, and peaceful.</p><p>After parking my bike and taking a bath, I started my work for the day. By around 2 PM, my work was finished.</p><p>Then I stepped out to explore.<br>I visited the Sarnath museum, the park, and the Buddhist temples around the area.</p><p>The entire place felt incredibly calm.<br>Compared to the chaos people usually associate with Varanasi, Sarnath felt peaceful and gentle. The streets were quiet, people spoke softly, and there was a sense of stillness everywhere.</p><p>I spent several hours simply walking around and observing the surroundings.<br>By 4:30 PM, I returned to the stay and finished the rest of my work.</p><h4 class="font-bold text-xl mt-6 mb-2">Entering Kashi</h4><p>In the evening, I decided to visit one of the most sacred places in India — Kashi Vishwanath Temple.<br>From my stay, the temple was around 9 kilometres away.</p><p>So I took my bike and started riding toward the old city.<br>But as I moved closer, the situation changed quickly.<br>The roads became extremely crowded.</p><p>After another two kilometres, I realized I simply couldn’t take the bike any further. The streets were overflowing with people.</p><p>So I found a cloth shop near a large hotel where they allowed me to park my bike safely.<br>From there, I continued on foot.<br>Even walking was difficult because the lanes were so crowded.</p><h4 class="font-bold text-xl mt-6 mb-2">Darshan at Kashi Vishwanath</h4><p>Finally, after slowly moving through the narrow streets, I reached Kashi Vishwanath Temple.</p><p>I spent a long time there.<br>Standing in that sacred space felt deeply emotional. After travelling thousands of kilometres across the country, reaching Kashi felt like a moment of spiritual pause in the journey.</p><p>That moment felt special in another way too.<br>This journey had begun in the Northeast after first visiting Varanasi — Kashi.</p><p>And now, it was slowly coming full circle… ending again at the same sacred place.</p><p>People often say, “You don’t plan Kashi… Kashi plans you.”<br>And in my case, it felt completely true.</p><p>I felt happy.<br>Deeply content.</p><p>After the darshan, I visited the Annapurna temple and had food there.<br>Simple food, but it felt like a blessing.</p><p>Later, I took a small walk along the ghats.<br>The evening air, the sound of the river, and the calmness after the crowd — everything felt complete.</p><p>For a few moments, I just stood there, absorbing it all.</p><p>Then slowly, I started walking back.</p><h4 class="font-bold text-xl mt-6 mb-2">Returning to Sarnath</h4><p>After leaving the temple, I walked back through the crowded streets to where my bike was parked.<br>Luckily, everything was safe.</p><p>Before leaving, I finally bought chain lube and lubricated the chain there itself since it had been overdue.<br>Then I rode back to Sarnath.</p><p>At the stay, the hotel owner asked me about dinner, but I had already eaten outside.<br>So I packed my luggage for the next day’s ride.</p><p>The room was quiet.<br>And after another long day of riding, walking, and exploring sacred places, I finally went to sleep.</p>', quote: '“I thought I was riding to Kashi… but Kashi had already decided when I would return.”' },
            { type: 'chapter', id: 'ch49', title: 'Learning to Sit Still', chapter: 'Ch  49', stats: 'Rewa', image: 'images/chapter-49.jpg', desc: '<p>The next morning, I woke up around 5:30 AM.</p><p>There was nothing special planned for that day.<br>No famous destination.<br>No major landmark waiting ahead.<br>Just another day on the road.</p><p>I packed my luggage, strapped everything onto my bike, and by 6 AM I started riding toward Rewa in Madhya Pradesh.</p><p>The morning ride was calm.<br>The roads were quiet, the air slightly cold, and my mind felt unusually relaxed. After weeks of riding through mountains, borders, and unknown terrains, this ride felt simple.</p><p>Around 8:30 AM, I stopped for breakfast at a small roadside place.<br>Nothing fancy.<br>Just simple food and tea.<br>But somehow, it tasted perfect.</p><p>After breakfast I filled fuel for the bike and continued riding toward Rewa.</p><h4 class="font-bold text-xl mt-6 mb-2">Arriving Without Expectations</h4><p>By afternoon, I reached Rewa city.<br>Finding a stay there was slightly difficult. Most of the hotels were either expensive or fully booked.</p><p>Finally, after some searching, I found a small room for ₹299.<br>It wasn’t luxurious.<br>But it was perfect for the night.</p><p>After checking in, I freshened up and started my work for the day.<br>Luckily, the work was light.<br>By 6 PM, everything was finished.</p><h4 class="font-bold text-xl mt-6 mb-2">A Walk Without a Destination</h4><p>In the evening, I stepped outside.<br>This time, I had no plan.<br>No temple to visit.<br>No monument to see.</p><p>So I simply started walking through the streets of Rewa.</p><p>For nearly four kilometres, I walked through the city.<br>I watched shops opening and closing.<br>People chatting with friends.<br>Children playing near the roads.<br>Street vendors preparing food.</p><p>Everything looked so ordinary.<br>But somehow, it felt beautiful.</p><h4 class="font-bold text-xl mt-6 mb-2">A Moment of Realization</h4><p>After travelling thousands of kilometres across the country, I suddenly felt something I had not felt in a long time.<br>Stillness.</p><p>There was no rush.<br>No anxiety about the future.<br>No thoughts about the past.<br>My mind was simply present.</p><p>I sat near a small roadside shop and watched people passing by.<br>Everyone was moving somewhere.<br>Everyone was busy with their own lives.</p><p>And there I was — just sitting, observing, breathing.</p><p>At that moment, a simple thought came to my mind:<br>Maybe happiness is not about reaching somewhere.<br>Maybe it is about learning to pause in between journeys.</p><h4 class="font-bold text-xl mt-6 mb-2">A Simple Truth</h4><p>That evening in Rewa taught me something powerful.<br>Life does not always have to be about chasing destinations.<br>Sometimes the most meaningful moments happen when we stop running.</p><p>When we sit quietly.<br>When we watch the world move.<br>When we allow ourselves to simply exist.</p><p>And maybe that is what a simple life truly means.<br>Moving through places.<br>Meeting people.<br>And sometimes just sitting by the roadside, watching everyone pass through their own journeys.</p><p>Life is not always simple.<br>But we can always choose to live it simply.</p><p>That night, when I returned to my small room, there was no excitement, no exhaustion — just a quiet sense of contentment.</p><p>I lay down without overthinking the next destination.<br>Without planning too much ahead.</p><p>I wasn’t chasing the road.<br>I was at peace with it.</p><p>Outside, the city slowly went silent.<br>And inside, so did I.</p><p>Sleep came gently.<br>Not as an escape.<br>But as a continuation of that calm.</p>', quote: '"Maybe happiness is not about reaching somewhere. Maybe it is about learning to pause in between journeys."' },
            { type: 'chapter', id: 'ch50', title: 'When the Road Became Meditation', chapter: 'Ch  50', stats: 'Nagpur', image: 'images/chapter-50.jpg', desc: '<p>The next morning, I woke up very early again.<br>It was 5:30 AM.</p><p>After taking a quick bath and packing my things, I started my ride. My plan for the day was simple — reach Nagpur.</p><p>The roads that morning were beautiful. Smooth highways, long straight stretches, and very little traffic. Because the road was so good, I was able to maintain a steady speed.</p><p>By 10 AM, I had already covered nearly 300 kilometers.</p><p>I stopped for breakfast at a small roadside place.<br>While eating, a few elderly men sitting nearby started talking to me. They were curious about the luggage on my bike and where I was coming from. When I told them about my journey across the country, they were surprised. Our conversation went on for a while — simple talks about travel, life, and the road.</p><p>After breakfast, I continued riding.</p><h4 class="font-bold text-xl mt-6 mb-2">When Strangers Become Part of the Journey</h4><p>Somewhere in Madhya Pradesh, I stopped for a short break. While I was standing there, one person who had noticed my bike earlier came looking for me. He had followed me for nearly 15 minutes, just to ask about my ride and take a picture.</p><p>We spoke for some time.</p><p>He told me he was an engineer working with the National Highway Authority, and he was fascinated by the journey.</p><p>Moments like these reminded me how a journey doesn’t just connect cities — it connects people.</p><h4 class="font-bold text-xl mt-6 mb-2">A Day of Long Roads</h4><p>By around 4 PM, I had already reached Nagpur.</p><p>That meant I had covered more than 550 kilometers that day.</p><p>Originally, my plan was to stop there for the night.</p><p>But after taking a short tea break and talking to a few people at the tea stall, I started thinking again.</p><p>I still had time.</p><p>And the road ahead was still calling.</p><p>So I checked the routes.</p><p>One road would take me through Hyderabad, but I had already travelled that road earlier and remembered the road conditions weren’t that great.</p><p>Another route was slightly longer — almost 60 kilometers extra — but the road conditions were much better.</p><p>Without thinking too much, I decided to keep riding.</p><p>Sometimes on a long journey, you stop planning so much.</p><p>You simply follow the road.</p><h4 class="font-bold text-xl mt-6 mb-2">Riding Without Thinking</h4><p>As the evening slowly approached, I kept riding.</p><p>There was something very peaceful about that ride.</p><p>After spending nearly 14 hours on the road, I had covered almost 700 kilometers that day.</p><p>But it didn’t feel exhausting.</p><p>Instead, it felt like a long meditation.</p><p>When you ride for so many hours with a helmet on, listening to the sound of the engine and the wind, your mind slowly becomes quiet.</p><p>Thoughts settle.</p><p>The past disappears.<br>The future stops worrying you.<br>Only the road exists.</p><h4 class="font-bold text-xl mt-6 mb-2">The Meaning of the Journey</h4><p>Somewhere along that long ride, I realized something important.<br>This journey was never only about the destinations.<br>It was about everything in between.<br>Every road that showed me new possibilities.<br>Every stranger who stopped to ask about the ride.<br>Every moment when I simply sat somewhere and watched life move around me.<br>And somewhere along those thousands of kilometers, I had changed too.<br>Maybe the journey wasn’t about where I was going.<br>Maybe it was about who I was becoming along the way.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Arrival</h4><p>As I reached Yavatmal, there was no rush anymore.<br>No excitement.<br>Just calm.</p><p>Since I knew the place, I went directly to a stay.<br>The dorm boy there was very chill and helpful.<br>He was friendly and immediately made me feel comfortable.</p><p>He even showed me a safe place to park my bike.<br>That small gesture brought a sense of relief.</p><p>I freshened up and stepped out for dinner.<br>Had a good meal.<br>Nothing fancy — but it felt right after such a long day.</p><p>When I returned, we sat and spoke for some time.<br>Simple conversation.<br>Easy.</p><p>No rush.<br>No noise.<br>No pressure.</p><p>That night, sleep came quietly.</p>', quote: '"Maybe the journey wasn’t about where I was going. Maybe it was about who I was becoming along the way."' },
            { type: 'chapter', id: 'ch51', title: 'The Road Back Home', chapter: 'Ch  51', stats: 'Vijayapura', image: 'images/chapter-51.jpg', desc: '<p>The next morning there was no big plan.<br>No long destination waiting.<br>No mountains to climb.<br>Just the road slowly bringing me closer to home.</p><p>I started the ride early in the morning.</p><p>Before leaving, I went back to the stay and returned the key to the boy there.<br>Small things like that matter on long journeys.</p><p>The previous day, I had searched for engine oil but couldn’t find the one I usually use.<br>And that day, I had to get it changed.</p><p>Since it was Sunday, many shops were closed.<br>Finding the right engine oil for my bike was not easy.</p><p>I searched for quite some time, and finally managed to get it done.</p><p>Only after that, I started riding again.</p><h4 class="font-bold text-xl mt-6 mb-2">A Small Moment of Innocence</h4><p>Somewhere along the highway, I stopped at a small tea stall.<br>There, I met a tiny puppy.</p><p>He looked at me with those innocent eyes, curious and fearless at the same time.<br>For a few minutes, I forgot about the journey, the kilometers, and the destination.</p><img src="images/chapter-51_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>It was just me and that little soul.<br>Sometimes the road gives you moments like that — simple, pure, and unexpected.</p><h4 class="font-bold text-xl mt-6 mb-2">Crossing Into Karnataka</h4><p>As I kept riding, the distance to home kept reducing.<br>Eventually, I crossed back into Karnataka.</p><p>At that moment, something inside me felt different.<br>After more than 50 days on the road, thousands of kilometers, countless strangers, breakdowns, sunrises, and silent highways — I was finally riding back into the state where my journey had begun.</p><p>It felt strange.<br>The road was familiar again.<br>But I was not the same person who had left.</p><h4 class="font-bold text-xl mt-6 mb-2">A Journey That Changed Me</h4><p>Somewhere along the highway, I stopped and looked at the road stretching ahead.</p><p>Some roads don’t just show directions.<br>They show possibilities.</p><p>And somewhere along those miles, my thoughts had settled.<br>Slowly, quietly, without even realizing it, I had started changing.</p><p>Maybe the ride was never just about reaching places.<br>Maybe it was about who I was becoming along the way.</p><h4 class="font-bold text-xl mt-6 mb-2">Returning to Vijayapura</h4><p>By evening, I reached Vijayapura.<br>I had visited this place before — around six years back.</p><p>And as I entered the city, something inside me shifted.</p><p>The roads felt familiar.<br>The places felt known.<br>But the memories… they felt fresh.</p><p>It didn’t feel like six years.<br>It felt like I had been here just a few days ago.</p><p>This place held something soft and personal for me.<br>Some cute and sweet memories.</p><p>And for a moment, I found myself going back into those memories.</p><p>Sometimes, we need to stay in the past for a while.<br>Not to get stuck.<br>But to remind ourselves how far we have come.</p><p>Some memories don’t make you weak.<br>They make you stronger.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Dinner</h4><p>That night, I sat alone at a small roadside restaurant.<br>A simple plate of food in front of me.<br>My phone playing soft music.<br>Vehicles passing slowly on the road.</p><p>Nothing extraordinary.<br>But after weeks of constant movement, that quiet dinner felt peaceful.</p><p>And one thought stayed in my mind:<br>Not everything fades.<br>Some memories stay with us forever.</p>', quote: '"Some roads don’t just show directions. They show possibilities."' },
            { type: 'chapter', id: 'ch52', title: 'Coming Home', chapter: 'Ch  52', stats: 'Mysuru', image: 'videos/chapter-52.mp4', desc: '<p>The next morning was Republic Day.<br>It was also the final day of my journey.</p><p>After more than 50 days on the road, thousands of kilometers, countless sunrises, breakdowns, strangers who became friends, and roads that slowly became home — this ride was finally coming back to where it had started.</p><p>I woke up early and started around 6:30 AM.</p><p>Before leaving, I filled fuel for my bike and looked at the road ahead.<br>This time the feeling was different.</p><p>There was no rush.<br>No pressure.<br>Just a quiet realization that the journey was reaching its final page.</p><h4 class="font-bold text-xl mt-6 mb-2">Riding With a Different Mind</h4><p>As I started riding, something felt unusual.<br>The road looked the same.<br>The wind felt the same.<br>But I was not the same person anymore.</p><p>Instead of feeling tired after so many days on the road, I felt something else — lightness.</p><p>Every kilometer felt beautiful.<br>There was no feeling of over-riding, no pressure to rush.<br>I was simply enjoying the road.</p><h4 class="font-bold text-xl mt-6 mb-2">Small Stops Along the Way</h4><p>After riding for some time, I stopped along the highway.<br>The place had a small restaurant nearby. I wasn’t very hungry, so I just had fresh fruit juice and sat there for some time.</p><p>Sometimes, the best part of a journey is not moving.<br>It is sitting somewhere quietly and watching the road.</p><p>After resting for a while, I started riding again.<br>Later in the afternoon, I stopped for lunch, had a simple meal, and continued the ride toward Mysuru.</p><p>And slowly, the distance kept reducing.</p><h4 class="font-bold text-xl mt-6 mb-2">The Moment I Reached Home</h4><p>By evening, around 6:30 PM, I finally entered Mysuru.<br>After 50 days on the road, I had come back home.</p><p>That moment is something very difficult to describe.<br>There was excitement.<br>There was relief.<br>There was gratitude.<br>But above all, there was a deep feeling of peace.</p><h4 class="font-bold text-xl mt-6 mb-2">A Welcome I Never Expected</h4><p>When I reached, something beautiful happened.<br>My friends and family were waiting for me.<br>There were smiles, laughter, fireworks, and even a cake.</p><p>I never expected such a warm welcome.<br>After traveling alone for so many days, coming back to this love felt overwhelming.</p><p>At that moment I realized something very important.<br>The journey may have taken me across mountains, borders, forests, and highways…<br>But the real destination was always home.</p><h4 class="font-bold text-xl mt-6 mb-2">What This Journey Taught Me</h4><p>This journey gave me more than memories.<br>It gave me clarity.</p><p>Somewhere along these thousands of kilometers, I learned things that no classroom or book could teach.</p><p>I learned that fear is mostly in our mind.<br>Before starting, many people asked me if it was dangerous, difficult, or impossible.<br>But once I started riding, I realized something simple:<br>Most fears disappear when we take the first step.</p><h4 class="font-bold text-xl mt-6 mb-2">Strength I Never Knew I Had</h4><p>There were days when the roads were broken.<br>There were nights when the cold was unbearable.<br>There were moments when my bike broke down in remote places.<br>There were times when I had no idea what would happen next.</p><p>But every single time, somehow, things worked out.<br>Strangers helped.<br>The road guided me.<br>And slowly I discovered a strength inside me that I didn’t know existed.</p><h4 class="font-bold text-xl mt-6 mb-2">A Different Version of Myself</h4><p>When I started this journey, I thought I was traveling across India.<br>But now I understand something deeper.<br>I was actually traveling inside myself.</p><p>The person who left Mysuru on Day 1 and the person who returned on Day 52 were not the same.<br>The road had changed me.</p><p>It made me calmer.<br>It made me stronger.<br>And somewhere along the way, it made life feel simpler.</p><h4 class="font-bold text-xl mt-6 mb-2">The Journey Never Really Ends</h4><p>Even though the ride ended in Mysuru, the journey itself does not end.<br>Because the roads, the people, the stories, and the lessons will stay with me forever.</p><p>And somewhere deep inside, I know one thing for sure.<br>One day…<br>I will pack my bags again,<br>start my bike,<br>and follow the road into another unknown journey.</p><p>Because once the road becomes part of your soul,<br>it never really lets you stop. 🏍️✨</p>', quote: '“50 days. Thousands of kilometres. One truth — the road didn’t just take me places, it changed me.”' },
            { type: 'chapter', id: 'epilogue', title: 'The Road Never Really Ends', chapter: 'Epilogue', stats: 'Final Thoughts', image: 'images/epilogue.jpg', desc: '<p>After thousands of kilometers, broken roads, freezing nights, silent mornings, and countless strangers who became part of the journey…<br>I finally came back home.</p><p>But something inside me had changed.</p><p>When I started this ride, I thought I was traveling across India.<br>But somewhere along the road, I realized something important.<br>I was actually traveling inside myself.</p><p>Every long highway taught patience.<br>Every breakdown taught resilience.<br>Every stranger who helped me reminded me that kindness still exists everywhere.<br>And every sunrise on the road reminded me how small our worries really are.</p><p>This journey showed me that fear usually lives only in our mind.<br>Once we take the first step, the road begins to guide us.</p><p>Somewhere between mountains, forests, tea stalls, temples, army camps, and empty highways…<br>I found something I wasn’t even looking for.<br>Clarity.</p><p>Clarity about life.<br>Clarity about fear.<br>Clarity about what truly matters.</p><p>When I returned to Mysuru, people asked me,<br>“Was the journey difficult?”</p><p>The truth is — yes.<br>But it was also the most beautiful experience of my life.</p><p>Because in the end, this journey was never about the distance.<br>It was about the stories, the people, and the version of myself that I discovered along the way.</p><p>And even though the ride ended…<br>I know something for sure.</p><p>One day, I will start my bike again.<br>And follow another unknown road.</p><p>Because once the road becomes part of your soul,<br>the journey never truly ends.<br>🏍️✨</p>', quote: '👉 “Long after the journey ended… the road continued within me.”' },
            { type: 'appendix-lessons', title: 'Appendix I: Wisdom from the Asphalt' }
        ];

        const lessonsData = [
            { category: 'Endurance', title: 'The Shift to Partnership', text: '<p>During the early days, the motorcycle was just a machine. But somewhere across Madhya Pradesh, and definitely by the time we hit the grueling 600km stretches in the Northeast, the ride became a partnership.</p><p>On Christmas Eve in Meghalaya, changing the engine oil at midnight in the freezing cold with grease-stained hands didn\'t feel like a chore. Washing the dust off the bike in the dead of night was an act of profound gratitude toward a companion that never once gave up.</p>' },
            { category: 'Connection', title: 'The Grandmother in the Fog', text: '<p>Leaving Siliguri at 5:45 AM, the road disappeared into dense, suffocating fog. Pulling over at a tiny, half-covered tea stall felt like finding a sanctuary.</p><p>The elderly woman running it took one look, understood, and handed over hot coffee and biscuits. When it was time to pay, she refused entirely, placing chocolates in hand and saying, <em>"You are like my son. Don\'t pay."</em> Kindness travels faster than distance.</p>' },
            { category: 'Stillness', title: 'The Pause in Hubli', text: '<p>Movement can often act as a distraction from the mind. When the physical journey stopped for two days in Hubli, internal thoughts accelerated.</p><p>But those two days of stillness were necessary. Realizing the fear was of commitment, not distance, led to a simple, ego-free promise: <em>If I feel uncomfortable, I will return. If I feel steady, I will continue.</em> That was the true beginning of the journey.</p>' },
            { category: 'Endurance', title: 'Panic vs. Pause', text: '<p>Returning from Dawki in Meghalaya, the evening darkness dropped rapidly. Suddenly, the motorcycle\'s headlight died entirely on a narrow, dusty hill road where fog could roll in at any second.</p><p>Yet, the instinct wasn\'t to panic. Instead of anxiety, there was a calm adaptation—tailing cars to use their beams and riding slowly. Obstacles stopped feeling like interruptions and became the experience itself. <em>Sometimes, you just need a pause. But you never stop.</em></p>' },
            { category: 'Connection', title: 'Strangers as Guides', text: '<p>In a Silchar dormitory, a casual conversation about the next day\'s route altered the entire trajectory of the trip. A fellow traveler warned of 14-hour travel times and isolated stretches on the road to Imphal.</p><p>Listening to local voices over a digital map prevented a potentially disastrous situation. Destiny quietly places the right people in your path; you just have to be willing to listen.</p>' },
            { category: 'Stillness', title: 'The Freezing Valley', text: '<p>The Dzukou Valley trek was a test of both physical endurance and mental stillness. Arriving at the base camp alone, the temperature plummeted to -4°C. Rats managed to eat every single snack packed for the trip.</p><p>Sleep was impossible due to the brutal cold, yet there was no regret. Walking through the silent, ancient forest brought an overwhelming feeling of mental lightness. Some nights aren\'t meant for comfort; they are meant to be lived fully so they can become stories.</p>' }
        ];

        let currentPage = 0;
        let chartInstance = null;
        let isTurning = false;
        let isMusicPlaying = false;

        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            const icon = document.getElementById('music-icon');
            if (isMusicPlaying) {
                audio.pause();
                icon.textContent = 'PLAY';
            } else {
                audio.play();
                icon.textContent = 'PAUSE';
            }
            isMusicPlaying = !isMusicPlaying;
        }

        function renderPage(direction = 'right') {
            if (isTurning) return;
            isTurning = true;

            const contentArea = document.getElementById('page-content');

            if (contentArea.innerHTML.trim() !== "") {
                contentArea.classList.add(direction === 'right' ? 'turn-out-next' : 'turn-out-prev');
            } else {
                updateHTML();
                return;
            }

            setTimeout(() => {
                updateHTML();
            }, 300);

            function updateHTML() {
                const pageData = bookData[currentPage];

                if (pageData.type === 'cover') {
                    document.getElementById('bookmark').classList.add('hidden');
                    document.getElementById('page-number-display').classList.add('hidden');
                    contentArea.innerHTML = `
                        <div class="h-full w-full flex flex-col items-center justify-center bg-book-ink text-book-paper p-8 sm:p-12 text-center min-h-[85vh]">
                            <div class="text-5xl mb-8">🏍️</div>
                            <h1 class="text-4xl sm:text-6xl font-serif font-bold mb-6 tracking-tight leading-tight">${pageData.title}</h1>
                            <p class="text-xl sm:text-2xl font-light text-gray-400 mb-12 tracking-widest uppercase">${pageData.subtitle}</p>
                            <div class="w-16 h-1 bg-book-accent mb-12"></div>
                            <p class="text-lg font-serif italic text-gray-300 mb-16">${pageData.author}</p>
                            <p class="mt-8 text-sm uppercase tracking-widest text-book-accent animate-pulse font-sans">Click the right edge or press Right Arrow to open</p>
                        </div>
                    `;
                } else if (pageData.type === 'chapter') {
                    document.getElementById('bookmark').classList.remove('hidden');
                    document.getElementById('page-number-display').classList.remove('hidden');

                    let pageLabel = pageData.chapter.includes('Ch ') || pageData.chapter.includes('Chapter') ? ` — Page ${currentPage}` : '';
                    document.getElementById('page-number-display').textContent = `${pageData.chapter}${pageLabel}`;

                    // === VIDEO VS IMAGE LOGIC ===
                    const isVideo = pageData.image && pageData.image.toLowerCase().endsWith('.mp4');
                    const mediaHTML = isVideo
                        ? `<video src="${pageData.image}" class="w-full h-full object-cover" autoplay loop muted playsinline></video>`
                        : `<img src="${pageData.image}" class="w-full h-full object-cover" alt="Thematic image">`;

                    contentArea.innerHTML = `
                        <div class="w-full h-64 sm:h-80 relative flex-shrink-0 bg-gray-200">
                            ${mediaHTML}
                            <div class="absolute inset-0 bg-gradient-to-t from-book-paper to-transparent"></div>
                        </div>
                        <div class="px-8 sm:px-16 py-8 flex-grow">
                            <h2 class="text-4xl sm:text-5xl font-bold font-serif mb-2 leading-tight">${pageData.title}</h2>
                            <div class="text-sm font-sans font-bold text-book-accent tracking-widest uppercase mb-10 border-b border-gray-300 pb-4 inline-block">${pageData.stats}</div>
                            
                            <div class="chapter-content text-lg sm:text-xl text-gray-800 leading-relaxed max-w-3xl mb-12">
                                ${pageData.desc}
                            </div>
                            
                            <div class="border-t border-b border-gray-300 py-8 my-12 text-center max-w-2xl mx-auto">
                                <p class="text-2xl font-serif italic text-gray-600">
                                    ${pageData.quote}
                                </p>
                            </div>
                        </div>
                    `;
                } else if (pageData.type === 'appendix-lessons') {
                    document.getElementById('bookmark').classList.remove('hidden');
                    document.getElementById('page-number-display').classList.remove('hidden');
                    document.getElementById('page-number-display').textContent = `Appendix I`;

                    let gridHTML = lessonsData.map(lesson => `
                        <div class="mb-8 pb-8 border-b border-gray-200 break-inside-avoid">
                            <div class="text-xs font-sans font-bold text-book-accent uppercase tracking-widest mb-1">${lesson.category}</div>
                            <h4 class="text-2xl font-serif font-bold mb-3">${lesson.title}</h4>
                            <div class="text-gray-700 text-lg leading-relaxed font-serif chapter-content">${lesson.text}</div>
                        </div>
                    `).join('');

                    contentArea.innerHTML = `
                        <div class="px-8 sm:px-16 py-12 flex-grow min-h-[85vh]">
                            <h2 class="text-4xl font-bold font-serif mb-6">${pageData.title}</h2>
                            <p class="text-lg font-serif mb-12 text-gray-700">Core lessons distilled from the road, categorized by theme.</p>
                            <div class="columns-1 md:columns-2 gap-12">
                                ${gridHTML}
                            </div>
                            
                            <div class="mt-16 text-center pb-12">
                                <div class="text-4xl mb-4 text-gray-400">❧</div>
                                <p class="font-serif italic text-gray-500 text-xl">The End.</p>
                            </div>
                        </div>
                    `;
                }

                document.getElementById('prev-zone').style.display = currentPage > 0 ? 'block' : 'none';
                document.getElementById('next-zone').style.display = currentPage < bookData.length - 1 ? 'block' : 'none';

                contentArea.scrollTop = 0;

                contentArea.classList.remove('turn-out-next', 'turn-out-prev');
                contentArea.classList.add(direction === 'right' ? 'turn-in-next' : 'turn-in-prev');

                setTimeout(() => {
                    contentArea.classList.remove('turn-in-next', 'turn-in-prev');
                    isTurning = false;
                }, 400);
            }
        }

        function nextPage() {
            if (currentPage < bookData.length - 1 && !isTurning) {
                currentPage++;
                renderPage('right');
            }
        }

        function prevPage() {
            if (currentPage > 0 && !isTurning) {
                currentPage--;
                renderPage('left');
            }
        }

        function jumpToPage(index) {
            if (isTurning || index === currentPage) return;
            const direction = index > currentPage ? 'right' : 'left';
            currentPage = index;
            renderPage(direction);
            closeTOC();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                prevPage();
            }
        });

        function openTOC() {
            const tocList = document.getElementById('toc-list');
            tocList.innerHTML = bookData.map((page, idx) => {
                if (page.type === 'cover') return '';
                const title = page.type === 'chapter' ? `<span class="font-bold w-24 inline-block text-gray-500">${page.chapter}</span> ${page.title}` : page.title;
                return `
                    <button onclick="jumpToPage(${idx})" class="w-full text-left py-3 px-4 hover:bg-gray-100 border-b border-gray-100 transition-colors flex justify-between items-center text-lg">
                        <span>${title}</span>
                    </button>
                `;
            }).join('');
            document.getElementById('toc-modal').classList.remove('hidden');
        }

        function closeTOC() {
            document.getElementById('toc-modal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPage();
        });

    </script>
