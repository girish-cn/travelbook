            { type: 'chapter', id: 'ch20', title: 'Where the Road Taught Me to Stay Calm', chapter: 'Ch  20', stats: 'Adaptation', image: 'images/chapter-20.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Morning of Responsibility</h4><p>South Meghalaya</p><p>It was Christmas morning.<br>I woke up around 6:30 AM.</p><p>Before leaving,<br>I wished my friend and his family.</p><p>There was festive warmth in the house —<br>simple,<br>grounded,<br>genuine.</p><p>But before heading toward South Meghalaya,<br>I had unfinished responsibility.</p><p>The drain bolt from last night’s oil change<br>had not been fully tightened.</p><p>I could not take a risk.</p><h4 class="font-bold text-xl mt-6 mb-2">Fixing What Matters</h4><p>Early morning,<br>on Christmas Day,<br>I searched for a garage.</p><p>Most places were closed.</p><p>Finally,<br>at a Tata Motors service station,<br>a kind mechanic helped me.</p><p>He understood the issue immediately,<br>found the correct ring,<br>and tightened it properly.</p><p>That moment brought relief.</p><p>Now I could ride with confidence.</p><p>I started toward South Meghalaya.</p><h4 class="font-bold text-xl mt-6 mb-2">Into the Hills</h4><p>First,<br>I stopped briefly near Umiam Lake —<br>the water calm,<br>reflecting the morning sky.</p><img src="images/chapter-20_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Then I continued deeper into the hills.</p><h4 class="font-bold text-xl mt-6 mb-2">The Sacred Forest</h4><p>One of the places I had planned to visit<br>was the Sacred Forest — Mawphlang Sacred Grove.</p><p>As I entered,<br>the atmosphere changed.</p><p>The forest felt untouched.<br>Old.<br>Almost guarded.</p><p>A local guide joined me.</p><p>And the surprising part —<br>he spoke Kannada.</p><img src="images/chapter-20_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>He had studied and lived in Bengaluru for some time.</p><p>Hearing Kannada in the middle of Meghalaya<br>felt unexpected and comforting.</p><p>He shared the history of the sacred grove —<br>how local Khasi communities protect the forest spiritually.</p><p>Nothing inside the forest can be taken out.<br>Not even a leaf.</p><p>It is believed that disturbing it brings misfortune.</p><p>The trees were massive.<br>Roots intertwined.<br>The ground soft with centuries of decay.</p><p>The forest didn’t feel like nature alone.</p><p>It felt sacred… in intention.</p><p>Listening to the guide speak about rituals,<br>tribal history,<br>and conservation,<br>made me respect the land even more.</p><p>That place wasn’t a tourist spot.</p><p>It was a living belief system.</p><h4 class="font-bold text-xl mt-6 mb-2">Toward Dawki</h4><p>From there,<br>I started toward Dawki —<br>home to the Umngot River,<br>near the Bangladesh border.</p><img src="images/chapter-20_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The road initially was fine.</p><p>Then suddenly —<br>it wasn’t.</p><p>For several kilometres,<br>it was extremely bad.</p><p>Broken patches.<br>Mud.<br>Uneven surfaces.</p><p>I had to ride carefully.</p><p>My bike handled it well,<br>but I could feel the strain.</p><p>Every time the road worsened,<br>I slowed down…<br>and mentally thanked him<br>for holding steady.</p><h4 class="font-bold text-xl mt-6 mb-2">The Cleanest Village</h4><p>After about 10 kilometres of rough stretch,<br>the road improved.</p><p>And then I saw it —<br>Mawlynnong.</p><img src="images/chapter-20_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"> <img src="images/chapter-20_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"> <p>The cleanest village in Asia.</p><p>The village felt different.</p><p>Neat pathways.<br>Bamboo dustbins.<br>Well-maintained houses.<br>Flowers everywhere.</p><p>Cleanliness here wasn’t forced.</p><p>It was cultural.</p><p>I spent time walking around.</p><p>Spoke to a few local men.</p><p>Their pride was visible.</p><p>It wasn’t about tourism alone —<br>it was about identity.</p><p>From a nearby viewpoint,<br>I could see the Bangladesh border<br>stretching far into the plains.</p><p>Standing there,<br>I realised how far I had come<br>from Mysuru.</p><h4 class="font-bold text-xl mt-6 mb-2">Dawki</h4><p>Later,<br>I reached Dawki.</p><p>But the river wasn’t at its best.</p><p>Due to construction upstream,<br>the water looked muddy.</p><p>It wasn’t the crystal clarity<br>I had imagined.</p><p>Still,<br>the setting was beautiful.</p><p>Mountains hugging the river.<br>Boats moving slowly.<br>Border presence in the distance.</p><p>Around 4 PM,<br>I decided to head back toward Shillong.</p><h4 class="font-bold text-xl mt-6 mb-2">Dust and Darkness</h4><p>Then suddenly —<br>my headlight stopped working.</p><p>I was shocked.</p><p>I pulled over immediately.<br>Turned off the ignition.<br>Checked the wiring.</p><p>But it was dark.</p><p>Dust everywhere.<br>Hands already dirty.</p><p>I couldn’t properly figure it out.</p><p>For a few seconds,<br>there was silence inside me.</p><p>This wasn’t a small problem.</p><p>Evening in Meghalaya.<br>Narrow roads.<br>Fog could return anytime.</p><h4 class="font-bold text-xl mt-6 mb-2">Choosing Calm</h4><p>But something inside me<br>didn’t panic.</p><p>A few days earlier,<br>I would have.</p><p>But not now.</p><p>I told myself calmly —<br>You will reach Shillong.</p><p>Even if the light fails completely,<br>I have options.</p><p>Call my friend.<br>Stop somewhere safe.<br>Wait.</p><p>This journey had taught me something powerful:</p><p>Not every problem needs panic.</p><p>Sometimes,<br>it needs pause.</p><h4 class="font-bold text-xl mt-6 mb-2">Moving Forward</h4><p>So instead of worrying,<br>I adapted.</p><p>I followed cars<br>to use their headlights.</p><p>Reduced speed.<br>Stayed alert.</p><p>Every kilometre felt earned.</p><p>Dust covered my jacket.<br>Gloves were dirty.<br>Visor layered with mud.</p><p>But inside,<br>I was steady.</p><p>Somewhere in that darkness,<br>I realised:</p><p>This journey has changed me.</p><p>Earlier,<br>obstacles felt like interruptions.</p><p>Now,<br>they feel like experiences.</p><p>I don’t have to stop.</p><p>Maybe I pause.<br>But I never stop.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Transformation</h4><p>When I finally reached my friend’s home<br>and parked the bike safely,</p><p>I felt deep gratitude.</p><p>For the machine<br>that endured the terrain.</p><p>For the lessons hidden in inconvenience.</p><p>For the growth<br>I couldn’t see happening,<br>but could feel now.</p><p>That night,<br>sitting at the Christmas dinner table,</p><img src="images/chapter-20_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I wasn’t just tired.</p><p>I was transformed.</p><p>Not dramatically.</p><p>But quietly.</p><p>And quietly…<br>is how real change happens.</p>', quote: '"I don’t have to stop. Maybe I pause. But I never stop."' },
            { type: 'chapter', id: 'ch21', title: 'In the Dark, I Found People', chapter: 'Ch  21', stats: 'Silchar', image: 'images/chapter-21.jpg', desc: '<p>I woke up around 5 AM.<br>The first thing I did was check my bike.</p><p>The headlight that had stopped working the previous evening needed fixing.<br>With limited tools and whatever I had available, I managed to secure the wiring and taped it carefully.</p><p>It wasn’t a perfect repair.<br>But it would work.</p><p>That moment felt satisfying — small mechanical victories on the road build confidence.</p><p>After fixing the light, I took a bath and packed everything slowly.<br>Outside, Shillong was still quiet.</p><p>My friend wasn’t ready to let me leave immediately.<br>Before my departure, he took me to a few beautiful places around Shillong one last time.</p><p>The hills were calm.<br>The air cool.<br>The views felt like a gentle farewell from Meghalaya.</p><p>Around noon, he took me to a small local restaurant for authentic Meghalaya food.</p><p>It was simple.<br>Local.<br>Warm.</p><p>Food always tastes different when shared with people who genuinely care.</p><p>By the time we returned home, it was already around 1:30 PM.</p><p>Then came the difficult part.<br>Saying goodbye.</p><p>His family gathered near the entrance.<br>His father spoke kindly, wishing me a safe journey ahead.<br>His sister smiled warmly.</p><p>And my friend…<br>After 7–8 years, we had met again, spent meaningful days together, and now the road was calling me away.</p><p>We hugged.<br>It was emotional.<br>Not dramatic.<br>But real.</p><p>I started the bike and slowly rolled out of the lane.<br>Shillong disappeared behind me.</p><p>My plan for the day was to reach Silchar in Assam.<br>I assumed the road would be manageable.</p><p>But reality unfolded differently.</p><p>After about 100 kilometres, the road began filling with trucks.<br>Endless trucks.<br>Heavy vehicles crawling slowly through narrow stretches of road.</p><p>The landscape was beautiful.<br>But the traffic was intimidating.</p><p>Somewhere along the way, I passed areas close to the Bangladesh border.<br>The geography felt different.<br>The air felt heavier.</p><p>By around 5 PM, darkness had already taken over the hills.</p><p>I realised something uncomfortable.<br>Maybe I had made the wrong decision by leaving Shillong late.</p><p>Around 6 PM, everything stopped.</p><p>Not slowed.<br>Stopped.</p><p>A long line of trucks stretched endlessly.<br>Dust filled the air.<br>The road itself had almost disappeared in places.</p><p>I asked a few truck drivers.<br>One of them said quietly,<br>“Brother, this may take days.”</p><p>For a moment, I stood there.<br>Looking at that endless line disappearing into darkness.</p><p>Strangely, I didn’t panic.</p><p>This… was real adventure.<br>Not the kind you imagine.<br>The kind you experience.</p><p>So I adapted.</p><p>Slowly, carefully, I began navigating through small gaps between trucks.</p><p>Sometimes the path was barely wide enough.<br>Sometimes there was no proper road at all.</p><p>Dust everywhere.<br>Darkness all around.</p><p>But my bike moved steadily.</p><p>Every metre felt earned.</p><p>Eventually, I managed to cross that stretch.</p><p>But now another problem appeared.<br>No stays.<br>No proper towns.<br>And complete darkness.</p><p>It was around 7:30 PM.</p><p>I called my friend in Shillong.<br>He suggested continuing to Silchar — another 45 kilometres.</p><p>I continued.</p><p>And that stretch… was something else.</p><p>For almost 100+ kilometres, the road felt isolated.<br>Empty.<br>Dark.</p><p>No proper lights.<br>No crowd.<br>No noise.</p><p>Just road.</p><p>And occasionally… people.</p><p>And that’s what stayed with me.</p><p>Every time I slowed down or passed someone, they noticed me.</p><p>A lone rider.<br>Covered in dust.<br>Riding through darkness.</p><p>Some waved.<br>Some nodded.<br>Some asked if everything was okay.</p><p>Few even stopped me just to check.</p><p>“Where are you going?”<br>“Be careful.”<br>“Road ahead is rough.”</p><p>They didn’t know me.<br>But they cared.</p><p>On that lonely road, I wasn’t completely alone.</p><p>That human connection… in the middle of isolation… meant a lot.</p><p>Finally, the road improved.<br>Lights appeared.</p><p>I entered Silchar.</p><p>Compared to what I had just crossed, it felt like relief.</p><p>I found a budget stay.<br>Checked in.</p><p>Relief.</p><p>Later, I met another traveller.<br>Within an hour, we became friends.</p><p>We went out for dinner.<br>Simple food.<br>Easy conversation.</p><p>And after a long, unpredictable day, that normal moment felt comforting.</p><p>Back in the room, as I lay down, I realised:</p><p>The day had started with warmth.<br>And ended with dust, darkness, and resilience.</p><p>But that is the nature of long journeys.</p><p>You leave comfort.<br>And the road reminds you — nothing is guaranteed.</p><p>Except the experience.</p>', quote: '"Not every difficult moment is a problem. Sometimes it is the story."' },
            { type: 'chapter', id: 'ch22', title: 'When the Road Changed My Plan', chapter: 'Ch  22', stats: 'Tripura', image: 'videos/chapter-22.mp4', desc: '<p>I woke up early again, around 5 AM.<br>Silchar was still quiet when I packed my luggage, took a quick bath, and prepared for the day’s ride. My bike stood outside, ready as always.</p><p>Before leaving, I realised something important — I was completely out of cash.</p><p>So after riding about 30–35 kilometres, I stopped near an ATM and withdrew some money. Long-distance travel teaches you to manage small practical things carefully — fuel, cash, food, rest.</p><p>Around 8:30 or 9 AM, I stopped again because I was hungry. I found a small local place and had breakfast.</p><p>While eating, I began talking with a few local people there. One of them asked about my ride and suggested something unexpected.</p><p>“Why don’t you go to Jampui Hills?” he said.</p><p>My original plan for the day was simple: enter Tripura and reach Agartala.<br>But travel rarely follows fixed plans.</p><p>The more they spoke about Jampui Hills — the views, the landscape, the peaceful villages — the more curious I became.</p><p>I decided to at least ride toward that side and see what happened.</p><h4 class="font-bold text-xl mt-6 mb-2">Entering Tripura</h4><p>By around 11:30 AM, I reached the region near Kanchanpur, which is one of the main gateways toward Jampui Hills.</p><p>There I met a few local people who were asking about my ride and my bike. One of them had worked in Bengaluru earlier.<br>When he heard I was from Karnataka, he immediately started speaking in Kannada.</p><p>In the middle of Tripura, hearing Kannada felt surprising and comforting at the same time.</p><p>He encouraged me to go to Jampui Hills, which was around 35 kilometres away.</p><p>I hesitated for a moment.<br>It was already around 12:30 PM.<br>If I went up to the hills. Finding stay could become difficult.</p><p>But another thought crossed my mind.<br>If I don’t go now, I might regret it later.</p><p>So I decided to go.<br>That decision made the day unforgettable.</p><h4 class="font-bold text-xl mt-6 mb-2">The Climb to Jampui Hills</h4><p>The road toward Jampui Hills slowly climbed upward through beautiful green valleys. I stopped occasionally to admire the landscape.</p><p>At one point, I stopped at a small roadside place where a few girls were sitting nearby. We had a small conversation — simple, friendly exchanges that often happen during solo travel.</p><p>Further ahead, I reached a checkpost where the police stopped me for verification. They checked my documents and asked about my journey.</p><p>When they realised how far I had come riding alone, their reaction surprised me.<br>One officer said with excitement,<br>“Oh my God, you came all the way from there on this bike?”</p><p>He seemed genuinely impressed.<br>Instead of being strict or suspicious, he encouraged me. He even asked about my social media and told me I should share my journey so others could see it.</p><p>That moment felt good.<br>Encouragement from strangers on the road always adds energy to the journey.</p><h4 class="font-bold text-xl mt-6 mb-2">Flying Over Tripura</h4><p>Around 2 PM, I reached Jampui Hills.<br>And something unexpected happened again.</p><p>There was paragliding there.</p><p>Without thinking too much, I decided to try it.<br>The flight became one of the most adventurous moments of the entire trip.</p><p>Normally the ride lasts around 20 minutes, but that day I was in the air for nearly 30–45 minutes.</p><p>Floating above the valleys of Tripura, watching endless green hills stretch beneath me, felt unreal. The entire landscape looked like a green ocean of hills. From up there, the villages, roads, and forests all looked tiny.</p><p>For a moment, the long ride, the dust, the fatigue — everything disappeared.<br>It was pure freedom.</p><p>There was one small challenge though.<br>The minimum combined weight required for safe landing was about 120 kg, but the instructor and I together were around 110 kg. Because of that, the landing wasn’t perfectly smooth.</p><p>Still, the experience was incredible.</p><p>When we landed, something very heartwarming happened.<br>A small crowd had gathered there.<br>Some people clapped.<br>Some came forward and started asking questions about my ride. They were curious about where I had come from and how far I had travelled alone on the bike.</p><p>When they heard about my journey, many of them smiled and wished me well.<br>A few of them said something that stayed with me:<br>“We are happy you came to explore Tripura. Many people don’t know how beautiful our state is.”</p><p>I spent some time talking with them. We exchanged stories, laughed, and spoke about travel and life.<br>Those conversations were simple but genuine.</p><p>In that moment, I wasn’t just a traveller passing through.<br>I felt welcomed.</p><p>Tripura, which had started as an unplanned detour, was slowly becoming one of the most memorable parts of my journey.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unplanned Stay</h4><p>After paragliding, I spent some time in the Jampui Hills area talking with local people. Everyone was friendly and welcoming.</p><p>Later I rode toward the nearby villages — one of them known as one of the cleanest villages in Tripura.<br>But it was Saturday evening.<br>Weekend.<br>Almost every stay was full.</p><p>I started worrying slightly.<br>But again, the road solved the problem in its own way.</p><p>I met a local man who understood my situation and offered a simple place to sleep.<br>It wasn’t a formal hotel.<br>Just a small place with a bed.<br>But for that night, it was enough.</p><p>This journey was never about luxury.<br>It was about experience.</p><p>Later in the evening, another kind person helped arrange food for me. We shared dinner together and spoke for some time.<br>It was simple food.<br>But after such a long, adventurous day, it tasted perfect.</p><p>That night, lying down in that modest room, I thought about the entire day.<br>A random breakfast conversation had changed my plan.<br>That change had given me:<br>A new destination.<br>New people.<br>An unforgettable paragliding experience.<br>And another lesson from the road.</p><p>Sometimes the best parts of a journey are not planned.<br>They happen when you listen to the road.</p><p>And outside, my bike rested quietly after climbing the hills of Tripura.<br>Once again, I felt grateful.</p><p>That machine had carried me through plains, fog, dust, and mountains.<br>Somewhere along this journey, it had stopped feeling like a vehicle.<br>It had become my partner.</p><p>And every kilometre was making me fall in love with the road — and with that bike — all over again.</p>', quote: '"Sometimes the best parts of a journey are not planned. They happen when you listen to the road."' },
            { type: 'chapter', id: 'ch23', title: 'The Shortcut Through the Unknown', chapter: 'Ch  23', stats: 'Aizawl', image: 'images/chapter-23.jpg', desc: '<p>I woke up very early that morning, around 4:30 AM.<br>The hills were still silent.<br>The air was cold and calm.</p><p>I packed my bike carefully, tightened the luggage straps, and prepared for the day ahead.</p><p>Before leaving Jampui Hills, I wanted to witness one more sunrise.<br>So I rode up toward the viewpoint and waited.</p><p>Around 5:15 AM, the sky slowly began to glow.<br>The sun appeared gently over the hills, lighting the valleys of Tripura with golden light.</p><p>Only a few people were there.<br>That made the moment even more special.</p><p>I stood quietly.<br>Absorbing the calmness.</p><p>After coming down around 5:30 AM, I met the person who had helped arrange my stay.<br>We thanked each other, exchanged numbers, and spoke briefly.</p><p>Then it was time to leave.<br>My next destination was Mizoram — Aizawl.</p><p>When I checked the route, there were two options:<br>A longer but safer road — around 400+ km<br>A shorter route — about 200 km, through remote mountains.</p><p>The longer road meant comfort.<br>The shorter road meant adventure.</p><p>I paused for a moment.<br>Then I chose the shortcut.</p><p>After riding a few kilometres, I reached a checkpost.<br>Documents were verified.<br>I was allowed to proceed.</p><p>For the first few kilometres, Google Maps guided me.<br>But after around 5 kilometres… it stopped.</p><p>No signal.<br>No route.<br>No guidance.</p><p>At that moment, I realised something clearly:<br>From here… it was just me and the road.</p><p>The road slowly disappeared.</p><p>What looked like a road on the map turned into a mountain trail.<br>Mud.<br>Broken paths.<br>Narrow tracks.</p><p>I kept moving forward.<br>Following instinct.</p><p>After some distance, I reached a small tribal village.<br>A man approached me and asked questions a bit harshly.<br>For a moment, I felt uncomfortable.</p><p>But I stayed calm.<br>Answered briefly.<br>And moved ahead.</p><p>Further ahead, I saw something even more challenging.</p><p>A rusted iron bridge.<br>Broken.<br>Holes in the metal.<br>A river flowing below.</p><p>I stopped.<br>Took a deep breath.<br>And crossed it slowly — inch by inch.</p><p>The path became harder.<br>Mountains on both sides.<br>No proper road.<br>No signboards.</p><p>Completely isolated.</p><p>By around 7:30–8 AM, I had already ridden nearly 50 kilometres.</p><p>I stopped and thought:<br>Should I go back?</p><p>Or continue?</p><p>Just then, I saw another rider ahead.<br>Relief.</p><p>I followed him for some distance.</p><p>At one point, he stopped.<br>I thought he needed rest.</p><p>But he was drinking local alcohol and insisted I join.</p><p>I politely refused.<br>But he kept insisting.</p><p>For a moment, it felt uncomfortable.</p><p>I decided not to stay there longer.<br>I moved ahead quickly.</p><p>For a few kilometres, he followed me.</p><p>That made me slightly alert.</p><p>But then something changed.</p><p>The road became tougher.<br>Steeper.<br>More broken.</p><p>And that’s where my bike showed its strength.</p><p>Like an off-road king, he handled everything.<br>Climbs.<br>Loose mud.<br>Rocks.</p><p>He moved faster than expected.<br>Stable.<br>Confident.</p><p>Slowly, I gained distance.</p><p>I trusted him completely.<br>And in that moment… I felt proud of him.<br>And deeply connected.</p><p>At another point, I reached a junction with no signs.<br>No map.<br>No people.</p><p>I paused for a second.<br>Then followed instinct again.</p><p>That decision was right.</p><p>After nearly 80–90 kilometres of this terrain, I finally reached a proper road.</p><p>It felt like victory.</p><p>But the ride wasn’t over yet.</p><p>The road still had mud patches and broken sections.</p><p>Around 10:30 AM, I stopped for a break.<br>Had oranges my friend had given me.<br>And biscuits.</p><p>Simple food.<br>But it felt like energy.</p><p>After continuing further, I entered Mizoram.</p><p>The landscape changed instantly.<br>Clean roads.<br>Green hills.<br>Peaceful surroundings.</p><p>The last stretch before Aizawl was smooth.<br>Almost luxurious compared to what I had just crossed.</p><p>I slowed down often.<br>Enjoying the views.</p><p>Around 12:30 PM, I reached Aizawl.</p><p>The city was quiet and Felt Different.<br>It was Sunday, and because of Christmas holidays, almost everything was closed.</p><p>The stay I had booked was on an upper floor, and the hotel staff were not very helpful. I had tocarry my luggage upstairs myself.</p><p>Parking was another difficult.</p><p>The owner told me to park the bike on the roadside.<br> But I wasn’t comfortable leaving it there in a completely new city.<br>Finally I found a nearby parking space and paid extra to keep the bike safe.</p><p>For the next three days, that parking spot would become my bike’s resting place.</p><p>Inside, I met a traveller from Africa.<br>We started talking and became comfortable quickly.</p><p>Since restaurants were closed, I ordered pizza.<br>A simple meal shared.</p><p>We ate together and then decided to explore the city.<br>Later, we went to a viewpoint.</p><p>The sunset over Aizawl was breathtaking.<br>Houses glowing across hills like stars.</p><p>For a moment, the exhaustion disappeared.</p><p>We walked around, talked, and returned by around 9:30 PM.</p><p>I washed my dust-covered clothes.<br>Hung them outside.</p><p>Before sleeping, we spoke for a long time.</p><p>That day had started with peace…<br>And turned into one of the most adventurous rides of my journey.</p><p>As I lay down, I realised:</p><p>Adventure is not comfort.<br>It is uncertainty.<br>It is instinct.<br>It is trust.</p><p>And if you keep moving forward…<br>The road always rewards you.</p>', quote: '"Adventure isn’t always comfortable. Sometimes it is uncertainty. Sometimes it is fear."' },
            { type: 'chapter', id: 'ch24', title: 'A Quiet Day in Aizawl', chapter: 'Ch  24', stats: 'Aizawl', image: 'videos/chapter-24.mp4', desc: '<p>After the intense ride through the mountains the previous day, Day 24 felt calm from the moment I woke up.</p><p>I woke up early, as usual.<br>The room was quiet, and the view from my stay was beautiful. When I stepped outside, the hills of Aizawl were still wrapped in early morning light. I stood there for a few minutes watching the sunrise slowly appear between the layers of houses and hills.</p><p>There was no hurry that morning.<br>For the first time in many days, I had no plan.</p><p>After taking a bath, I decided to walk toward Bara Bazaar, one of the most famous local markets in Aizawl. The market was just a short distance from my stay.</p><p>What surprised me immediately was how early the city wakes up.<br>By 5:30 or 6 AM, people were already active. Shops were opening, vendors were setting up their goods, and the streets were slowly coming alive.</p><p>I walked through the market lanes quietly observing everything. The food stalls on the roadside smelled amazing, so I stopped for breakfast there.<br>The food was simple and incredibly cheap.</p><p>While exploring the market, I noticed many stalls selling second-hand clothes. It’s a very common thing in the Northeast, and the variety was surprising. I picked up a couple of small things.</p><p>The atmosphere of the market was lively but calm. People were friendly, polite, and curious.</p><p>By around 7:30 or 8 AM, I had spent enough time exploring the market and slowly walked back toward my stay.</p><h4 class="font-bold text-xl mt-6 mb-2">The City Without Chaos</h4><p>Later in the morning, I rode my bike to a nearby viewpoint.</p><p>The sky was cloudy that day, but the view was still breathtaking. Hills stretched endlessly in every direction, and houses seemed to grow out of the slopes.</p><p>I parked my bike and walked to the viewpoint.</p><p>Sitting there, listening to a song on my phone and looking at the hills, I spent nearly half an hour doing nothing.</p><p>Sometimes travel is not about moving.<br>Sometimes it is about sitting still and absorbing where you are.</p><p>After that, I continued exploring the city.<br>I visited the Solomon Temple, one of the well-known churches in Aizawl. The architecture was impressive, standing tall against the hills.</p><p>I also visited a small museum and wandered through different parts of the city.</p><p>One thing I noticed immediately about Aizawl was the discipline on the roads.<br>There was almost no traffic chaos.<br>But what impressed me the most was this:<br>Even when the roads were empty, people still followed traffic rules.</p><p>No unnecessary honking.<br>No reckless driving.</p><p>It showed the mindset of the people.</p><h4 class="font-bold text-xl mt-6 mb-2">Meeting a Stranger from Nepal</h4><p>After roaming around the city for most of the morning, I eventually returned to my stay.<br>Later, I went out again to another viewpoint.</p><p>While I was standing there enjoying the view, a man approached me and started a conversation.<br>He was from Nepal.</p><p>Within a few minutes, we began talking about travel, life, and work. Surprisingly, he told me he was living in Bangalore.</p><p>Just like that, we became friends.<br>Travel has a strange magic — strangers become friends in minutes.</p><p>We exchanged numbers and promised to meet again someday in Bangalore.</p><h4 class="font-bold text-xl mt-6 mb-2">Work, Sunset, and City Walk</h4><p>Around 1:30 PM, I returned to my stay and started my work.<br>That balance between travel and work had become part of my routine now. I continued working until around 4:30 PM.</p><p>In the evening, I had a simple plan.<br>I wanted to see the sunset again from the same viewpoint restaurant I had visited the previous day.<br>The sunset there had been unforgettable.</p><p>So I rode toward Aizawl Restaurant, which offers one of the best views of the city.</p><p>The sunset that evening was just as beautiful.<br>The sun slowly dipped behind the mountains while the lights of the city began to glow across the hills.</p><p>I sat there quietly for some time before returning around 6:30 PM.</p><p>Back at the stay, I completed a bit more work.<br>A new traveller had checked in by then, and we started chatting. Soon we decided to go out for dinner together.</p><p>We walked toward Bara Bazaar street again.<br>The streets were calm that evening. We had simple food — samosas and some local snacks.</p><p>Nothing fancy.<br>But the conversation and the night atmosphere made it memorable.</p><p>After returning to the stay, we started planning for the next day.<br>The plan was exciting.<br>We would visit Reiek Village and a sunrise point early in the morning.</p><p>With that plan in mind, we finally went to sleep.</p><p>Day 24 had been a simple day.<br>No long ride.<br>No adventure.<br>Just a quiet city, beautiful views, and meaningful conversations.</p><p>And sometimes, those are the days that help you understand a place the most.</p>', quote: '"Sometimes travel is not about moving. Sometimes it is about sitting still and absorbing where you are."' },
            { type: 'chapter', id: 'ch25', title: 'Sunrise at Reiek and the Day of Small Tests', chapter: 'Ch  25', stats: 'Reiek Peak', image: 'images/chapter-25.jpg', desc: '<p>The day began unusually early.<br>I woke up at 2:30 AM.</p><p>The plan was to reach Reiek Village and Reiek Peak before sunrise. The person I had met the previous day — a traveller from Prayagraj, Uttar Pradesh — had agreed to join me.</p><p>By 3 AM, we walked down to the parking area.</p><p>I unlocked my bike, checked and ignition like I always do before starting a ride. Everything looked fine.</p><p>But just as I turned the key, I realised something unexpected.<br>I had forgotten to refuel the bike.</p><p>Because I had stayed in Aizawl for two days and hadn’t ridden much, I completely missed it. The ride to Reiek was about 35–40 kilometres, and the roads were steep and winding.</p><p>Still, I decided to try.<br>I told myself we might find a petrol pump somewhere on the way. If not, we would deal with it later.</p><p>So we started the ride.</p><h4 class="font-bold text-xl mt-6 mb-2">The Map That Misled Us</h4><p>I mounted my phone on the bike and started navigation.<br>But after about 4–5 kilometres, something strange happened.</p><p>Google Maps took us into an extremely narrow road — a steep downhill path filled with loose stones. Riding there was already difficult, but after another few kilometres it became clear that this was not even a proper road.</p><p>It was just a trail through bushes.<br>No houses.<br>No lights.<br>No network.</p><p>We stopped.<br>The other traveller looked at me and said, “Maybe we should go back.”</p><p>He was right.</p><p>So we slowly turned the bike around and rode back to the main road.<br>A little later we asked a local person for directions. It was around 3:30 AM, and he pointed us toward the correct road.</p><p>That moment reminded me of something important:<br>In the Northeast, sometimes trusting people is better than trusting maps.</p><h4 class="font-bold text-xl mt-6 mb-2">The Climb to Reiek</h4><p>The road to Reiek was steep and narrow.<br>Because we were riding double and the road had many sharp climbs, I had to ride slowly. The bike engine became quite hot during the climb.</p><p>By around 4:45 AM, we finally reached the parking area near the base point.<br>From there, the peak was still 6 kilometres away.</p><p>Most people take a jeep up to the trekking point and then walk the last part.<br>But finding a vehicle at that hour wasn’t easy.</p><p>Luckily, one driver agreed to take us along with a few other travellers.<br>He dropped us near the trekking point.<br>From there we started walking.</p><h4 class="font-bold text-xl mt-6 mb-2">The Sunrise</h4><p>We had some biscuits I had carried with me and continued the trek.</p><p>By around 5:20–5:30 AM, we reached the peak.<br>The air was cold and fresh.<br>The view from the top was breathtaking — layers of hills stretching endlessly across Mizoram.</p><p>At 5:45 AM, the sun slowly rose above the mountains.<br>The sky turned golden.<br>The clouds beneath the hills started glowing.</p><p>It was one of those moments when everyone becomes silent.<br>No words.<br>Just the sound of wind and the quiet awe of nature.</p><p>We spent nearly an hour at the peak, taking photographs and exploring nearby viewpoints.<br>Standing there, looking across the mountains, I felt grateful that we had taken the effort to wake up so early.</p><p>Some moments can only be experienced if you chase them.</p><h4 class="font-bold text-xl mt-6 mb-2">Fuel Trouble and a Waterfall Stop</h4><p>Getting a vehicle back down from the peak was not easy either, because most of the jeeps had already left.<br>Finally we paid a little extra and convinced one driver to drop us back.</p><p>At the base, we had tea and aloo paratha for breakfast.<br>Then reality returned.<br>My bike still had very little fuel.</p><p>When I asked locals about petrol pumps, they told me there were none nearby.<br>Fortunately, someone helped us arrange petrol in a plastic bottle from another place.</p><p>We bought around ₹200 worth of petrol, poured it into the tank, and finally felt relieved.<br>After that we visited a nearby waterfall, spending some time enjoying the peaceful morning.</p><h4 class="font-bold text-xl mt-6 mb-2">A Mechanical Problem</h4><p>But another issue appeared.<br>Because of the steep climbs and engine heat, oil had started leaking slightly from the engine area.<br>I suspected the oil seal or gasket might be damaged.</p><p>Once back in Aizawl, I immediately went looking for a service centre.<br>But it was still holiday season, and most workshops were closed.</p><p>One mechanic told me that service appointments needed to be booked two or three days in advance.<br>That wasn’t possible for me.</p><p>So I called a mechanic I know from Nanjangud and sent him the pictures.<br>After checking them, he reassured me.</p><p>“You can ride another 200–300 kilometres safely,” he said.<br>“Just top up the engine oil and replace the seal when you find a mechanic.”</p><p>That advice gave me some peace of mind.<br>I topped up around 200 ml of oil and returned to my stay.</p><h4 class="font-bold text-xl mt-6 mb-2">Aizawl Evenings</h4><p>By around 2 PM, I began my regular routine again — working for a few hours.</p><p>Around 5:30 PM, I decided to go out once more to the Aizawl viewpoint restaurant to watch the sunset.</p><p>While returning from there, something interesting happened.<br>Two riders approached me after noticing my bike number plate.<br>They were from Tamilnadu.</p><p>We started talking, and within minutes we realised something funny — they were doing a similar long ride across the Northeast.</p><p>We stood there talking for nearly 30 minutes, exchanging travel stories and route suggestions.<br>It felt nice to meet fellow riders on the road.</p><p>Eventually we said goodbye.<br>I had dinner at the restaurant and returned to my stay.</p><h4 class="font-bold text-xl mt-6 mb-2">Preparing for the Next Ride</h4><p>Since I was leaving early the next morning, I decided to pack everything that night.<br>The traveller sharing my room helped me organise the luggage.<br>We packed the bags and kept them near the door so that leaving early would be easier.</p><p>After a long day that had started at 2:30 AM, I was finally ready to sleep.<br>Before sleeping, we talked for some time about travel and life.</p><p>By around 9:30 PM, I finally lay down.</p><p>The next morning would begin another long ride.<br>And the road, as always, was waiting.</p>', quote: '"Some moments can only be experienced if you chase them."' },
            { type: 'chapter', id: 'ch26', title: 'The Day a Stranger Changed My Route', chapter: 'Ch  26', stats: 'Silchar', image: 'images/chapter-26.jpg', desc: '<p>I woke up early that morning.<br>The plan for the day was simple — ride from Aizawl to Silchar, about 260 kilometres.</p><p>On paper it looked manageable, but the estimated travel time was nearly seven hours.<br>That meant one thing — the road would not be easy.</p><p>After checking my bike once more, I said goodbye to the traveller who had shared the room with me.<br>We wished each other safe journeys.</p><p>Then I started riding.</p><p>The morning air in Mizoram was fresh and cool.<br>The road twisted through hills.</p><p>At one point, I saw a beautiful sunrise glowing through the fog.<br>I stopped the bike for a few minutes just to watch it.</p><p>Moments like that make long journeys worth it.</p><p>By around 8 AM, I reached the Mizoram–Assam border.<br>There was a small tea stall there.</p><p>I stopped for a break because the engine had heated slightly during the descent.</p><p>The stall was run by a young girl and her family.<br>They spoke kindly and shared local information about the road ahead.</p><p>I had biscuits and tea.</p><p>When I asked for the bill, they refused.<br>“You are travelling alone. It’s okay,” they said.</p><p>That moment stayed with me.</p><p>From there, I had two route options.<br>Both similar in time.</p><p>One local suggested a forest route.<br>I trusted him.</p><p>Soon I realised — it was another difficult road.</p><p>Dust.<br>Loose stones.<br>Broken surfaces.</p><p>Sometimes I could only ride at 10–20 km/h.</p><p>No network.<br>No shops.<br>Almost no vehicles.</p><p>The road felt isolated.</p><p>For nearly 50 kilometres, it remained like that.<br>That stretch alone took almost two hours.</p><p>The engine heated multiple times.<br>I had to stop, rest, and continue.</p><p>At one point, I sat by the roadside with biscuits.<br>Just breathing.</p><p>Finally, around 12:30 PM, I reached closer to Silchar.</p><p>I went directly to my pre-booked stay.</p><p>The place was surprisingly beautiful and comfortable.<br>The owner welcomed me warmly and first showed me a safe place to park my bike.</p><p>After parking, the first thing he asked me was,<br>“Did you eat?”</p><p>I said no.</p><p>Without any hesitation, he went inside and prepared food for me himself.</p><p>Hot chicken and rice.</p><p>He didn’t treat me like a customer.<br>He treated me like someone who had just arrived home after a long journey.</p><p>That kind of kindness is rare.<br>I had never seen someone care like that for a traveller they had just met.</p><p>After freshening up, I sat and ate.<br>Every bite felt like relief.</p><p>Later, we spoke for a long time.<br>He asked about my journey, encouraged me, and shared his own experiences.</p><p>Other people staying there also joined.<br>Everyone was warm, curious, and genuinely interested.</p><p>We had beautiful conversations — about travel, life, struggles, and choices.</p><p>That place didn’t feel like a stay.<br>It felt like a space filled with good people.</p><p>Later in the afternoon, I went for a short walk.</p><p>And I realised something important:</p><p>The more I travel…<br>the less luggage I need.</p><p>When I started this journey, I carried many things.<br>Extra clothes.<br>Extra items.<br>Things I thought I might need.</p><p>But slowly, the road taught me something simple:</p><p>Life becomes easier when you carry less.</p><p>Less weight.<br>Less clutter.<br>Less dependency.</p><p>And that thought stayed with me.</p><p>Later, that eveneing, I sent some unnecessary items back home.<br>Because I realised — I didn’t need them anymore.</p><p>Travel had simplified me.</p><p>In the evening, I sat again with the travellers.</p><p>I shared my plan for the next day — riding to Imphal.</p><p>On the map it looked easy.<br>200 kilometres.</p><p>But one traveller stopped me and explained the reality.</p><p>That road could take 11–14 hours.<br>No petrol pumps.<br>No food.<br>No proper villages.</p><p>Some sections weren’t even proper roads.</p><p>The more he spoke, the more serious it felt.</p><p>There were things he said that were honestly frightening.</p><p>At that moment, I realised something important:</p><p>If I had taken that road blindly…<br>my journey could have faced serious trouble.</p><p>I felt deeply grateful.</p><p>Those people were not just travellers.<br>They were guidance sent by the road.</p><p>So I made a decision.</p><p>I changed my plan.</p><p>Instead of Manipur, I would ride toward Nagaland — Kohima.</p><p>Longer.<br>But safer.</p><p>Sometimes changing plans is not weakness.<br>It is wisdom.</p><p>Later that night, one of the travellers picked up a guitar and started singing.</p><p>The atmosphere became calm.<br>Peaceful.</p><p>After such a long and difficult day, that moment felt like a pause.</p><p>I went outside, checked my bike again, lubricated the chain, and packed everything for the next morning.</p><p>I thanked everyone there.</p><p>And as I lay down to sleep, I realised something quietly powerful:</p><p>Sometimes the road protects you…<br>through the people you meet.</p><p>And that night in Silchar was one of those moments.</p>', quote: '"Sometimes changing plans is not weakness. It is wisdom."' },
            { type: 'chapter', id: 'ch27', title: 'A New Year on the Road', chapter: 'Ch  27', stats: 'Kohima', image: 'images/chapter-27.jpg', desc: '<p>It was the first day of the year.<br>1 January 2026.</p><p>I woke up very early, around 4:30 AM in Silchar. The air was cold and silent. I freshened up, dressed in my riding gear, and carried my luggage downstairs.</p><p>The previous night I had already informed the stay owner that I would be leaving very early. I called him, and within a few minutes he came down and opened the gate for me.</p><p>Before leaving, I thanked him again.<br>He had treated me with kindness, arranged food for me, and helped me more than I expected.</p><p>We exchanged a warm goodbye. I even gave him a hug before starting the bike.<br>Then the road called again.</p><h4 class="font-bold text-xl mt-6 mb-2">Riding into the Fog</h4><p>The morning was extremely foggy.<br>Visibility was low, and the cold wind cut through my riding jacket. The road from Silchar initially was decent, so I rode carefully at around 40–50 km/h.</p><p>After riding for a while, around 6:00 or 6:15 AM, I stopped at a small tea stall.<br>Hot tea in that cold fog felt perfect.</p><p>After a short break, I continued.<br>But the road soon changed.</p><h4 class="font-bold text-xl mt-6 mb-2">Dust and Broken Roads</h4><p>Suddenly the good road disappeared.<br>What followed was one of the worst stretches of road I had encountered.</p><p>There were heavy trucks passing, and the road was filled with two feet of loose dust everywhere. Every time a truck crossed, a massive cloud of dust would cover everything.</p><p>Within seconds, my helmet visor would become completely dirty.<br>Every few hundred meters I had to stop and clean it just to see the road ahead.</p><p>The dust entered everywhere — my jacket, my gloves, even inside the helmet.</p><p>But through all of this, my bike kept going.<br>The road was terrible.<br>The conditions were harsh.<br>Yet the bike never gave up.</p><p>Every bump, every rocky patch, every dusty climb — it carried me forward like a silent companion determined to take me safely to the next town.</p><p>At one point I stopped to clean my helmet and accidentally dropped it.<br>It cracked slightly.</p><p>Later, after another break, I dropped it again and it broke even more.<br>But there was nothing I could do.<br>There were no shops nearby.</p><p>So I continued riding carefully.</p><h4 class="font-bold text-xl mt-6 mb-2">Lunch by the Water</h4><p>After hours of difficult riding, around 12:30 PM, I reached a small place where water was flowing near the roadside.<br>I stopped there for lunch.</p><p>A few local people were sitting nearby, and we spoke for some time. They were curious about my journey and gave me some information about the road ahead.</p><p>That small break refreshed me.</p><h4 class="font-bold text-xl mt-6 mb-2">Entering Nagaland</h4><p>Around 1:30 PM, I finally reached the Nagaland checkpost.<br>I stopped to ask about the Inner Line Permit, which is usually required to enter Nagaland.</p><p>The police officers there were surprisingly kind and polite.<br>After hearing that I was a solo traveller riding across states, they told me something reassuring.</p><p>“You don’t need to take the permit right now. Just tell them you are exploring Nagaland. It will save your time and money.”</p><p>Their encouragement made me happy.<br>Sometimes the kindness of authorities on the road gives unexpected confidence.</p><p>After thanking them, I continued riding.</p><h4 class="font-bold text-xl mt-6 mb-2">The Last Stretch to Kohima</h4><p>A little ahead, I met another traveller. He helped me take a few photographs and we chatted for a while.<br>Then I continued toward Kohima.</p><p>From there it was about 72 kilometres, and thankfully the road was much better than the earlier dusty stretch.<br>The hills of Nagaland slowly appeared around me.</p><p>By around 3:30 to 4 PM, I finally reached Kohima.</p><h4 class="font-bold text-xl mt-6 mb-2">Finding Familiar Voices</h4><p>I went directly to the hostel where I had planned to stay.<br>After checking in, something unexpected happened.</p><p>I met two travellers who were speaking Kannada.<br>After nearly 26 days of travelling, hearing my own language again felt comforting.</p><p>They were from Karnataka, and within minutes we became friends.<br>It felt like meeting family far away from home.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet New Year Night</h4><p>Since it was New Year\'s Day, almost everything in the city was closed.<br>Finding food became a small adventure.</p><p>First we found a tiny place where we could get tea and samosas.<br>Later, around 7:30 PM, we tried to find a restaurant for dinner.<br>Almost every place was closed.</p><p>Finally, one restaurant owner, after hearing that we had been searching for food, kindly opened his kitchen again and prepared dinner for us.<br>That gesture meant a lot.</p><p>After dinner, we returned to the hostel.<br>We sat together, talking about travel, roads, and life for almost an hour.</p><p>By around 9:30 PM, the long day finally caught up with me.</p><p>After riding through fog, dust, broken roads, and mountains on the first day of the year, I felt exhausted.<br>But also grateful.</p><p>Another state.<br>Another story.<br>Another chapter of the road.</p><p>And my bike — dusty, tired, but strong — was still standing outside, ready for whatever the next day would bring.</p>', quote: '"Every bump, every rocky patch, every dusty climb — it carried me forward like a silent companion."' },
            { type: 'chapter', id: 'ch28', title: 'Trust, Culture, and Quiet Roads', chapter: 'Ch  28', stats: 'Kohima', image: 'images/chapter-28.jpg', desc: '<p>Trust, Culture, and Quiet Roads</p><p>After many days of waking up at 4:30 AM, Day 28 felt different.<br>That morning I woke up a little late, around 6:30 AM.</p><p>From my hostel window I could see the hills of Kohima slowly waking up. The sky was clear, and the sunrise was beautiful, spreading soft light across the valley.</p><p>I stood there quietly for a few minutes, just watching the morning unfold.</p><p>By that time, my new friends Spoorti and Shiva had already left. They had been staying there for almost five days and had an early flight to catch, so they had left the hostel around 3:30 AM.</p><p>The hostel felt a little empty after they left.<br>After getting ready, I decided to go out and explore the city.</p><h4 class="font-bold text-xl mt-6 mb-2">The Local Market</h4><p>My first stop was the local market in Kohima.<br>It was unlike any market I had seen before.</p><p>There were small stalls selling things I had never seen in other markets — different kinds of vegetables, fruits, and even animals that are traditionally consumed in the region.</p><img src="images/chapter-28-1.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>For someone coming from the south of India, it felt completely different.<br>The market showed how unique Naga culture and food habits are.</p><p>I spent some time walking through the lanes, observing people and taking photographs.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unpleasant Encounter</h4><p>Later I rode toward a nearby village area.<br>While taking some pictures, a man suddenly approached me.</p><p>He looked drunk and was very rude. He began questioning me aggressively — asking why I was taking pictures and demanding money.<br>He even tried to touch my camera and my bag.</p><p>For a moment I felt uncomfortable and slightly scared.<br>I tried to stay calm, spoke politely, and slowly moved away from the situation.</p><p>Finally I managed to leave that place.<br>The incident left me feeling a little disturbed.</p><p>But after going further, I met a local girl who explained something important.<br>She told me that some outsiders had misused photographs and videos of villages by posting them online without permission, bringing unnecessary crowds and disturbance.<br>Because of that, a few locals had become sensitive about cameras.</p><p>She reassured me that most people were kind and welcoming, and that the incident I experienced did not represent everyone.<br>Her explanation helped me understand the situation better.</p><p>Sometimes travel teaches you to see beyond a single moment.</p><h4 class="font-bold text-xl mt-6 mb-2">A Shop Built on Trust</h4><p>Soon after, I saw something that completely changed my mood.<br>I found a small self-service shop by the roadside.</p><p>There was no shopkeeper.<br>Just shelves with items — snacks, drinks, and small goods.<br>A board explained the system:<br>You simply take what you need and pay through UPI or leave cash in the box.</p><img src="images/chapter-28-0.jpg" alt="self payment shop" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The entire shop functioned purely on trust.<br>Standing there, I felt amazed.</p><p>In a world where people worry about theft and security, here was a place where an entire shop was built on honesty.<br>That moment reminded me of something simple:<br>Trust creates trust.</p><p>If we respect people, their culture, and their way of life, we usually receive the same respect in return.</p><h4 class="font-bold text-xl mt-6 mb-2">The Clean Villages of Nagaland</h4><p>From there I rode toward Khonoma Village and the Naga Heritage Village.<br>The villages in Nagaland surprised me.</p><img src="images/chapter-28-2.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>They did not feel like ordinary villages.<br>They were incredibly clean and well maintained.</p><p>Everywhere I looked there were bamboo dustbins instead of plastic.<br>The roads were spotless.<br>There was almost no noise, no unnecessary traffic, no litter.<br>It felt peaceful.</p><p>While exploring the Naga Heritage Village, I met a couple who kindly helped me take some photographs. They also explained the importance of the place and told me about the Hornbill Festival, which celebrates Naga culture and traditions every year.</p><p>Spending time there helped me understand the rich heritage of Nagaland.</p><p>Before leaving, I also met a few students who were curious about my ride. When they heard about the distance I had travelled, they seemed inspired and encouraged me warmly.</p><p>Moments like these make solo travel special.</p><h4 class="font-bold text-xl mt-6 mb-2">Taking Care of My Companion</h4><p>By around 3:30 PM, I returned to Kohima.<br>Before going back to the hostel, I stopped at a shop to buy a few locks and fittings for my bike.</p><p>After all the kilometres we had travelled together, I felt responsible for taking care of it.<br>That bike had carried me across mountains, dust, broken roads, and long distances.<br>Protecting it felt important.</p><p>Back at the hostel, the place felt unusually quiet.<br>Most travellers had left after the Christmas and New Year holidays. Only two or three people remained.</p><h4 class="font-bold text-xl mt-6 mb-2">A Cold Evening in Kohima</h4><p>By evening the temperature had dropped to around 5–6 degrees.<br>In Kohima, most restaurants close very early — around 7 or 7:30 PM.</p><p>Remembering the struggle for food the previous night, I decided to order dinner early so I wouldn’t have the same problem again.<br>Around 7 PM, I sat outside the hostel with my food.</p><p>The air was extremely cold.<br>But the quiet evening felt peaceful.</p><p>After dinner, I went for a short walk to buy medicine, water, and some biscuits for the next day.<br>I had another plan forming in my mind.<br>The famous Dzukou Valley.</p><p>Before sleeping, I spoke with the hostel owner and gathered some information about the trek.<br>He was very friendly and shared useful advice.</p><p>Around 8:30 PM, I returned to the hostel and prepared for the next day’s adventure.</p><p>The hostel was silent.<br>The hills of Nagaland were cold and still.<br>And somewhere outside, my bike rested after another day of exploring the Northeast.<br>Tomorrow would bring another journey.</p>', quote: '"In a world where people worry about theft and security, here was a place where an entire shop was built on honesty."' },
            { type: 'chapter', id: 'ch29', title: 'The Valley That Tested Me', chapter: 'Ch  29', stats: 'Dzukou Valley', image: 'images/chapter-29.jpg', desc: '<p>That morning I woke up around 6 or 6:30 AM in Kohima.<br>It was Saturday, and the morning felt slow and peaceful.</p><p>But one thought kept returning again and again.<br>Dzukou Valley.</p><p>I had come all the way to Nagaland, and Dzukou Valley is known as one of the most beautiful valleys in Northeast India. Yet I hesitated.</p><p>The trek was long — almost 30+ kilometres round trip — and I would be doing it solo in extremely cold conditions.</p><p>For a moment I wondered if I should skip it.<br>I stepped outside the hostel for a short walk, just ten minutes to clear my mind.</p><p>When I returned, the answer had already formed inside me.<br>If I came this far, I cannot miss this.</p><p>A guy in the hostel had initially said he would join me.<br>But after making me wait almost an hour, he finally told me he wasn’t feeling well and wouldn’t be coming.</p><p>For a moment I thought about cancelling the trek.<br>But something inside pushed me forward.</p><p>Instead of taking my bike to the trailhead at Viswema village, I decided to go by shared taxis.</p><p>So I took a small taxi for ₹20 to the bus stand and then another shared taxi to Viswema for ₹90.</p><p>While travelling in the shared taxi, I met a beautiful group of travellers.<br>They were happy listening to my solo journey and they wished me well.</p><p>I reached around 10 AM, had breakfast, and bought some snacks and water for the trek.</p><p>Since I had done a few treks in Karnataka, I knew carrying more load is not a good idea.<br>So I carried only a 10-litre bag.<br>Inside it — snacks, my camera stick, and a power bank.<br>Nothing much.</p><p>From Viswema, taxis usually charge ₹1500–₹2500 to reach the trekking base.<br>Since I was alone, I decided to wait.</p><p>After about 20–30 minutes, a group of travellers from Assam arrived.<br>I asked if I could join them.<br>They welcomed me immediately.</p><p>Trust me, those guys were very kind.<br>They joined me, listened to my story, and were happy about my journey.</p><p>Within ₹250, I reached the trekking base.</p><p>The trek began from the checkpost.<br>After paying the entry fee, I started walking into the forest.</p><p>Soon I met Joseph, a local guide who had been hired by a trekker from Kerala.<br>We started talking, and the conversation flowed easily.</p><p>Even though I had come alone, I never felt alone.<br>Everyone slowly became part of the journey.</p><p>As I walked deeper, something changed inside me.</p><p>I felt light.<br>I don’t know how to express it, but I was happy.</p><p>No baggage of the past.<br>No load of the future.</p><p>I was just living in the present moment.<br>Enjoying life fully.</p><p>Since I was all alone, I captured my photos myself.<br>I did some funny clicks, tried different poses, and enjoyed doing it alone.</p><p>The path moved through thick forests and open ridges.<br>Walking alone felt peaceful.</p><p>By afternoon I reached the Dzukou base camp.</p><p>The tents were charging around ₹1000 per person.<br>After speaking to others, I managed to stay for ₹200 by sharing.</p><p>Before evening I walked to the sunset viewpoint.<br>The sky slowly turned orange as the sun disappeared behind the hills.</p><p>The view was breathtaking.</p><p>I kept my bag aside and went ahead to enjoy the sunset.<br>When I returned, rats had eaten all my snacks.</p><p>For a moment I laughed.<br>Even the valley had joined my journey.</p><p>After sunset, I returned.</p><p>A guide I met on the way shared food with me.<br>I also had what I had carried from home.</p><p>See how beautiful life is — when you come alone, people join you.<br>They help you.<br>They guide you.</p><p>By 5:30 PM, darkness arrived quickly.<br>The temperature dropped to around –4°C.</p><p>A bonfire was lit.<br>People gathered.</p><p>People from different states sat together — Mumbai, Delhi, Assam, Kerala, Uttarakhand.</p><p>I had arrived alone.<br>But I didn’t feel like a solo traveller anymore.</p><p>The cold was intense — almost unbearable.<br>Seeing my situation, Joseph and a trekker from Kerala understood immediately.<br>Without saying much, they shared a blanket with me</p><p>Sleep was difficult.</p><p>One of my phones died due to cold.</p><p>But I kept thinking about the next morning.<br>The sunrise.<br>The valley.<br>The moments.</p><p>I slept only for short moments.<br>But I didn’t regret it.</p><p>Because some nights are not meant for sleep.<br>They are meant to become stories.</p><p>And that freezing night in Dzukou Valley was one of those stories.</p>', quote: '"In the coldest night, I was warmed by people I had just met."' },
            { type: 'chapter', id: 'ch30', title: 'The Morning That Proved Everything', chapter: 'Ch  30', stats: 'Dzukou Valley', image: 'images/chapter-30.jpg', desc: '<p>Dzukou Valley – The Coldest Test</p><p>The night before had been brutal.<br>The temperature had dropped to around –4°C, and sleep was almost impossible. Even with the blanket that the Kerala guy had shared with me, the cold kept waking me up again and again.</p><p>In total, I might have slept barely one hour.</p><p>By 4:30 AM, I gave up trying to sleep.<br>I stepped outside the tent.<br>The cold hit instantly.</p><p>Without a mask, cap, and gloves, it was almost impossible to stand there. My breath turned into white mist, and the air felt sharp against my skin.</p><p>The water bottle I had kept beside me had become ice cold.<br>Somehow I drank a few sips.</p><p>At 5 AM, I started walking toward the main Dzukou Valley, which was still about 3 kilometres away from the base camp.</p><p>Walking Into the Freezing Morning</p><p>The trek was harder than I expected.<br>My body was already tired from the previous day’s trek, and with almost no sleep, walking again in freezing temperatures felt like another challenge.</p><p>Luckily, the Kerala traveller joined me.<br>Two other trekkers from Tripura also decided to walk with us.</p><p>We moved slowly through the dark trails toward the valley.<br>Our first stop was the emergency helipad point, where the valley slowly opened before us.</p><p>Even in the early light, the view was breathtaking.<br>Rolling hills stretched endlessly.<br>The valley looked peaceful and untouched.</p><p>When the Cold Tested Me</p><p>But the cold became stronger as we continued.<br>Within the first kilometre, my hands started going numb.<br>My face and beard were slowly filling with tiny crystals of ice.</p><p>For a moment, I almost stopped.<br>I told myself:<br>"Maybe this is enough."</p><p>But something inside refused to quit.<br>We continued walking.</p><p>Soon we reached a frozen river.<br>The entire stream had turned into ice.<br>It was around 6 AM.</p><p>I stood there for a few minutes, looking at the frozen landscape and clicking a few photos.</p><p>That moment brought a strange realization.<br>When I started this journey from Mysuru, I wasn’t even sure if I could complete it.<br>But now I was standing here, trekking in –4°C, deep inside a valley in Nagaland.</p><p>I smiled quietly.<br>Everything is possible with time and patience.</p><p>The Final Push</p><p>The two trekkers from Tripura decided to return from that point.<br>But I continued.</p><p>There were still another two kilometres to the main peak.<br>The cold was intense.<br>My fingers felt like they were losing their strength.<br>My beard had frozen.</p><p>The path was slippery and silent.<br>But step by step, slowly, I kept moving.</p><p>Sometimes courage is not loud.<br>Sometimes it is just taking the next step.</p><p>The First One to Reach</p><p>At around 7:15 AM, I finally reached the highest point of the valley.<br>And something unexpected happened.</p><p>I was the first person to reach there that morning.<br>For a few seconds, I simply stood there.<br>Breathing.<br>Looking at the valley below.</p><p>I couldn’t believe it.<br>One of my long-time dreams had quietly become real.<br>I had reached Dzukou Valley’s peak.</p><p>Not with a group.<br>Not with a guide.<br>But on my own strength.</p><p>It wasn’t easy.<br>It wasn’t comfortable.<br>But it was worth everything.</p><p>Waiting for the Sun</p><p>Even after reaching the peak, the sun had not risen yet.<br>The cold was still extreme.<br>I stood there waiting.</p><p>Slowly the sky began to glow.<br>After about 30 minutes, sunlight finally touched the valley.</p><p>The ice on the leaves began melting.<br>Tiny drops of water started falling from the frozen plants.<br>The valley slowly woke up.</p><p>That moment felt magical.</p><p>The Walk Back</p><p>After spending some quiet time at the top, I started walking back.<br>On the way down, I met a few trekkers who had stopped midway because of the cold.<br>We sat together for a while, shared some snacks, clicked photos, and spoke about the trek.</p><p>Then I continued walking back to the base camp.</p><p>While I started back, trust me — the valley was not ready to send me back.<br>I don’t know what connection I had with that place, but we were so connected and in sync.<br>It felt like a lifetime experience.</p><p>When I reached there, I had hot tea, eggs, and biscuits.<br>That simple meal felt like a luxury after the freezing morning.</p><p>By around 12 PM, I had reached the base camp.<br>After resting for a while, I had to start again — this time alone.<br>I started trekking solo toward the checkpost from where we get taxis.</p><p>The Solo Descent</p><p>Soon it was time to leave.<br>Some trekkers had already left early.<br>Others were still exploring the valley.</p><p>So I started the descent alone.<br>And strangely, I enjoyed it.</p><p>Walking down through the forests alone felt peaceful.<br>I took many breaks.<br>Captured photos.<br>Sat quietly in a few places.</p><p>Sometimes the best part of trekking is not the peak.<br>It is the journey back, when everything feels calm.</p><p>The Unexpected Struggle</p><p>By afternoon I reached the checkpost.<br>From there I reached Viswema village.</p><p>But now the real challenge began.<br>It was Sunday.</p><p>There were no taxis on the road.<br>I waited nearly two hours.<br>Nothing came.</p><p>In that situation, I didn’t panic.<br>I felt like this was also part of my experience.<br>The journey was still continuing.</p><p>Finally around 5 PM, I requested a local travel guide nearby.<br>He helped arrange a taxi to Kohima.</p><p>But it had to be a full hire, so I had to pay extra.<br>At that moment, it didn’t matter.<br>I just wanted to reach the hostel.</p><p>A Quiet End to a Powerful Day</p><p>I finally reached my hostel around 6 PM.<br>I took a hot bath.<br>Ordered food.<br>Had dinner quietly.</p><p>After speaking with the hostel owner for some time, I went to bed very early.<br>My body was exhausted.<br>But my mind was peaceful.</p><p>What the Valley Gave Me</p><p>I had started the trek alone.<br>But by the time I returned, I had spoken to almost everyone who came to the base camp.</p><p>Strangers had become friends.<br>Joseph, the Kerala guy, the Tripura trekkers, and many others had all become part of the story.</p><p>Even today, I am still in touch with the Kerala traveller who walked with me that morning.</p><p>An Unforgettable Memory</p><p>Every step of that trek created a memory.<br>Every moment in the cold valley taught me something.</p><p>Dzukou Valley was not just a destination.<br>It was a test of patience.<br>Of endurance.<br>Of belief.</p><p>And it gave me something I will carry for the rest of my life.<br>An unforgettable moment.</p>', quote: '"Sometimes courage is not loud. Sometimes it is just taking the next step."' },
            { type: 'chapter', id: 'ch31', title: 'A Quiet Day in Kohima', chapter: 'Ch  31', stats: 'Kohima', image: 'images/chapter-31.jpg', desc: '<p>Rest, Friendship, and Preparation</p><p>After the intense experience of Dzukou Valley, Day 31 began gently.<br>I woke up around 6 AM and stepped outside the hostel.</p><p>The morning sky over Kohima was glowing softly.<br>The sun slowly rose over the hills, lighting the city in golden colours.<br>After the freezing night in Dzukou Valley and the long trek the previous day, standing there quietly and watching the sunrise felt peaceful.</p><p>Some mornings don’t need anything else.<br>Just silence and sunlight.</p><p>Taking Care of Things That Matter</p><p>That morning became a small reset day for me.<br>I washed all my clothes that had become dusty during the trek.</p><p>Then I spent time with my bike.<br>After so many difficult roads, dust, and mountain trails, it deserved some care.</p><p>I cleaned it thoroughly, checked everything carefully, and lubed the chain properly.<br>It felt satisfying to see it shining again.</p><p>My bike had carried me across thousands of kilometres.<br>Taking care of it was not a task.<br>It was respect.</p><p>By around 7:30 AM, everything was done.<br>I had taken a bath, freshened up, and felt ready for the day.</p><p>Meeting Friends Again</p><p>Later in the morning, a few travellers I had met earlier in the valley — guys from Arunachal Pradesh and Assam — called me.<br>We had crossed paths during the trek and connected well.</p><p>I stepped out and joined them for breakfast.<br>We spent some time together talking about the trek, travel stories, and future plans.</p><p>After breakfast, we took a small city walk around Kohima.</p><p>Sometimes travel friendships are short but meaningful.<br>Even a few hours together can create memories.</p><p>Balancing Travel and Work</p><p>By late morning, I returned to the hostel.<br>Like many other days of this journey, I had to balance travel and work.</p><p>So I opened my laptop and started working.<br>At the same time, I also began packing my luggage.</p><p>The next day I would leave for Manipur, another beautiful part of Northeast.<br>Packing after so many days of travel had become easier.</p><p>I had learned something important during this journey:<br>The longer you travel,<br>the fewer things you realise you actually need.</p><p>A Slow Afternoon</p><p>Work that day was lighter than usual.<br>In the afternoon, I stepped out for a small walk and had lunch outside.<br>I also bought a few snacks for the next day`s ride.</p><p>Kohima had begun to feel familiar by then.<br>The streets, the people, the small cafés — everything felt comfortable.</p><p>Preparing for the Road Again</p><p>By around 6:30 PM, my work was finished.<br>I stepped out again, this time to refill my bike’s fuel tank.<br>Before entering remote regions, it’s always safer to carry a full tank.</p><p>After filling fuel, I had dinner outside and returned to the hostel around 7:30 PM.</p><p>A Simple Goodbye Evening</p><p>Since I was leaving the next day, the hostel staff and a few travellers spent some time talking with me.<br>In a short time, we had become comfortable with each other.</p><p>Travel often creates friendships quickly because everyone understands the same language — the road.</p><p>Later that night, I watched a movie and continued chatting with them.<br>Time passed quietly.<br>By around 11:30 PM, I finally went to sleep.</p><p>The next morning, the journey would begin again.<br>A new road.<br>A new state.<br>And another story waiting somewhere ahead.</p>', quote: '"The longer you travel, the fewer things you realise you actually need."' },
            { type: 'chapter', id: 'ch32', title: 'Riding Into Uncertainty', chapter: 'Ch  32', stats: 'Kohima to Imphal', image: 'images/chapter-32.jpg', desc: '<p>Kohima to Imphal, Manipur</p><p>I woke up early that morning.<br>It was around 5 AM in Kohima.</p><p>Since I had already packed everything the previous night, the morning was simple. I just had to add a few small items — my tank bag and a few essentials.</p><p>By 5:30 AM, I started my bike and left the hostel.</p><p>That day’s destination was Imphal, the capital of Manipur.<br>The distance was only about 135 kilometres, but the expected travel time was nearly five hours. In the Northeast, distance often means very little — it is the road condition that decides how long the journey will take.</p><p>The Road Changes</p><p>The first part of the ride out of Kohima was smooth.<br>The cold morning air flowed through the hills, and the road was decent enough to ride comfortably.</p><p>But everything changed as I approached the Manipur border.<br>The road suddenly became extremely bad.</p><p>Dust covered the entire road. Trucks were moving slowly through thick clouds of dirt, and every few hundred metres my helmet visor would become completely muddy.<br>I had to stop frequently just to clean it.</p><p>Sometimes the dust was so thick that I could barely see ahead.</p><p>The road didn’t feel like a road anymore.<br>It felt like a test.<br>Every kilometre demanded patience.<br>Every stretch reminded me that this journey was not about comfort — it was about endurance.</p><p>The Military Presence</p><p>Soon another thing caught my attention.<br>Every hundred metres, there were military personnel standing on the roadside.</p><p>Military trucks.<br>Armed soldiers.<br>Security vehicles.</p><p>I had seen such scenes only in movies and news reports before.<br>But here it was real.</p><p>The atmosphere felt tense.<br>A strange feeling of uncertainty began to grow inside me.</p><p>Just two days earlier, someone had warned me about travelling through Manipur.<br>That memory returned to my mind.</p><p>For a moment I wondered:<br>Did I make a wrong decision coming this way?</p><p>The combination of terrible roads, heavy dust, and constant military presence made the ride feel uncomfortable.<br>But the only way forward was to keep riding.</p><p>At one point, I heard about a bomb blast incident that had happened earlier that day.<br>That thought stayed in my mind.<br>The road suddenly felt heavier.<br>Every sound felt louder.<br>Every movement around me felt more noticeable.</p><p>It was not fear exactly.<br>But it was awareness.<br>A deep sense that I was riding through a place that carried its own history, its own struggles, its own reality.</p><p>For almost 135 kilometres, there were hardly any facilities.<br>No restaurants.<br>No proper tea stalls.<br>No petrol pumps.<br>No repair shops.<br>Just broken roads, stones, dust, and military vehicles.</p><p>At one point I found a small place where I thought of stopping, but I decided to continue, hoping to find something better ahead.<br>But nothing appeared.</p><p>It was just road after road of rough terrain.</p><p>At times I even worried about my bike.<br>If the tyre punctured or the top box broke on those roads, I had no idea where I would find help.</p><p>But even in that uncertainty, I kept moving.<br>Because sometimes the road doesn’t give you options.<br>It only gives you direction.</p><p>Finally Reaching Imphal</p><p>Around 11 AM, after riding nearly 110 kilometres, the road slowly became better.<br>“Better” in the Northeast still means rough, but at least it was manageable.</p><p>Soon I reached Imphal.<br>I already knew about a hostel there, so I rode directly to it.</p><p>After parking my bike and checking in, the first thing I did was take a bath.<br>The dust from the road had covered my clothes, my jacket, and even my face.<br>It felt good to finally wash everything away.</p><p>And along with the dust, it felt like I had washed away the tension of the ride too.</p><p>A Familiar Face</p><p>Then something unexpected happened.<br>At the hostel, I saw a French traveller whom I had met earlier in Nagaland.</p><p>Seeing a familiar face in a new city felt comforting.<br>We spoke for a while and shared stories from the road.</p><p>Later in the afternoon, we went out together to explore a nearby market.</p><p>Life Continues Normally</p><p>By evening I finished my work and stepped out again.<br>I went for tea and then visited a Vishnu Temple nearby.</p><p>One thing I noticed inside the temple surprised me.<br>There were more military personnel than ordinary visitors.</p><p>It reminded me again how different life here was compared to other parts of India.<br>But at the same time, people were calm.<br>Going about their day.<br>Praying.<br>Living.</p><p>That contrast stayed with me.</p><p>After visiting the temple, I stopped at a small exhibition nearby, spent some time there, and returned to the hostel around 7:30 PM.</p><p>Cooking Together</p><p>That evening became special in a simple way.<br>The French traveller and I decided to cook dinner ourselves.</p><p>We went to a nearby market and bought some vegetables before the shops closed.<br>Back at the hostel, I cooked tomato rice.<br>Another traveller from Tripura joined us.</p><p>Soon the hostel kitchen turned into a small gathering place.<br>We all sat together eating, talking, and sharing stories.<br>Even the hostel owner joined us. He was extremely friendly and welcoming.</p><p>Conversations Late Into the Night</p><p>Travellers from Tripura, Assam, France, and other places sat together that night.<br>The conversation flowed naturally.</p><p>We spoke about travel, life, culture, and the roads we had taken to reach this place.<br>Time passed quickly.<br>Before we realised it, it was already 11:30 PM.</p><p>Understanding Manipur</p><p>When I first entered Manipur that morning, I had felt fear.<br>The roads.<br>The military presence.<br>The tension.</p><p>But as the day passed, something changed inside me.</p><p>People explained their reality.<br>For them, this was normal life.<br>Security forces being present everywhere was part of their daily routine.</p><p>In our cities, such scenes feel unusual.<br>Here, they were part of life.</p><p>And slowly, I began to understand Manipur differently.</p><p>Not as a place of fear.<br>But as a place of strength.</p><p>A place where people continue to live, smile, and move forward despite everything around them.</p><p>Once I understood that, my fear slowly disappeared.<br>Confidence replaced it.</p><p>And I realised something again:<br>Every place has its own story.<br>You just have to stay long enough to understand it.</p><p>That night, I slept peacefully in Imphal.<br>The day had started with uncertainty and fear.<br>But it ended with friendship, food, and conversation.</p><p>Another reminder that on the road, things can change quickly.<br>Sometimes all it takes is one day and a few good people.</p>', quote: '"Every place has its own story. You just have to stay long enough to understand it."' },
            { type: 'chapter', id: 'ch33', title: 'The Market of Mothers', chapter: 'Ch  33', stats: 'Imphal', image: 'videos/chapter-33.mp4', desc: '<p>Exploring Imphal</p><p>After the long and dusty ride into Manipur the previous day, Day 33 began peacefully.<br>I woke up around 6 AM in the morning.</p><p>The air in Imphal was cold but calm.<br>Before anything else, I stepped outside and looked at my bike.<br>It was still covered with dust from the rough roads I had travelled the day before.</p><p>So the first task of the day was simple.<br>I cleaned my bike carefully, wiping away the dust from the body and the mirrors.<br>After so many kilometres together, taking care of the bike had become almost like a morning ritual.</p><p>After that I took a bath and freshened up, and by around 7 AM I was ready to step out.</p><p>Morning in Imphal</p><p>One thing I had noticed in the Northeast was how early the day begins.<br>By 5 or 6 AM, people are already walking on the streets, opening small shops, or going about their daily routines.<br>Life starts early here.</p><p>That morning I initially thought of riding to a sunrise point, but the cold weather made me change my plan.<br>Instead, I decided to explore one of the most unique places in Manipur.</p><p>Ima Keithel Market.</p><p>Ima Keithel — The Mothers’ Market</p><p>I rode my bike to Ima Keithel, also known as the Mother’s Market.</p><p>The moment I entered the market area, I realised this place was something truly special.<br>Ima Keithel is one of the largest markets in the world run entirely by women.</p><p>Everywhere I looked, I saw women vendors managing shops, selling vegetables, fish, clothes, handmade goods, spices, and traditional items.<br>There were hundreds of small stalls.</p><p>And each stall had a woman sitting proudly behind it, running her business.</p><p>The market is not just a place of trade.<br>It is a symbol of women’s strength and independence in Manipur.</p><p>Walking through the market felt like w
