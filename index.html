        { type: 'chapter', id: 'ch20', title: 'Where the Road Taught Me to Stay Calm', chapter: 'Ch  20', stats: 'Adaptation', image: 'images/chapter-20.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Morning of Responsibility</h4><p>South Meghalaya</p><p>It was Christmas morning.<br>I woke up around 6:30 AM.</p><p>Before leaving,<br>I wished my friend and his family.</p><p>There was festive warmth in the house —<br>simple,<br>grounded,<br>genuine.</p><p>But before heading toward South Meghalaya,<br>I had unfinished responsibility.</p><p>The drain bolt from last night’s oil change<br>had not been fully tightened.</p><p>I could not take a risk.</p><h4 class="font-bold text-xl mt-6 mb-2">Fixing What Matters</h4><p>Early morning,<br>on Christmas Day,<br>I searched for a garage.</p><p>Most places were closed.</p><p>Finally,<br>at a Tata Motors service station,<br>a kind mechanic helped me.</p><p>He understood the issue immediately,<br>found the correct ring,<br>and tightened it properly.</p><p>That moment brought relief.</p><p>Now I could ride with confidence.</p><p>I started toward South Meghalaya.</p><h4 class="font-bold text-xl mt-6 mb-2">Into the Hills</h4><p>First,<br>I stopped briefly near Umiam Lake —<br>the water calm,<br>reflecting the morning sky.</p><img src="images/chapter-20_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Then I continued deeper into the hills.</p><h4 class="font-bold text-xl mt-6 mb-2">The Sacred Forest</h4><p>One of the places I had planned to visit<br>was the Sacred Forest — Mawphlang Sacred Grove.</p><p>As I entered,<br>the atmosphere changed.</p><p>The forest felt untouched.<br>Old.<br>Almost guarded.</p><p>A local guide joined me.</p><p>And the surprising part —<br>he spoke Kannada.</p><img src="images/chapter-20_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>He had studied and lived in Bengaluru for some time.</p><p>Hearing Kannada in the middle of Meghalaya<br>felt unexpected and comforting.</p><p>He shared the history of the sacred grove —<br>how local Khasi communities protect the forest spiritually.</p><p>Nothing inside the forest can be taken out.<br>Not even a leaf.</p><p>It is believed that disturbing it brings misfortune.</p><p>The trees were massive.<br>Roots intertwined.<br>The ground soft with centuries of decay.</p><p>The forest didn’t feel like nature alone.</p><p>It felt sacred… in intention.</p><p>Listening to the guide speak about rituals,<br>tribal history,<br>and conservation,<br>made me respect the land even more.</p><p>That place wasn’t a tourist spot.</p><p>It was a living belief system.</p><h4 class="font-bold text-xl mt-6 mb-2">Toward Dawki</h4><p>From there,<br>I started toward Dawki —<br>home to the Umngot River,<br>near the Bangladesh border.</p><img src="images/chapter-20_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The road initially was fine.</p><p>Then suddenly —<br>it wasn’t.</p><p>For several kilometres,<br>it was extremely bad.</p><p>Broken patches.<br>Mud.<br>Uneven surfaces.</p><p>I had to ride carefully.</p><p>My bike handled it well,<br>but I could feel the strain.</p><p>Every time the road worsened,<br>I slowed down…<br>and mentally thanked him<br>for holding steady.</p><h4 class="font-bold text-xl mt-6 mb-2">The Cleanest Village</h4><p>After about 10 kilometres of rough stretch,<br>the road improved.</p><p>And then I saw it —<br>Mawlynnong.</p><img src="images/chapter-20_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"> <img src="images/chapter-20_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"> <p>The cleanest village in Asia.</p><p>The village felt different.</p><p>Neat pathways.<br>Bamboo dustbins.<br>Well-maintained houses.<br>Flowers everywhere.</p><p>Cleanliness here wasn’t forced.</p><p>It was cultural.</p><p>I spent time walking around.</p><p>Spoke to a few local men.</p><p>Their pride was visible.</p><p>It wasn’t about tourism alone —<br>it was about identity.</p><p>From a nearby viewpoint,<br>I could see the Bangladesh border<br>stretching far into the plains.</p><p>Standing there,<br>I realised how far I had come<br>from Mysuru.</p><h4 class="font-bold text-xl mt-6 mb-2">Dawki</h4><p>Later,<br>I reached Dawki.</p><p>But the river wasn’t at its best.</p><p>Due to construction upstream,<br>the water looked muddy.</p><p>It wasn’t the crystal clarity<br>I had imagined.</p><p>Still,<br>the setting was beautiful.</p><p>Mountains hugging the river.<br>Boats moving slowly.<br>Border presence in the distance.</p><p>Around 4 PM,<br>I decided to head back toward Shillong.</p><h4 class="font-bold text-xl mt-6 mb-2">Dust and Darkness</h4><p>Then suddenly —<br>my headlight stopped working.</p><p>I was shocked.</p><p>I pulled over immediately.<br>Turned off the ignition.<br>Checked the wiring.</p><p>But it was dark.</p><p>Dust everywhere.<br>Hands already dirty.</p><p>I couldn’t properly figure it out.</p><p>For a few seconds,<br>there was silence inside me.</p><p>This wasn’t a small problem.</p><p>Evening in Meghalaya.<br>Narrow roads.<br>Fog could return anytime.</p><h4 class="font-bold text-xl mt-6 mb-2">Choosing Calm</h4><p>But something inside me<br>didn’t panic.</p><p>A few days earlier,<br>I would have.</p><p>But not now.</p><p>I told myself calmly —<br>You will reach Shillong.</p><p>Even if the light fails completely,<br>I have options.</p><p>Call my friend.<br>Stop somewhere safe.<br>Wait.</p><p>This journey had taught me something powerful:</p><p>Not every problem needs panic.</p><p>Sometimes,<br>it needs pause.</p><h4 class="font-bold text-xl mt-6 mb-2">Moving Forward</h4><p>So instead of worrying,<br>I adapted.</p><p>I followed cars<br>to use their headlights.</p><p>Reduced speed.<br>Stayed alert.</p><p>Every kilometre felt earned.</p><p>Dust covered my jacket.<br>Gloves were dirty.<br>Visor layered with mud.</p><p>But inside,<br>I was steady.</p><p>Somewhere in that darkness,<br>I realised:</p><p>This journey has changed me.</p><p>Earlier,<br>obstacles felt like interruptions.</p><p>Now,<br>they feel like experiences.</p><p>I don’t have to stop.</p><p>Maybe I pause.<br>But I never stop.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Transformation</h4><p>When I finally reached my friend’s home<br>and parked the bike safely,</p><p>I felt deep gratitude.</p><p>For the machine<br>that endured the terrain.</p><p>For the lessons hidden in inconvenience.</p><p>For the growth<br>I couldn’t see happening,<br>but could feel now.</p><p>That night,<br>sitting at the Christmas dinner table,</p><img src="images/chapter-20_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I wasn’t just tired.</p><p>I was transformed.</p><p>Not dramatically.</p><p>But quietly.</p><p>And quietly…<br>is how real change happens.</p>', quote: '"I don’t have to stop. Maybe I pause. But I never stop."' },
        { type: 'chapter', id: 'ch21', title: 'In the Dark, I Found People', chapter: 'Ch  21', stats: 'Resilience', image: 'images/chapter-21.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">Fixing Before Leaving</h4><p>I woke up around 5 AM.<br>The first thing I did was check my bike.</p><p>The headlight that had stopped working the previous evening needed fixing.</p><p>With limited tools,<br>and whatever I had available,<br>I managed to secure the wiring<br>and taped it carefully.</p><p>It wasn’t a perfect repair.<br>But it would work.</p><p>That moment felt satisfying —<br>small mechanical victories on the road build confidence.</p><h4 class="font-bold text-xl mt-6 mb-2">A Gentle Farewell</h4><p>After fixing the light,<br>I took a bath and packed everything slowly.</p><p>Outside,<br>Shillong was still quiet.</p><p>My friend wasn’t ready to let me leave immediately.</p><p>Before my departure,<br>he took me to a few beautiful places around Shillong one last time.</p><p>The hills were calm.<br>The air cool.<br>The views felt like a gentle farewell from Meghalaya.</p><p>Around noon,<br>he took me to a small local restaurant<br>for authentic Meghalaya food.</p><img src="images/chapter-21_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>It was simple.<br>Local.<br>Warm.</p><p>Food always tastes different<br>when shared with people who genuinely care.</p><img src="images/chapter-21_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>By the time we returned home,<br>it was already around 1:30 PM.</p><h4 class="font-bold text-xl mt-6 mb-2">Saying Goodbye</h4><p>Then came the difficult part.</p><p>Saying goodbye.</p><p>His family gathered near the entrance.</p><p>His father spoke kindly,<br>wishing me a safe journey ahead.</p><p>His sister smiled warmly.</p><p>And my friend…</p><p>After 7–8 years,<br>we had met again,<br>spent meaningful days together,<br>and now the road was calling me away.</p><p>We hugged.</p><p>It was emotional.<br>Not dramatic.<br>But real.</p><p>I started the bike<br>and slowly rolled out of the lane.</p><p>Shillong disappeared behind me.</p><h4 class="font-bold text-xl mt-6 mb-2">Into Uncertainty</h4><p>My plan for the day<br>was to reach Silchar in Assam.</p><p>I assumed the road would be manageable.</p><p>But reality unfolded differently.</p><p>After about 100 kilometres,<br>the road began filling with trucks.</p><p>Endless trucks.</p><p>Heavy vehicles crawling slowly<br>through narrow stretches of road.</p><p>The landscape was beautiful.</p><p>But the traffic was intimidating.</p><p>Somewhere along the way,<br>I passed areas close to the Bangladesh border.</p><p>The geography felt different.<br>The air felt heavier.</p><h4 class="font-bold text-xl mt-6 mb-2">When Everything Stops</h4><p>By around 5 PM,<br>darkness had already taken over the hills.</p><p>I realised something uncomfortable.</p><p>Maybe I had made the wrong decision<br>by leaving Shillong late.</p><p>Around 6 PM,<br>everything stopped.</p><p>Not slowed.<br>Stopped.</p><p>A long line of trucks stretched endlessly.</p><p>Dust filled the air.</p><p>The road itself had almost disappeared in places.</p><p>I asked a few truck drivers.</p><p>One of them said quietly,<br>“Brother, this may take days.”</p><p>For a moment,<br>I stood there.</p><p>Looking at that endless line<br>disappearing into darkness.</p><p>Strangely,<br>I didn’t panic.</p><h4 class="font-bold text-xl mt-6 mb-2">Adapting to the Road</h4><p>This… was real adventure.</p><p>Not the kind you imagine.<br>The kind you experience.</p><p>So I adapted.</p><p>Slowly.<br>Carefully.</p><p>I began navigating through small gaps between trucks.</p><p>Sometimes the path was barely wide enough.</p><p>Sometimes there was no proper road at all.</p><p>Dust everywhere.<br>Darkness all around.</p><p>But my bike moved steadily.</p><p>Every metre felt earned.</p><h4 class="font-bold text-xl mt-6 mb-2">Alone, But Not Alone</h4><p>Eventually,<br>I managed to cross that stretch.</p><p>But now another problem appeared.</p><p>No stays.<br>No proper towns.<br>And complete darkness.</p><p>It was around 7:30 PM.</p><p>I called my friend in Shillong.</p><p>He suggested continuing to Silchar —<br>another 45 kilometres.</p><p>I continued.</p><p>And that stretch…<br>was something else.</p><p>For almost 100+ kilometres,<br>the road felt isolated.</p><p>Empty.<br>Dark.</p><p>No proper lights.<br>No crowd.<br>No noise.</p><p>Just road.</p><p>And occasionally… people.</p><p>And that’s what stayed with me.</p><p>Every time I slowed down<br>or passed someone,<br>they noticed me.</p><p>A lone rider.<br>Covered in dust.<br>Riding through darkness.</p><p>Some waved.<br>Some nodded.<br>Some asked if everything was okay.</p><p>Few even stopped me just to check.</p><p>“Where are you going?”<br>“Be careful.”<br>“Road ahead is rough.”</p><p>They didn’t know me.</p><p>But they cared.</p><p>On that lonely road,<br>I wasn’t completely alone.</p><p>That human connection…<br>in the middle of isolation…<br>meant a lot.</p><h4 class="font-bold text-xl mt-6 mb-2">Reaching Safety</h4><p>Finally,<br>the road improved.</p><p>Lights appeared.</p><p>I entered Silchar.</p><p>Compared to what I had just crossed,<br>it felt like relief.</p><p>I found a budget stay.<br>Checked in.</p><p>Relief.</p><p>Later,<br>I met another traveller.</p><p>Within an hour,<br>we became friends.</p><p>We went out for dinner.</p><p>Simple food.<br>Easy conversation.</p><p>And after a long,<br>unpredictable day,<br>that normal moment felt comforting.</p><h4 class="font-bold text-xl mt-6 mb-2">The Nature of the Road</h4><p>Back in the room,<br>as I lay down,</p><p>I realised:</p><img src="images/chapter-21_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The day had started with warmth.<br>And ended with dust,<br>darkness,<br>and resilience.</p><p>But that is the nature of long journeys.</p><p>You leave comfort.</p><p>And the road reminds you —<br>nothing is guaranteed.</p><p>Except the experience.</p>', quote: '"Not every difficult moment is a problem. Sometimes it is the story."' },
        { type: 'chapter', id: 'ch22', title: 'When the Road Changed My Plan', chapter: 'Ch  22', stats: 'Serendipity', image: 'videos/chapter-22.mp4', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Day Begins Simply</h4><p>I woke up early again,<br>around 5 AM.</p><p>Silchar was still quiet.</p><p>I packed my luggage,<br>took a quick bath,<br>and prepared for the day’s ride.</p><p>My bike stood outside —<br>ready as always.</p><p>Before leaving,<br>I realised something important.</p><p>I was completely out of cash.</p><p>So after riding about 30–35 kilometres,<br>I stopped near an ATM<br>and withdrew some money.</p><p>Long-distance travel teaches you<br>to manage small practical things carefully —<br>fuel,<br>cash,<br>food,<br>rest.</p><p>Around 8:30 or 9 AM,<br>I stopped again.</p><p>I was hungry.</p><p>I found a small local place<br>and had breakfast.</p><h4 class="font-bold text-xl mt-6 mb-2">A Suggestion That Changed Everything</h4><p>While eating,<br>I began talking with a few local people.</p><p>One of them asked about my ride<br>and suggested something unexpected.</p><p>“Why don’t you go to Jampui Hills?”</p><p>My original plan was simple —<br>enter Tripura<br>and reach Agartala.</p><p>But travel rarely follows fixed plans.</p><p>The more they spoke about Jampui Hills —<br>the views,<br>the landscape,<br>the peaceful villages —</p><p>the more curious I became.</p><p>I decided to at least ride toward that side<br>and see what happened.</p><h4 class="font-bold text-xl mt-6 mb-2">Entering Tripura</h4><p>By around 11:30 AM,<br>I reached near Kanchanpur —<br>the gateway to Jampui Hills.</p><img src="images/chapter-22_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I met a few locals there.</p><p>One of them had worked in Bengaluru.</p><p>When he heard I was from Karnataka,<br>he immediately spoke in Kannada.</p><p>In the middle of Tripura,<br>hearing Kannada felt unexpected…<br>and comforting.</p><p>He encouraged me to go to Jampui Hills.</p><p>It was around 35 kilometres away.</p><p>I hesitated.</p><p>It was already 12:30 PM.</p><p>Finding a stay later could be difficult.</p><p>But another thought appeared.</p><p>If I don’t go now…<br>I might regret it.</p><p>So I went.</p><p>That decision made the day unforgettable.</p><h4 class="font-bold text-xl mt-6 mb-2">Climbing the Hills</h4><p>The road began to rise.</p><p>Green valleys opened slowly.</p><img src="images/chapter-22_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I stopped a few times —<br>just to look.</p><p>At one point,<br>I paused near a small roadside place.</p><p>A few girls were sitting nearby.</p><p>We spoke briefly.</p><p>Simple conversations.<br>Easy moments.</p><p>Further ahead,<br>a checkpost.</p><p>Police stopped me.</p><p>Document verification.</p><p>Routine.</p><p>But their reaction wasn’t routine.</p><p>“Oh my God,<br>you came all the way from there?”</p><p>They were surprised.</p><p>Encouraging.</p><p>One officer even told me<br>to share my journey with others.</p><p>That moment added energy.</p><p>Strangers…<br>becoming supporters.</p><h4 class="font-bold text-xl mt-6 mb-2">Flying Over Tripura</h4><p>Around 2 PM,<br>I reached Jampui Hills.</p><p>And something unexpected waited.</p><p>Paragliding.</p><p>Without thinking too much,<br>I decided to try.</p><p>And it became one of the most unforgettable moments.</p><p>I stayed in the air for nearly 30–45 minutes.</p><video src="videos/chapter-22.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Below me —<br>endless green hills.</p><p>Like an ocean.</p><p>Villages…<br>roads…<br>forests…</p><p>everything looked small.</p><p>For a moment,<br>everything disappeared.</p><p>No dust.<br>No fatigue.<br>No distance.</p><p>Only… freedom.</p><p>The landing wasn’t perfect.<br>Weight imbalance.</p><p>But the experience —<br>worth everything.</p><p>And then… something beautiful.</p><p>People gathered.</p><p>Some clapped.</p><p>Some came forward.</p><p>Curious.<br>Warm.</p><p>They asked about my ride.</p><p>When they heard my journey,<br>they smiled.</p><p>They said:</p><p>“We are happy you came.<br>Many don’t know how beautiful Tripura is.”</p><p>That stayed with me.</p><p>I wasn’t just passing through.</p><p>I felt welcomed.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unplanned Night</h4><p>After spending time there,<br>I explored nearby villages.</p><p>One of the cleanest villages in Tripura.</p><img src="images/chapter-22_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>But it was Saturday evening.</p><p>Weekend.</p><p>All stays were full.</p><p>For a moment,<br>worry appeared.</p><p>But again —<br>the road responded.</p><p>A local man understood my situation.</p><p>He offered a simple place.</p><p>Not a hotel.</p><p>Just a bed.</p><img src="images/chapter-22_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>But enough.</p><p>This journey was never about luxury.</p><p>It was about experience.</p><p>Later,<br>someone arranged food.</p><p>We ate together.</p><p>Spoke for a while.</p><p>Simple food.</p><p>Perfect taste.</p><h4 class="font-bold text-xl mt-6 mb-2">Listening to the Road</h4><p>That night,<br>lying in that small room,</p><p>I thought about the day.</p><p>A random breakfast conversation…<br>changed everything.</p><p>It gave me:</p><p>A new place.<br>New people.<br>A memory I’ll never forget.<br>And a lesson.</p><p>Sometimes,<br>the best parts of a journey<br>are not planned.</p><p>They happen…<br>when you listen to the road.</p><p>Outside,<br>my bike rested quietly.</p><p>After climbing the hills of Tripura.</p><p>Faithful.</p><p>Steady.</p><p>Somewhere along the journey,</p><p>he was no longer just a machine.</p><p>He had become my partner.</p><p>And with every kilometre,</p><p>I was falling in love —</p><p>with the road…<br>and with him…<br>all over again.</p>', quote: '"Sometimes the best parts of a journey are not planned. They happen when you listen to the road."' },
        { type: 'chapter', id: 'ch23', title: 'The Shortcut Through the Unknown', chapter: 'Ch  23', stats: 'Courage', image: 'images/chapter-23.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Quiet Beginning</h4><p>I woke up very early that morning, around 4:30 AM. The hills were still silent, and the air felt cold and calm.</p><p>I packed my bike carefully, tightened the luggage straps, and prepared for the day ahead.</p><p>Before leaving Jampui Hills, I wanted to witness one more sunrise. So I rode toward the viewpoint and waited.</p><p>Around 5:15 AM, the sky slowly began to glow. The sun rose gently over the hills, lighting the valleys of Tripura with a soft golden light. Only a few people were there, which made the moment even more special.</p><img src="images/chapter-23_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I stood quietly, absorbing the calmness.</p><h4 class="font-bold text-xl mt-6 mb-2">Choosing the Unknown</h4><p>After coming down around 5:30 AM, I met the person who had helped arrange my stay. We thanked each other, exchanged numbers, and spoke briefly.</p><p>Then it was time to leave. My next destination was Mizoram — Aizawl.</p><p>When I checked the route, there were two options: a longer but safer road of around 400+ kilometres, or a shorter 200-kilometre route through remote mountains.</p><p>The longer road meant comfort. The shorter road meant adventure.</p><p>I paused for a moment… and chose the shortcut.</p><h4 class="font-bold text-xl mt-6 mb-2">Losing the Map</h4><p>After riding a few kilometres, I reached a checkpost. My documents were verified, and I was allowed to proceed.</p><p>For the first few kilometres, Google Maps guided me. But after around 5 kilometres, it stopped.</p><p>No signal. No route. No guidance.</p><p>At that moment, I realised something clearly — from here, it was just me and the road.</p><p>Soon, the road itself began to disappear. What looked like a route on the map turned into a mountain trail — mud, broken paths, and narrow tracks.</p><p>I kept moving forward, following instinct.</p><h4 class="font-bold text-xl mt-6 mb-2">Through Isolation</h4><p>After some distance, I reached a small tribal village. A man approached me and asked questions in a slightly harsh tone. For a moment, I felt uncomfortable.</p><p>But I stayed calm, answered briefly, and continued.</p><p>Further ahead, I faced something even more challenging — a rusted iron bridge with holes in it, and a river flowing below.</p><p>I stopped, took a deep breath, and crossed it slowly, inch by inch.</p><p>The path became harder. Mountains on both sides. No proper road. No signboards. Complete isolation.</p><p>By around 7:30–8 AM, I had already covered nearly 50 kilometres.</p><p>I paused and asked myself — should I go back… or continue?</p><h4 class="font-bold text-xl mt-6 mb-2">Trusting the Ride</h4><p>Just then, I saw another rider ahead. That brought a sense of relief, and I followed him for some distance.</p><p>At one point, he stopped. I thought he needed a break, but he was drinking local alcohol and insisted I join. I politely refused, but he kept insisting.</p><p>The situation felt uncomfortable, so I decided to move ahead quickly. For a few kilometres, he followed me, which made me alert.</p><p>But then the road became tougher — steeper, more broken, more demanding.</p><p>And that’s when my bike showed its true strength.</p><p>Like an off-road machine, it handled everything — climbs, loose mud, rocks — with confidence.</p><p>Slowly, I gained distance.</p><p>In that moment, I trusted him completely. I felt proud… and deeply connected.</p><h4 class="font-bold text-xl mt-6 mb-2">Following Instinct</h4><p>At another point, I reached a junction with no signs, no map, and no people.</p><p>I paused for a moment, then followed instinct again.</p><p>It turned out to be the right decision.</p><p>After nearly 80–90 kilometres of such terrain, I finally reached a proper road.</p><p>It felt like victory.</p><p>But the journey was not over yet. The road still had broken patches and mud sections.</p><h4 class="font-bold text-xl mt-6 mb-2">Entering Mizoram</h4><p>Around 10:30 AM, I stopped for a short break. I had oranges my friend had given me and some biscuits. Simple food, but it felt like energy.</p><img src="images/chapter-23_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>After continuing further, I entered Mizoram.</p><p>The change was immediate — cleaner roads, greener hills, and a peaceful atmosphere.</p><p>The final stretch toward Aizawl felt smooth, almost luxurious compared to what I had just crossed.</p><p>I slowed down often, simply enjoying the views.</p><h4 class="font-bold text-xl mt-6 mb-2">Arrival in Aizawl</h4><p>Around 12:30 PM, I reached Aizawl.</p><img src="images/chapter-23_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The city felt quiet and different. It was Sunday, and because of Christmas holidays, almost everything was closed.</p><p>The stay I had booked was on an upper floor, and the staff were not very helpful. I had to carry my luggage upstairs myself.</p><p>Parking was another challenge. The owner suggested roadside parking, but I wasn’t comfortable leaving my bike like that in a new city.</p><p>Finally, I found a nearby parking space and paid extra to keep it safe.</p><p>For the next three days, that would be his resting place.</p><h4 class="font-bold text-xl mt-6 mb-2">A New Connection</h4><p>Inside, I met a traveller from Africa. We started talking and quickly became comfortable.</p><p>Since most restaurants were closed, I ordered pizza. A simple meal, but sharing it made it better.</p><p>Later, we stepped out and went to a viewpoint.</p><p>The sunset over Aizawl was breathtaking — houses glowing across the hills like scattered stars.</p><img src="images/chapter-23_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>For a moment, all the exhaustion disappeared.</p><p>We walked, talked, and returned around 9:30 PM.</p><p>I washed my dust-covered clothes and hung them outside.</p><p>Before sleeping, we spoke for a long time.</p><h4 class="font-bold text-xl mt-6 mb-2">The Meaning of Adventure</h4><p>That day had started with peace… and turned into one of the most intense rides of my journey.</p><p>As I lay down, one thought stayed with me:</p><p>Adventure is not comfort.</p><p>It is uncertainty.<br>It is instinct.<br>It is trust.</p><p>And when you keep moving forward… the road always rewards you.</p>', quote: '"Adventure isn’t always comfortable. Sometimes it is uncertainty. Sometimes it is fear."' },
        { type: 'chapter', id: 'ch24', title: 'A Quiet Day in Aizawl', chapter: 'Ch  24', stats: 'Stillness', image: 'videos/chapter-24.mp4', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Calm Beginning</h4><p>After the intense ride through the mountains the previous day, Day 24 felt calm from the moment I woke up.</p><p>I woke up early, as usual. The room was quiet, and the view from my stay was beautiful. When I stepped outside, the hills of Aizawl were still wrapped in early morning light. I stood there for a few minutes, watching the sunrise slowly appear between layers of houses and hills.</p><p>There was no hurry that morning. For the first time in many days, I had no plan.</p><h4 class="font-bold text-xl mt-6 mb-2">Morning at Bara Bazaar</h4><p>After taking a bath, I decided to walk toward Bara Bazaar, one of the most famous local markets in Aizawl. It was just a short distance from my stay.</p><p>What surprised me immediately was how early the city wakes up. By 5:30 or 6 AM, people were already active. Shops were opening, vendors were setting up their goods, and the streets were slowly coming alive.</p><p>I walked through the market lanes quietly, observing everything. The roadside food stalls smelled amazing, so I stopped for breakfast. The food was simple and incredibly affordable.</p><video src="videos/chapter-24_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>While exploring, I noticed many stalls selling second-hand clothes — something very common in the Northeast. The variety was surprising, and I picked up a couple of small things.</p><p>The atmosphere of the market felt lively, yet calm. People were friendly, polite, and curious.</p><p>By around 7:30 or 8 AM, I slowly made my way back to the stay.</p><h4 class="font-bold text-xl mt-6 mb-2">The City Without Chaos</h4><p>Later in the morning, I took my bike and rode to a nearby viewpoint.</p><p>The sky was cloudy, but the view was still breathtaking. Hills stretched endlessly in every direction, and houses seemed to grow naturally out of the slopes.</p><p>I parked my bike and walked to the viewpoint. Sitting there, listening to music and looking at the hills, I spent nearly half an hour doing nothing.</p><img src="images/chapter-24_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Sometimes travel is not about moving. Sometimes, it is about sitting still and absorbing where you are.</p><p>After that, I continued exploring the city. I visited the Solomon Temple, one of the well-known churches in Aizawl. Its architecture stood tall and peaceful against the hills.</p><img src="images/chapter-24_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I also visited a small museum and wandered through different parts of the city.</p><p>One thing stood out clearly — the discipline on the roads. There was almost no chaos. Even when the roads were empty, people still followed traffic rules.</p><p>No unnecessary honking. No reckless driving.</p><p>It reflected the mindset of the people.</p><h4 class="font-bold text-xl mt-6 mb-2">A Conversation in the Hills</h4><p>After spending most of the morning exploring, I returned to my stay. Later, I stepped out again to another viewpoint.</p><img src="images/chapter-24_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>While I was standing there, a man approached me and started a conversation. He was from Nepal.</p><p>Within minutes, we were talking about travel, life, and work. Interestingly, he told me he was living in Bangalore.</p><p>Just like that, we became friends.</p><p>Travel has a strange magic — strangers become familiar within minutes.</p><p>We exchanged numbers and promised to meet again someday.</p><h4 class="font-bold text-xl mt-6 mb-2">Work, Sunset, and Slow Evenings</h4><p>Around 1:30 PM, I returned to my stay and started working. By now, balancing travel and work had become part of my routine. I continued until around 4:30 PM.</p><p>In the evening, I had a simple plan — to watch the sunset again from the same viewpoint restaurant I had visited the previous day.</p><p>So I rode toward Aizawl Restaurant, known for its beautiful city views.</p><p>The sunset was just as stunning. The sun slowly dipped behind the mountains, and the city lights began to glow across the hills.</p><img src="images/chapter-24_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I sat there quietly for a while before heading back around 6:30 PM.</p><p>Back at the stay, I completed some remaining work. A new traveller had checked in, and we soon started talking. Before long, we decided to step out for dinner together.</p><p>We walked toward Bara Bazaar again. The streets were calm, and we had simple food — samosas and local snacks.</p><p>Nothing elaborate. But the conversation and the peaceful night made it memorable.</p><h4 class="font-bold text-xl mt-6 mb-2">A Simple, Meaningful Day</h4><p>After returning to the stay, we planned for the next day. The plan was exciting — an early morning ride to Reiek Village and a sunrise point.</p><p>With that in mind, we went to sleep.</p><p>Day 24 had been simple. No long rides. No major adventure. Just a quiet city, beautiful views, and meaningful conversations.</p><p>And sometimes, those are the days that help you understand a place the most.</p>', quote: '"Sometimes travel is not about moving. Sometimes it is about sitting still and absorbing where you are."' },
        { type: 'chapter', id: 'ch25', title: 'Sunrise at Reiek and the Day of Small Tests', chapter: 'Ch  25', stats: 'Preparedness', image: 'images/chapter-25.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">An Unusually Early Start</h4><p>The day began unusually early. I woke up at 2:30 AM.</p><p>The plan was to reach Reiek Village and Reiek Peak before sunrise. The traveller I had met the previous day — from Prayagraj, Uttar Pradesh — had agreed to join me.</p><p>By 3 AM, we walked down to the parking area. I unlocked my bike and did my usual checks before starting the ride.</p><p>That’s when I realised something unexpected — I had forgotten to refuel.</p><p>Since I had stayed in Aizawl for two days without riding much, it had slipped my mind. The ride ahead was around 35–40 kilometres, with steep and winding roads.</p><p>Still, I decided to go ahead. I hoped we might find a petrol pump on the way. If not, we would handle it somehow.</p><p>So we started the ride.</p><h4 class="font-bold text-xl mt-6 mb-2">When the Map Fails</h4><p>I mounted my phone and started navigation. But after 4–5 kilometres, something felt wrong.</p><p>Google Maps led us into a very narrow road — a steep downhill path filled with loose stones. Riding there was already difficult, but after a few more kilometres, it became clear that this wasn’t even a proper road.</p><p>It was just a trail through bushes.<br>No houses. No lights. No network.</p><p>We stopped.</p><p>The other traveller looked at me and said, “Maybe we should go back.”</p><p>He was right.</p><p>We carefully turned around and returned to the main road. Around 3:30 AM, we asked a local person for directions, and he pointed us toward the correct route.</p><p>That moment reminded me of something important — in the Northeast, sometimes people are more reliable than maps.</p><h4 class="font-bold text-xl mt-6 mb-2">Climbing Toward Reiek</h4><p>The road to Reiek was steep and narrow. Riding double on those sharp climbs wasn’t easy, and the engine started heating up.</p><p>By around 4:45 AM, we reached the base parking area. From there, the peak was still about 6 kilometres away.</p><p>Usually, people take a taxi to the trekking point and then walk the remaining distance. Finding a vehicle at that hour wasn’t easy, but luckily one driver agreed to take us along with a few others.</p><p>From the drop point, we began walking.</p><h4 class="font-bold text-xl mt-6 mb-2">Chasing the Sunrise</h4><p>We had some biscuits and continued the trek.</p><p>By around 5:20–5:30 AM, we reached the peak. The air was cold and fresh, and the view was breathtaking — endless layers of hills stretching across Mizoram.</p><p>At 5:45 AM, the sun slowly rose above the mountains. The sky turned golden, and the clouds beneath the hills began to glow.</p><img src="images/chapter-25_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>It was one of those rare moments where everyone falls silent. No words — just the wind and the quiet presence of nature.</p><p>We spent nearly an hour there, taking photographs and exploring nearby viewpoints.</p><p>Standing there, I felt grateful for the effort it took to reach that moment.</p><img src="images/chapter-25_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Some experiences only exist for those who wake up early enough to chase them.</p><img src="images/chapter-25_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Fuel and a Small Detour</h4><p>Getting a vehicle back wasn’t easy either, as most jeeps had already left. Eventually, we paid a bit extra and found a ride back to the base.</p><p>We had tea and aloo paratha for breakfast.</p><p>Then reality returned — my bike still had very little fuel.</p><p>There were no petrol pumps nearby, but thankfully, a local person helped us arrange petrol in a plastic bottle. We bought around ₹200 worth, filled the tank, and finally felt relieved.</p><p>After that, we visited a nearby waterfall and spent some peaceful time there.</p><video src="videos/chapter-25_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><h4 class="font-bold text-xl mt-6 mb-2">A Mechanical Concern</h4><p>But another issue appeared. Due to the steep climbs and engine heat, I noticed a slight oil leak.</p><p>I suspected it might be an oil seal or gasket issue.</p><p>Back in Aizawl, I searched for a service centre, but most workshops were closed due to the holiday season. Some places required appointments days in advance, which wasn’t possible for me.</p><p>So I called a mechanic I know from Nanjangud and sent him pictures.</p><p>He reassured me.</p><p>“You can ride another 200–300 kilometres safely. Just top up the oil and replace the seal when possible.”</p><p>That gave me relief.</p><p>I topped up around 200 ml of engine oil and returned to my stay.</p><h4 class="font-bold text-xl mt-6 mb-2">Evening Connections</h4><p>By around 2 PM, I resumed my routine and worked for a few hours.</p><p>In the evening, I rode again to the viewpoint restaurant to watch the sunset.</p><p>While returning, two riders approached me after noticing my number plate. They were from Tamil Nadu.</p><p>Within minutes, we realised we were on similar journeys across the Northeast.</p><p>We spoke for nearly 30 minutes, sharing experiences, routes, and stories.</p><p>Meeting fellow riders on the road always feels special.</p><p>Eventually, we said goodbye. I had dinner and returned to my stay.</p><h4 class="font-bold text-xl mt-6 mb-2">Preparing to Move Again</h4><p>Since I was leaving early the next morning, I packed everything that night. The traveller staying with me helped organise the luggage.</p><p>We kept everything ready near the door to make the morning easier.</p><p>After a long day that had started at 2:30 AM, I finally lay down around 9:30 PM.</p><p>The next morning would bring another long ride.</p><p>And the road, as always, was waiting.</p>', quote: '"Some moments can only be experienced if you chase them."' },
        { type: 'chapter', id: 'ch26', title: 'The Day a Stranger Changed My Route', chapter: 'Ch  26', stats: 'Guidance', image: 'images/chapter-26.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Ride That Looked Easy</h4><p>I woke up early that morning. The plan for the day was simple — ride from Aizawl to Silchar, around 260 kilometres.</p><p>It looked manageable. But the estimated time was nearly seven hours, which meant one thing — the road would not be easy.</p><p>After checking my bike once again, I said goodbye to the traveller who had shared the room with me. We wished each other safe journeys, and I started riding.</p><p>The morning air in Mizoram was fresh and cool, and the road twisted beautifully through the hills.</p><p>At one point, I saw a soft sunrise glowing through the fog. I stopped for a few minutes, just to watch it.</p><img src="images/chapter-26_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Moments like that make long journeys worth it.</p><img src="images/chapter-26_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Kindness at the Border</h4><p>By around 8 AM, I reached the Mizoram–Assam border. There was a small tea stall there, so I stopped for a break. The engine had heated slightly during the descent.</p><p>The stall was run by a young girl and her family. They spoke kindly and shared information about the road ahead.</p><p>I had biscuits and tea.</p><p>When I asked for the bill, they refused.</p><p>“You are travelling alone. It’s okay,” they said.</p><p>That moment stayed with me.</p><h4 class="font-bold text-xl mt-6 mb-2">The Forest Road</h4><p>From there, I had two route options, both similar in time. A local suggested a forest route, and I trusted him.</p><p>Soon, I realised what that meant.</p><p>The road was rough — dust, loose stones, and broken surfaces. At many places, I could only ride at 10–20 km/h.</p><p>There was no network, no shops, and almost no vehicles. The stretch felt completely isolated.</p><p>For nearly 50 kilometres, the road remained like that. That section alone took almost two hours.</p><p>The engine heated multiple times. I had to stop, rest, and then continue.</p><p>At one point, I simply sat by the roadside with biscuits in my hand, catching my breath.</p><h4 class="font-bold text-xl mt-6 mb-2">A Place That Felt Like Home</h4><p>Finally, around 12:30 PM, I reached near Silchar and went directly to my pre-booked stay.</p><p>The place was surprisingly beautiful and comfortable. The owner welcomed me warmly and immediately showed me a safe place to park my bike.</p><p>After parking, the first thing he asked was, “Did you eat?”</p><p>I said no.</p><p>Without hesitation, he went inside and prepared food for me himself — hot chicken and rice.</p><p>He didn’t treat me like a customer. He treated me like someone who had just come home after a long journey.</p><p>That kind of care is rare.</p><p>After freshening up, I sat down to eat. Every bite felt like relief.</p><p>Later, we spoke for a long time. He asked about my journey, encouraged me, and shared his own experiences.</p><p>Other travellers staying there joined us, and the conversations naturally flowed — about travel, life, struggles, and choices.</p><p>That place didn’t feel like a stay. It felt like a space filled with good people.</p><img src="images/chapter-26_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Learning to Carry Less</h4><p>Later in the afternoon, I went for a short walk.</p><p>And somewhere during that walk, I realised something important.</p><p>The more I travel, the less I need.</p><p>When I started the journey, I carried many things — extra clothes, extra items, things I thought I might need.</p><p>But slowly, the road taught me something simple:</p><p>Life becomes easier when you carry less.</p><p>Less weight.<br>Less clutter.<br>Less dependency.</p><p>That thought stayed with me.</p><p>Later that evening, I sent some unnecessary items back home. I didn’t need them anymore.</p><p>Travel had simplified me.</p><h4 class="font-bold text-xl mt-6 mb-2">A Decision That Changed the Route</h4><p>In the evening, I sat again with the travellers and shared my plan for the next day — riding to Imphal.</p><p>On the map, it looked easy. Around 200 kilometres.</p><p>But one traveller stopped me and explained the reality.</p><p>The journey could take 11–14 hours.<br>No petrol pumps.<br>No food.<br>No proper villages.</p><p>Some sections weren’t even proper roads.</p><p>The more he explained, the more serious it felt. Some parts were honestly frightening.</p><p>In that moment, I realised something clearly:</p><p>If I had taken that road blindly, I could have faced serious trouble.</p><p>I felt grateful.</p><p>Those people were not just travellers. They were guidance sent by the road.</p><p>So I made a decision.</p><p>I changed my plan.</p><p>Instead of heading to Manipur, I would ride toward Nagaland — Kohima.</p><p>Longer.<br>But safer.</p><p>Sometimes changing plans is not weakness.<br>It is wisdom.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet Ending</h4><img src="images/chapter-26_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Later that night, one of the travellers picked up a guitar and started singing.</p><p>The atmosphere became calm and peaceful.</p><p>After such a long and difficult day, that moment felt like a pause.</p><p>I stepped outside, checked my bike again, lubricated the chain, and packed everything for the next morning.</p><p>I thanked everyone there.</p><p>And as I lay down to sleep, one thought stayed with me:</p><p>Sometimes the road protects you… through the people you meet.</p><p>And that night in Silchar was one of those moments.</p>', quote: '"Sometimes changing plans is not weakness. It is wisdom."' },
        { type: 'chapter', id: 'ch27', title: 'A New Year on the Road', chapter: 'Ch  27', stats: 'Endurance', image: 'images/chapter-27.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">The First Ride of the Year</h4><p>It was the first day of the year.<br>1 January 2026.</p><p>I woke up early, around 4:30 AM in Silchar.<br>The air was cold. Silent.</p><p>I freshened up, wore my riding gear, and carried my luggage downstairs.</p><p>The previous night, I had already informed the stay owner about my early departure.<br>When I called him, he came down within minutes and opened the gate.</p><p>Before leaving, I thanked him again.<br>For the food. For the care. For the unexpected kindness.</p><p>We exchanged a warm goodbye.<br>I gave him a hug.</p><p>Then I started the bike.<br>And the road called again.</p><h4 class="font-bold text-xl mt-6 mb-2">Riding into the Unknown</h4><p>The morning was covered in dense fog.<br>Visibility was low.</p><p>The cold wind cut through my riding gear.<br>I rode slowly — around 40–50 km/h.</p><video src="videos/chapter-27_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>The road, at first, was decent.</p><p>Around 6 AM, I stopped at a small tea stall.<br>Hot tea in that cold fog felt perfect.</p><p>A small pause.<br>Then I continued.</p><h4 class="font-bold text-xl mt-6 mb-2">When the Road Turns Harsh</h4><p>Soon, everything changed.</p><p>The smooth road disappeared.<br>What followed was one of the worst stretches I had encountered.</p><p>Heavy trucks passed constantly.<br>The road was filled with thick dust — almost two feet deep in places.</p><p>Every time a truck crossed, a cloud of dust swallowed everything.</p><p>Within seconds, my visor became useless.<br>I had to stop repeatedly…<br>Clean it…<br>Ride again.</p><p>Dust entered everywhere.<br>Jacket.<br>Gloves.<br>Helmet.</p><p>But through all of it… the bike kept moving.</p><p>No complaints.<br>No hesitation.</p><p>Just steady effort.</p><p>Every bump.<br>Every rocky stretch.<br>Every uneven climb.</p><p>He carried me forward — like a silent companion.</p><p>At one point, I stopped to clean my helmet… and accidentally dropped it.<br>It cracked slightly.</p><p>Later, it slipped again.<br>The damage worsened.</p><p>There were no shops.<br>No solutions.</p><p>Only acceptance.</p><p>And the ride continued.</p><h4 class="font-bold text-xl mt-6 mb-2">A Pause by the Water</h4><p>After hours of slow riding, around 12:30 PM, I reached a small stretch where water flowed beside the road.</p><p>I stopped.</p><p>Had lunch.<br>Sat quietly.</p><p>A few locals nearby spoke to me.<br>Asked about the journey.<br>Shared road updates.</p><p>That break didn’t just rest my body.<br>It reset my mind.</p><h4 class="font-bold text-xl mt-6 mb-2">Crossing into Nagaland</h4><p>Around 1:30 PM, I reached the Nagaland checkpost.</p><img src="images/chapter-27_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I stopped to ask about the Inner Line Permit.</p><p>The officers were kind.<br>Polite.</p><p>After hearing about my journey, they smiled and said:</p><p>“No need to take it now. Just tell them you are exploring Nagaland.”</p><p>That simple gesture saved time.<br>And gave confidence.</p><p>I thanked them.<br>And continued.</p><h4 class="font-bold text-xl mt-6 mb-2">The Final Stretch</h4><p>A little ahead, I met another traveller.<br>We spoke briefly.<br>Took a few photos.</p><img src="images/chapter-27_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Then I continued toward Kohima.</p><p>The last 70 kilometres felt different.<br>The roads improved.<br>The hills opened up.</p><p>After the dust and struggle…<br>this stretch felt like relief.</p><p>By around 3:30–4 PM, I reached Kohima.</p><img src="images/chapter-27_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><img src="images/chapter-27_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Familiar Voices in a Distant Place</h4><p>I checked into my hostel.</p><p>And then something unexpected happened.</p><p>I heard Kannada.</p><p>After nearly 26 days of travelling, hearing my own language felt grounding.</p><p>They were from Karnataka.</p><p>Within minutes, we connected.</p><p>Far from home…<br>It felt like meeting family.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet New Year Night</h4><p>It was New Year’s Day.<br>But the city was quiet.</p><p>Most places were closed.</p><p>Finding food became a small journey in itself.</p><p>First, tea and samosas.<br>Then a search.</p><p>Finally, one restaurant owner opened his kitchen just for us.<br>Prepared food.<br>Served with kindness.</p><p>That gesture meant more than the meal.</p><p>After dinner, we returned to the hostel.<br>Sat together.<br>Talked about roads, travel, life.</p><p>Around 9:30 PM, exhaustion caught up with me.</p><p>It had been a long day.<br>Fog.<br>Dust.<br>Broken roads.<br>Uncertainty.</p><p>But also… progress.</p><p>Another state.<br>Another story.<br>Another lesson.</p><p>Outside, my bike stood quietly.<br>Dust-covered.<br>Tired.<br>But ready.</p><p>And so was I.</p>', quote: '"The road doesn’t test your strength… it reveals how far your endurance can go."' },
        { type: 'chapter', id: 'ch28', title: 'Trust, Culture, and Quiet Roads', chapter: 'Ch  28', stats: 'Perspective', image: 'images/chapter-28.jpg', desc: '<h4 class="font-bold text-xl mt-6 mb-2">A Slower Morning</h4><p>After many days of waking up at 4:30 AM, Day 28 felt different.<br>That morning I woke up a little late, around 6:30 AM.</p><p>From my hostel window I could see the hills of Kohima slowly waking up. The sky was clear, and the sunrise was beautiful, spreading soft light across the valley.</p><p>I stood there quietly for a few minutes, just watching the morning unfold.</p><p>By that time, my new friends Spoorti and Shiva had already left. They had been staying there for almost five days and had an early flight to catch, so they had left the hostel around 3:30 AM.</p><p>The hostel felt a little empty after they left.<br>After getting ready, I decided to go out and explore the city.</p><img src="images/chapter-28_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">The Local Market</h4><p>My first stop was the local market in Kohima.<br>It was unlike any market I had seen before.</p><p>There were small stalls selling things I had never seen in other markets — different kinds of vegetables, fruits, and even animals that are traditionally consumed in the region.</p><img src="images/chapter-28-1.jpg" alt="Kohima Market" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>For someone coming from the south of India, it felt completely different.<br>The market showed how unique Naga culture and food habits are.</p><p>I spent some time walking through the lanes, observing people and taking photographs.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unpleasant Encounter</h4><p>Later I rode toward a nearby village area.<br>While taking some pictures, a man suddenly approached me.</p><p>He looked drunk and was very rude. He began questioning me aggressively — asking why I was taking pictures and demanding money.<br>He even tried to touch my camera and my bag.</p><p>For a moment I felt uncomfortable and slightly scared.<br>I tried to stay calm, spoke politely, and slowly moved away from the situation.</p><p>Finally I managed to leave that place.<br>The incident left me feeling a little disturbed.</p><p>But after going further, I met a local girl who explained something important.<br>She told me that some outsiders had misused photographs and videos of villages by posting them online without permission, bringing unnecessary crowds and disturbance.</p><p>Because of that, a few locals had become sensitive about cameras.<br>Her explanation helped me understand the situation better.</p><p>Sometimes travel teaches you to see beyond a single moment.</p><h4 class="font-bold text-xl mt-6 mb-2">A Shop Built on Trust</h4><p>Soon after, I saw something that completely changed my mood.<br>I found a small self-service shop by the roadside.</p><p>There was no shopkeeper.<br>Just shelves with items — snacks, drinks, and small goods.<br>A board explained the system:<br>You simply take what you need and pay through UPI or leave cash in the box.</p><img src="images/chapter-28-0.jpg" alt="self payment shop" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The entire shop functioned purely on trust.<br>Standing there, I felt amazed.</p><p>In a world where people worry about theft and security, here was a place where an entire shop was built on honesty.<br>That moment reminded me of something simple:<br>Trust creates trust.</p><p>If we respect people, their culture, and their way of life, we usually receive the same respect in return.</p><h4 class="font-bold text-xl mt-6 mb-2">The Clean Villages of Nagaland</h4><p>From there I rode toward Khonoma Village and the Naga Heritage Village.<br>The villages in Nagaland surprised me.</p><img src="images/chapter-28-2.jpg" alt="Khonoma Village" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>They did not feel like ordinary villages.<br>They were incredibly clean and well maintained.</p><p>Everywhere I looked there were bamboo dustbins instead of plastic.<br>The roads were spotless.<br>There was almost no noise, no unnecessary traffic, no litter.<br>It felt peaceful.</p><p>While exploring the Naga Heritage Village, I met a couple who kindly helped me take some photographs. They also explained the importance of the place and told me about the Hornbill Festival.</p><p>Before leaving, I also met a few students who were curious about my ride. When they heard about the distance I had travelled, they seemed inspired and encouraged me warmly.</p><img src="images/chapter-28_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Moments like these make solo travel special.</p><h4 class="font-bold text-xl mt-6 mb-2">Taking Care of My Companion</h4><p>By around 3:30 PM, I returned to Kohima.<br>Before going back to the hostel, I stopped at a shop to buy a few locks and fittings for my bike.</p><p>After all the kilometres we had travelled together, I felt responsible for taking care of it.<br>That bike had carried me across mountains, dust, broken roads, and long distances.<br>Protecting it felt important.</p><h4 class="font-bold text-xl mt-6 mb-2">A Cold Evening in Kohima</h4><p>Back at the hostel, the place felt unusually quiet.<br>Most travellers had left after the holidays.</p><p>By evening, the temperature dropped to around 5–6 degrees.<br>In Kohima, most restaurants close early.</p><p>Remembering the struggle for food the previous night, I ordered dinner early.<br>Around 7 PM, I sat outside the hostel with my food.</p><p>The air was extremely cold.<br>But the silence felt peaceful.</p><p>After dinner, I went for a short walk — bought medicine, water, and a few essentials.</p><p>And somewhere in that quiet evening… a new plan began to form.<br>Dzukou Valley.</p><p>Before sleeping, I spoke with the hostel owner and gathered details about the trek.</p><p>Around 8:30 PM, I returned to the hostel.<br>The hills were still.<br>The night was silent.</p><img src="images/chapter-28_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>And outside, my bike rested quietly.</p><p>Tomorrow would not be about riding.<br>It would be about something else entirely.</p>', quote: '"The road taught me something simple that day… respect the place, and it will reveal itself to you."' },
        { type: 'chapter', id: 'ch29', title: 'The Valley That Tested Me', chapter: 'Ch  29', stats: 'Courage', image: 'images/chapter-29.jpg', desc: '<p>That morning I woke up around 6 or 6:30 AM in Kohima.<br>It was Saturday, and the morning felt slow and peaceful.</p><p>But one thought kept returning again and again.<br>Dzukou Valley.</p><img src="images/chapter-29_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I had come all the way to Nagaland, and Dzukou Valley is known as one of the most beautiful valleys in Northeast India. Yet I hesitated.</p><p>The trek was long — almost 30+ kilometres round trip — and I would be doing it solo in extremely cold conditions.</p><p>For a moment I wondered if I should skip it.<br>I stepped outside the hostel for a short walk, just ten minutes to clear my mind.</p><p>When I returned, the answer had already formed inside me.<br>If I came this far, I cannot miss this.</p><p>A guy in the hostel had initially said he would join me.<br>But after making me wait almost an hour, he finally told me he wasn’t feeling well and wouldn’t be coming.</p><p>For a moment I thought about cancelling the trek.<br>But something inside pushed me forward.</p><p>Instead of taking my bike to the trailhead at Viswema village, I decided to go by shared taxis.</p><p>So I took a small taxi for ₹20 to the bus stand and then another shared taxi to Viswema for ₹90.</p><video src="videos/chapter-29_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>While travelling in the shared taxi, I met a beautiful group of travellers.<br>They were happy listening to my solo journey and they wished me well.</p><p>I reached around 10 AM, had breakfast, and bought some snacks and water for the trek.</p><p>Since I had done a few treks in Karnataka, I knew carrying more load is not a good idea.<br>So I carried only a 10-litre bag.<br>Inside it — snacks, my camera stick, and a power bank.<br>Nothing much.</p><p>From Viswema, taxis usually charge ₹1500–₹2500 to reach the trekking base.<br>Since I was alone, I decided to wait.</p><p>After about 20–30 minutes, a group of travellers from Assam arrived.<br>I asked if I could join them.<br>They welcomed me immediately.</p><video src="videos/chapter-29_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>Trust me, those guys were very kind.<br>They joined me, listened to my story, and were happy about my journey.</p><img src="images/chapter-29_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Within ₹250, I reached the trekking base.</p><img src="images/chapter-29_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The trek began from the checkpost.<br>After paying the entry fee, I started walking into the forest.</p><p>Soon I met Joseph, a local guide who had been hired by a trekker from Kerala.<br>We started talking, and the conversation flowed easily.</p><p>Even though I had come alone, I never felt alone.<br>Everyone slowly became part of the journey.</p><p>As I walked deeper, something changed inside me.</p><p>I felt light.<br>I don’t know how to express it, but I was happy.</p><p>No baggage of the past.<br>No load of the future.</p><p>I was just living in the present moment.<br>Enjoying life fully.</p><img src="images/chapter-29_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Since I was all alone, I captured my photos myself.<br>I did some funny clicks, tried different poses, and enjoyed doing it alone.</p><img src="images/chapter-29_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The path moved through thick forests and open ridges.<br>Walking alone felt peaceful.</p><video src="videos/chapter-29_2.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>By afternoon I reached the Dzukou base camp.</p><p>The tents were charging around ₹1000 per person.<br>After speaking to others, I managed to stay for ₹200 by sharing.</p><p>Before evening I walked to the sunset viewpoint.<br>The sky slowly turned orange as the sun disappeared behind the hills.</p><p>The view was breathtaking.</p><img src="images/chapter-29_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I kept my bag aside and went ahead to enjoy the sunset.<br>When I returned, rats had eaten all my snacks.</p><p>For a moment I laughed.<br>Even the valley had joined my journey.</p><p>After sunset, I returned.</p><p>A guide I met on the way shared food with me.<br>I also had what I had carried from home.</p><p>See how beautiful life is — when you come alone, people join you.<br>They help you.<br>They guide you.</p><p>By 5:30 PM, darkness arrived quickly.<br>The temperature dropped to around –4°C.</p><p>A bonfire was lit.<br>People gathered.</p><img src="images/chapter-29_6.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>People from different states sat together — Mumbai, Delhi, Assam, Kerala, Uttarakhand.</p><p>I had arrived alone.<br>But I didn’t feel like a solo traveller anymore.</p><p>The cold was intense — almost unbearable.<br>Seeing my situation, Joseph and a trekker from Kerala understood immediately.<br>Without saying much, they shared a blanket with me.</p><p>Sleep was difficult.</p><p>One of my phones died due to cold.</p><p>But I kept thinking about the next morning.<br>The sunrise.<br>The valley.<br>The moments.</p><p>I slept only for short moments.<br>But I didn’t regret it.</p><p>Because some nights are not meant for sleep.<br>They are meant to become stories.</p><p>And that freezing night in Dzukou Valley was one of those stories.</p>', quote: '"The hardest journeys don’t test your body… they reveal your courage."' },
        { type: 'chapter', id: 'ch30', title: 'The Morning That Proved Everything', chapter: 'Ch  30', stats: 'Endurance', image: 'images/chapter-30.jpg', desc: '<p>The night before had been brutal.<br>The temperature had dropped to around –4°C, and sleep was almost impossible. Even with the blanket that the Kerala guy had shared with me, the cold kept waking me up again and again.</p><p>In total, I might have slept barely one hour.</p><p>By 4:30 AM, I gave up trying to sleep.<br>I stepped outside.<br>The cold hit instantly.</p><img src="images/chapter-30_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Without a mask, cap, and gloves, it was almost impossible to stand there. My breath turned into white mist, and the air felt sharp against my skin.</p><p>The water bottle I had kept beside me had become ice cold.<br>Somehow I drank a few sips.</p><p>At 5 AM, I started walking toward the main Dzukou Valley, which was still about 3 kilometres away from the base camp.</p><img src="images/chapter-30_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Walking Into the Freezing Morning</h4><p>The trek was harder than I expected.<br>My body was already tired from the previous day’s trek, and with almost no sleep, walking again in freezing temperatures felt like another challenge.</p><p>Luckily, the Kerala traveller joined me.<br>Two other trekkers from Tripura also decided to walk with us.</p><video src="videos/chapter-30_0.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>We moved slowly through the dark trails toward the valley.<br>Our first stop was the emergency helipad point, where the valley slowly opened before us.</p><p>Even in the early light, the view was breathtaking.<br>Rolling hills stretched endlessly.<br>The valley looked peaceful and untouched.</p><h4 class="font-bold text-xl mt-6 mb-2">When the Cold Tested Me</h4><p>But the cold became stronger as we continued.<br>Within the first kilometre, my hands started going numb.<br>My face and beard were slowly filling with tiny crystals of ice.</p><img src="images/chapter-30_5.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>For a moment, I almost stopped.<br>I told myself:<br>"Maybe this is enough."</p><p>But something inside refused to quit.<br>We continued walking.</p><p>Soon we reached a frozen river.<br>The entire stream had turned into ice.<br>It was around 6 AM.</p><p>I stood there for a few minutes, looking at the frozen landscape and clicking a few photos.</p><img src="images/chapter-30_2.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>That moment brought a strange realization.<br>When I started this journey from Mysuru, I wasn’t even sure if I could complete it.<br>But now I was standing here, trekking in –4°C, deep inside a valley in Nagaland.</p><p>I smiled quietly.<br>Everything is possible with time and patience.</p><h4 class="font-bold text-xl mt-6 mb-2">The Final Push</h4><p>The two trekkers from Tripura decided to return from that point.<br>But I continued.</p><p>There were still another two kilometres to the main peak.<br>The cold was intense.<br>My fingers felt like they were losing their strength.<br>My beard had frozen.</p><video src="videos/chapter-30_1.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>The path was silent.<br>But step by step, slowly, I kept moving.</p><p>Sometimes courage is not loud.<br>Sometimes it is just taking the next step.</p><h4 class="font-bold text-xl mt-6 mb-2">The First One to Reach</h4><p>At around 7:15 AM, I finally reached the highest point of the valley.<br>And something unexpected happened.</p><p>I was the first person to reach there that morning.<br>For a few seconds, I simply stood there.<br>Breathing.<br>Looking at the valley below.</p><img src="images/chapter-30_6.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>I couldn’t believe it.<br>One of my long-time dreams had quietly become real.<br>I had reached Dzukou Valley’s peak.</p><p>Not with a group.<br>Not with a guide.<br>But on my own strength.</p><video src="videos/chapter-30_2.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>It wasn’t easy.<br>It wasn’t comfortable.<br>But it was worth everything.</p><h4 class="font-bold text-xl mt-6 mb-2">Waiting for the Sun</h4><p>Even after reaching the peak, the sun had not risen yet.<br>The cold was still extreme.<br>I stood there waiting.</p><p>Slowly the sky began to glow.<br>After about 30 minutes, sunlight finally touched the valley.</p><img src="images/chapter-30_3.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>The ice on the leaves began melting.<br>Tiny drops of water started falling from the frozen plants.<br>The valley slowly woke up.</p><p>That moment felt magical.</p><h4 class="font-bold text-xl mt-6 mb-2">The Walk Back</h4><video src="videos/chapter-30_3.mp4" autoplay loop muted playsinline class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"></video><p>After spending some quiet time at the top, I started walking back.<br>On the way down, I met a few trekkers who had stopped midway because of the cold.<br>We sat together for a while, shared some snacks, clicked photos, and spoke about the trek.</p><img src="images/chapter-30_4.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>Then I continued walking back to the base camp.</p><p>While I started back, trust me — the valley was not ready to send me back.<br>I don’t know what connection I had with that place, but we were so connected and in sync.<br>It felt like a lifetime experience.</p><p>When I reached there, I had hot tea, eggs, and biscuits.<br>That simple meal felt like a luxury after the freezing morning.</p><p>By around 12 PM, I had reached the base camp.<br>After resting for a while, I had to start again — this time alone.<br>I started trekking solo toward the checkpost from where we get taxis.</p><h4 class="font-bold text-xl mt-6 mb-2">The Solo Descent</h4><p>Soon it was time to leave.<br>Some trekkers had already left early.<br>Others were still exploring the valley.</p><p>So I started the descent alone.<br>And strangely, I enjoyed it.</p><p>Walking down through the forests alone felt peaceful.<br>I took many breaks.<br>Captured photos.<br>Sat quietly in a few places.</p><p>Sometimes the best part of trekking is not the peak.<br>It is the journey back, when everything feels calm.</p><h4 class="font-bold text-xl mt-6 mb-2">The Unexpected Struggle</h4><p>By afternoon I reached the checkpost.<br>From there I reached Viswema village.</p><p>But now the real challenge began.<br>It was Sunday.</p><p>There were no taxis on the road.<br>I waited nearly two hours.<br>Nothing came.</p><p>In that situation, I didn’t panic.<br>I felt like this was also part of my experience.<br>The journey was still continuing.</p><p>Finally around 5 PM, I requested a local travel guide nearby.<br>He helped arrange a taxi to Kohima.</p><p>But it had to be a full hire, so I had to pay extra.<br>At that moment, it didn’t matter.<br>I just wanted to reach the hostel.</p><h4 class="font-bold text-xl mt-6 mb-2">A Quiet End to a Powerful Day</h4><p>I finally reached my hostel around 6 PM.<br>I took a hot bath.<br>Ordered food.<br>Had dinner quietly.</p><p>After speaking with the hostel owner for some time, I went to bed very early.<br>My body was exhausted.<br>But my mind was peaceful.</p><h4 class="font-bold text-xl mt-6 mb-2">What the Valley Gave Me</h4><p>I had started the trek alone.<br>But by the time I returned, I had spoken to almost everyone who came to the base camp.</p><p>Strangers had become friends.<br>Joseph, the Kerala guy, the Tripura trekkers, and many others had all become part of the story.</p><p>Even today, I am still in touch with the Kerala traveller who walked with me that morning.</p><h4 class="font-bold text-xl mt-6 mb-2">An Unforgettable Memory</h4><p>Every step of that trek created a memory.<br>Every moment in the cold valley taught me something.</p><p>Dzukou Valley was not just a destination.<br>It was a test of patience.<br>Of endurance.<br>Of belief.</p><p>And it gave me something I will carry for the rest of my life.<br>An unforgettable moment.</p>', quote: '“In the coldest morning, with almost nothing left… I discovered how far I can still go.”' },
        { type: 'chapter', id: 'ch31', title: 'A Quiet Day in Kohima', chapter: 'Ch  31', stats: 'Reset', image: 'images/chapter-31.jpg', desc: '<p>Rest, Friendship, and Preparation</p><p>After the intense experience of Dzukou Valley, Day 31 began gently.<br>I woke up around 6 AM and stepped outside the hostel.</p><p>The morning sky over Kohima was glowing softly.<br>The sun slowly rose over the hills, lighting the city in golden colours.<br>After the freezing night in Dzukou Valley and the long trek the previous day, standing there quietly and watching the sunrise felt peaceful.</p><p>Some mornings don’t need anything else.<br>Just silence and sunlight.</p><h4 class="font-bold text-xl mt-6 mb-2">Taking Care of Things That Matter</h4><p>That morning became a small reset day for me.<br>I washed all my clothes that had become dusty during the trek.</p><p>Then I spent time with my bike.<br>After so many difficult roads, dust, and mountain trails, it deserved some care.</p><p>I cleaned it thoroughly, checked everything carefully, and lubed the chain properly.<br>It felt satisfying to see it shining again.</p><p>My bike had carried me across thousands of kilometres.<br>Taking care of it was not a task.<br>It was respect.</p><p>By around 7:30 AM, everything was done.<br>I had taken a bath, freshened up, and felt ready for the day.</p><h4 class="font-bold text-xl mt-6 mb-2">Meeting Friends Again</h4><p>Later in the morning, a few travellers I had met earlier in the valley — guys from Arunachal Pradesh and Assam — called me.<br>We had crossed paths during the trek and connected well.</p><p>I stepped out and joined them for breakfast.<br>We spent some time together talking about the trek, travel stories, and future plans.</p><p>After breakfast, we took a small city walk around Kohima.</p><p>Sometimes travel friendships are short but meaningful.<br>Even a few hours together can create memories.</p><h4 class="font-bold text-xl mt-6 mb-2">Balancing Travel and Work</h4><p>By late morning, I returned to the hostel.<br>Like many other days of this journey, I had to balance travel and work.</p><p>So I opened my laptop and started working.<br>At the same time, I also began packing my luggage.</p><p>The next day I would leave for Manipur, another beautiful part of the Northeast.<br>Packing after so many days of travel had become easier.</p><p>I had learned something important during this journey:<br>The longer you travel,<br>the fewer things you realise you actually need.</p><h4 class="font-bold text-xl mt-6 mb-2">A Slow Afternoon</h4><p>Work that day was lighter than usual.<br>In the afternoon, I stepped out for a small walk and had lunch outside.<br>I also bought a few snacks for the next day’s ride.</p><p>Kohima had begun to feel familiar by then.<br>The streets, the people, the small cafés — everything felt comfortable.</p><h4 class="font-bold text-xl mt-6 mb-2">Preparing for the Road Again</h4><p>By around 6:30 PM, my work was finished.<br>I stepped out again, this time to refill my bike’s fuel tank.<br>Before entering remote regions, it’s always safer to carry a full tank.</p><p>After filling fuel, I had dinner outside and returned to the hostel around 7:30 PM.</p><h4 class="font-bold text-xl mt-6 mb-2">A Simple Goodbye Evening</h4><p>Since I was leaving the next day, the hostel staff and a few travellers spent some time talking with me.<br>In a short time, we had become comfortable with each other.</p><p>Travel often creates friendships quickly because everyone understands the same language — the road.</p><p>Later that night, I watched a movie and continued chatting with them.<br>Time passed quietly.<br>By around 11:30 PM, I finally went to sleep.</p><p>The next morning, the journey would begin again.<br>A new road.<br>A new state.<br>And another story waiting somewhere ahead.</p>', quote: '“Not every day on the road is about moving forward… some days are meant to rebuild you.”' },
        { type: 'chapter', id: 'ch32', title: 'Riding Into Uncertainty', chapter: 'Ch  32', stats: 'Perspective', image: 'images/chapter-32.jpg', desc: '<p>I woke up early that morning.<br>It was around 5 AM in Kohima.</p><p>Since I had already packed everything the previous night, the morning was simple. I just had to add a few small items — my tank bag and a few essentials.</p><p>By 5:30 AM, I started my bike and left the hostel.</p><p>That day’s destination was Imphal, the capital of Manipur.<br>The distance was only about 135 kilometres, but the expected travel time was nearly five hours. In the Northeast, distance often means very little — it is the road condition that decides how long the journey will take.</p><h4 class="font-bold text-xl mt-6 mb-2">The Road Changes</h4><p>The first part of the ride out of Kohima was smooth.<br>The cold morning air flowed through the hills, and the road was decent enough to ride comfortably.</p><p>But everything changed as I approached the Manipur border.<br>The road suddenly became extremely bad.</p><p>Dust covered the entire road. Trucks were moving slowly through thick clouds of dirt, and every few hundred metres my helmet visor would become completely muddy.<br>I had to stop frequently just to clean it.</p><p>Sometimes the dust was so thick that I could barely see ahead.</p><p>The road didn’t feel like a road anymore.<br>It felt like a test.<br>Every kilometre demanded patience.<br>Every stretch reminded me that this journey was not about comfort — it was about endurance.</p><h4 class="font-bold text-xl mt-6 mb-2">The Military Presence</h4><p>Soon another thing caught my attention.<br>Every hundred metres, there were military personnel standing on the roadside.</p><p>Military trucks.<br>Armed soldiers.<br>Security vehicles.</p><p>I had seen such scenes only in movies and news reports before.<br>But here it was real.</p><p>The atmosphere felt tense.<br>A strange feeling of uncertainty began to grow inside me.</p><p>Just two days earlier, someone had warned me about travelling through Manipur.<br>That memory returned to my mind.</p><p>For a moment I wondered:<br>Did I make a wrong decision coming this way?</p><p>The combination of terrible roads, heavy dust, and constant military presence made the ride feel uncomfortable.<br>But the only way forward was to keep riding.</p><p>At one point, I heard about a bomb blast incident that had happened earlier that day.<br>That thought stayed in my mind.<br>The road suddenly felt heavier.<br>Every sound felt louder.<br>Every movement around me felt more noticeable.</p><p>It was not fear exactly.<br>But it was awareness.<br>A deep sense that I was riding through a place that carried its own history, its own struggles, its own reality.</p><p>For almost 135 kilometres, there were hardly any facilities.<br>No restaurants.<br>No proper tea stalls.<br>No petrol pumps.<br>No repair shops.<br>Just broken roads, stones, dust, and military vehicles.</p><p>At one point I found a small place where I thought of stopping, but I decided to continue, hoping to find something better ahead.<br>But nothing appeared.</p><p>It was just road after road of rough terrain.</p><p>At times I even worried about my bike.<br>If the tyre punctured or the top box broke on those roads, I had no idea where I would find help.</p><p>But even in that uncertainty, I kept moving.<br>Because sometimes the road doesn’t give you options.<br>It only gives you direction.</p><h4 class="font-bold text-xl mt-6 mb-2">Finally Reaching Imphal</h4><p>Around 11 AM, after riding nearly 110 kilometres, the road slowly became better.<br>“Better” in the Northeast still means rough, but at least it was manageable.</p><p>Soon I reached Imphal.<br>I already knew about a hostel there, so I rode directly to it.</p><p>After parking my bike and checking in, the first thing I did was take a bath.<br>The dust from the road had covered my clothes, my jacket, and even my face.<br>It felt good to finally wash everything away.</p><p>And along with the dust, it felt like I had washed away the tension of the ride too.</p><h4 class="font-bold text-xl mt-6 mb-2">A Familiar Face</h4><p>Then something unexpected happened.<br>At the hostel, I saw a French traveller whom I had met earlier in Nagaland.</p><p>Seeing a familiar face in a new city felt comforting.<br>We spoke for a while and shared stories from the road.</p><p>Later in the afternoon, we went out together to explore a nearby market.</p><h4 class="font-bold text-xl mt-6 mb-2">Life Continues Normally</h4><p>By evening I finished my work and stepped out again.<br>I went for tea and then visited a Vishnu Temple nearby.</p><p>One thing I noticed inside the temple surprised me.<br>There were more military personnel than ordinary visitors.</p><p>It reminded me again how different life here was compared to other parts of India.<br>But at the same time, people were calm.<br>Going about their day.<br>Praying.<br>Living.</p><p>That contrast stayed with me.</p><img src="images/chapter-32_0.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><p>After visiting the temple, I stopped at a small exhibition nearby, spent some time there, and returned to the hostel around 7:30 PM.</p><h4 class="font-bold text-xl mt-6 mb-2">Cooking Together</h4><p>That evening became special in a simple way.<br>The French traveller and I decided to cook dinner ourselves.</p><p>We went to a nearby market and bought some vegetables before the shops closed.<br>Back at the hostel, I cooked tomato rice.<br>Another traveller from Tripura joined us.</p><p>Soon the hostel kitchen turned into a small gathering place.<br>We all sat together eating, talking, and sharing stories.<br>Even the hostel owner joined us. He was extremely friendly and welcoming.</p><img src="images/chapter-32_1.jpg" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-md my-8"><h4 class="font-bold text-xl mt-6 mb-2">Conversations Late Into the Night</h4><p>Travellers
